# Manual GUARDED 2026 Shadow Snapshot V1 T-30 closing-market capture.
# workflow_dispatch ONLY — no schedule, push, or pull_request.
# PREVIEW by default. COMMIT requires mode=COMMIT and
# confirm=CAPTURE_2026_WEEK_<week>_T30_CLOSING_V1.
#
# Writes ShadowClosingMarketSnapshot only for due games in the open
# T-30-to-kickoff window. Existing rows remain immutable; future games are
# skipped; unsnapshotted post-kickoff games are reported MISSED and are not
# backfilled.
#
# Uses persisted MarketLine rows only. No provider calls. Does not write
# prediction snapshots, evaluation rows, Bet, MatchupOutput, or run migrations.

name: Capture Shadow T-30 Closing Market V1 (Manual, Guarded)

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season year (must be 2026)'
        required: true
        type: string
        default: '2026'
      week:
        description: 'CFB week (positive integer)'
        required: true
        type: string
      mode:
        description: 'PREVIEW (DB read-only) or COMMIT (append-only due closing snapshots)'
        required: true
        type: choice
        options:
          - PREVIEW
          - COMMIT
        default: PREVIEW
      expected_main_sha:
        description: 'Exact main commit SHA authorized for this capture'
        required: true
        type: string
      confirm:
        description: 'For COMMIT, type CAPTURE_2026_WEEK_<week>_T30_CLOSING_V1 exactly'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: shadow-t30-closing-v1-production-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Source SHA guard
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "ACTUAL_SHA=${ACTUAL_SHA}" >> "$GITHUB_ENV"
          echo "actual_sha: ${ACTUAL_SHA}"
          echo "expected_main_sha: ${EXPECTED_MAIN_SHA}"
          echo "github_ref: ${GITHUB_REF:-}"
          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "::error::Refusing Shadow T-30 capture. Workflow must run from main."
            exit 1
          fi
          if [ -z "${EXPECTED_MAIN_SHA}" ]; then
            echo "::error::Refusing Shadow T-30 capture. expected_main_sha is required."
            exit 1
          fi
          if [ "${ACTUAL_SHA}" != "${EXPECTED_MAIN_SHA}" ]; then
            echo "::error::Refusing Shadow T-30 capture. Checked-out SHA does not match expected_main_sha."
            echo "::error::actual_sha=${ACTUAL_SHA}"
            echo "::error::expected_main_sha=${EXPECTED_MAIN_SHA}"
            exit 1
          fi
          echo "Source SHA guard passed."

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Preflight (names/presence only)
        env:
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_WEEK: ${{ inputs.week }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          echo "season=${INPUT_SEASON}"
          echo "week=${INPUT_WEEK}"
          echo "mode=${INPUT_MODE}"
          echo "PREVIEW IS DATABASE READ-ONLY"
          echo "providerCalls=0"
          echo "uses persisted MarketLine rows only"
          echo "PREVIEW timestamp will NOT become the COMMIT capture timestamp"
          echo "ODDS_API_KEY: not provided"
          echo "CFBD_API_KEY: not provided"
          echo "SGO_API_KEY: not provided"
          echo "VISUALCROSSING_API_KEY: not provided"

          if [ "$INPUT_SEASON" != "2026" ]; then
            echo "::error::season must equal 2026 (got ${INPUT_SEASON})"
            exit 1
          fi
          if ! [[ "$INPUT_WEEK" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::week must be a positive integer"
            exit 1
          fi
          if [ "$INPUT_MODE" != "PREVIEW" ] && [ "$INPUT_MODE" != "COMMIT" ]; then
            echo "::error::mode must be PREVIEW or COMMIT"
            exit 1
          fi
          EXPECTED="CAPTURE_2026_WEEK_${INPUT_WEEK}_T30_CLOSING_V1"
          if [ "$INPUT_MODE" = "COMMIT" ] && [ "$INPUT_CONFIRM" != "$EXPECTED" ]; then
            echo "::error::COMMIT requires confirm=${EXPECTED}"
            exit 1
          fi
          echo "Preflight OK (no production DB secret in this step)"

      - name: Install dependencies
        run: npm ci

      - name: Prisma version
        run: npx prisma -v

      - name: Run guarded Shadow T-30 Closing Market V1 capture
        env:
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_WEEK: ${{ inputs.week }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          mkdir -p reports
          if [ "$INPUT_MODE" = "COMMIT" ]; then
            npx tsx apps/jobs/capture-shadow-t30-closing-v1-2026.ts \
              --season "$INPUT_SEASON" \
              --week "$INPUT_WEEK" \
              --mode "$INPUT_MODE" \
              --confirm "$INPUT_CONFIRM" \
              --report "reports/shadow-t30-closing-v1-2026-${INPUT_SEASON}-week-${INPUT_WEEK}-commit.json"
          else
            npx tsx apps/jobs/capture-shadow-t30-closing-v1-2026.ts \
              --season "$INPUT_SEASON" \
              --week "$INPUT_WEEK" \
              --mode "$INPUT_MODE" \
              --report "reports/shadow-t30-closing-v1-2026-${INPUT_SEASON}-week-${INPUT_WEEK}-preview.json"
          fi

      - name: Upload Shadow T-30 Closing Market V1 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-t30-closing-v1-2026-w${{ inputs.week }}-${{ inputs.mode }}
          path: reports/shadow-t30-closing-v1-2026-*.json
          if-no-files-found: warn

      - name: Summary
        if: always()
        env:
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_WEEK: ${{ inputs.week }}
          INPUT_MODE: ${{ inputs.mode }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "==================================================="
          echo "SHADOW T-30 CLOSING MARKET V1 (MANUAL, GUARDED)"
          echo "==================================================="
          echo "season: ${INPUT_SEASON}"
          echo "week: ${INPUT_WEEK}"
          echo "mode: ${INPUT_MODE}"
          echo "expected_main_sha: ${EXPECTED_MAIN_SHA}"
          if [ -n "${ACTUAL_SHA:-}" ]; then
            echo "actual_sha: ${ACTUAL_SHA}"
          else
            echo "actual_sha: (unavailable)"
          fi
          echo "status: ${JOB_STATUS}"
          echo "providerCalls=0"
          echo "ShadowPredictionSnapshot writes: false"
          echo "ShadowEvaluationResult writes: false"
          echo "Bet writes: false"
          echo "MatchupOutput writes: false"
          echo "prisma migrate: not invoked"
          echo "no fall-forward after T-30"
          echo "no post-kickoff backfill"
          echo "PREVIEW timestamp will NOT become COMMIT timestamp"
          echo "==================================================="n