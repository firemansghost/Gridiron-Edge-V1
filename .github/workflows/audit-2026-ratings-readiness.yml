# Manual READ-ONLY audit of 2026 ratings inputs in production Supabase.
# workflow_dispatch ONLY — no schedule, push, or pull_request.
# Does not compute or persist ratings. Does not call CFBD or Odds API.
# Does not invoke ratings-v1, ratings-v2, talent sync, stats sync, nightly ingest, or migrations.

name: Audit 2026 Ratings Readiness (Manual, Read Only)

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season year (must be 2026)'
        required: true
        type: string
        default: '2026'

permissions:
  contents: read

concurrency:
  group: audit-2026-ratings-readiness-${{ inputs.season }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DIRECT_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Preflight (names/presence only)
        run: |
          set -euo pipefail
          SEASON="${{ inputs.season }}"
          echo "season_input=${SEASON}"
          if [ "$SEASON" != "2026" ]; then
            echo "::error::season must equal 2026 (got ${SEASON})"
            exit 1
          fi
          if [ -z "${DIRECT_URL:-}" ] && [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DIRECT_URL / DATABASE_URL secret is missing (required for read-only Prisma queries)"
            exit 1
          fi
          echo "CFBD_API_KEY: not provided"
          echo "ODDS_API_KEY: not provided"
          echo "DIRECT_URL: present (value not printed)"
          echo "database mutations: not invoked"
          echo "ratings computation: not invoked"
          echo "ratings persistence: not invoked"
          echo "providers: not invoked"
          echo "migrations: not invoked"
          echo "read-only boundary: audit CLI SELECT-only via RatingsReadinessReadStore (DIRECT_URL is not claimed as a DB read-only role)"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Audit 2026 ratings readiness (read-only)
        run: |
          npx tsx apps/jobs/audit-ratings-readiness.ts --season "${{ inputs.season }}"

      - name: Summary
        if: always()
        run: |
          echo "============================================"
          echo "AUDIT 2026 RATINGS READINESS (READ ONLY)"
          echo "============================================"
          echo "season: ${{ inputs.season }}"
          echo "status: ${{ job.status }}"
          echo "mode: read-only ratings-input inventory — no ratings write"
          echo "secrets used (names only): DIRECT_URL"
          echo "CFBD_API_KEY: not provided"
          echo "ODDS_API_KEY: not provided"
          echo "prohibited: ratings-v1, ratings-v2, talent sync, stats sync, nightly ingest, CFBD, Odds, migrations, mutations"
          echo "============================================"
