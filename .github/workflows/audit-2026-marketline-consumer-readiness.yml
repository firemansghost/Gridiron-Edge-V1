# Manual READ-ONLY audit: 2026 MarketLine append-only consumer readiness.
# workflow_dispatch ONLY — no schedule, push, or pull_request.
# SELECT only via DIRECT_URL. No ODDS_API_KEY / CFBD_API_KEY / SGO_API_KEY.
# No MarketLine / Bet / rating / Game writes. No provider calls.
#
# Security (PR #60 pattern):
# - Dispatch inputs reach shell only via step-level env (never ${{ inputs.* }} inside run:).
# - Production DIRECT_URL is NOT job-wide; scoped to preflight + execute.

name: Audit 2026 MarketLine Consumer Readiness (Manual, Read Only)

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season year (must be 2026)'
        required: true
        type: string
        default: '2026'
      week:
        description: 'CFB week (Week1 production snapshot = 1)'
        required: true
        type: string
        default: '1'

permissions:
  contents: read

concurrency:
  group: audit-2026-marketline-consumer-readiness-${{ inputs.season }}-${{ inputs.week }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Preflight (names/presence only)
        env:
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_WEEK: ${{ inputs.week }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          SEASON="$INPUT_SEASON"
          WEEK="$INPUT_WEEK"
          echo "season=${SEASON}"
          echo "week=${WEEK}"
          if [ "$SEASON" != "2026" ]; then
            echo "::error::season must equal 2026 (got ${SEASON})"
            exit 1
          fi
          if [ -z "${DIRECT_URL:-}" ]; then
            echo "::error::DIRECT_URL secret is missing"
            exit 1
          fi
          echo "DIRECT_URL: present (value not printed)"
          echo "ODDS_API_KEY: not provided"
          echo "CFBD_API_KEY: not provided"
          echo "SGO_API_KEY: not provided"
          echo "database mutations: not invoked"
          echo "provider calls: none"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DIRECT_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma_generate_placeholder
          DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma_generate_placeholder
        run: npm run prisma:generate

      - name: Audit MarketLine consumer readiness (read-only SELECT)
        env:
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_WEEK: ${{ inputs.week }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          npx tsx apps/jobs/audit-marketline-consumer-readiness.ts \
            --season "$INPUT_SEASON" \
            --week "$INPUT_WEEK"

      - name: Summary
        if: always()
        run: |
          echo "============================================"
          echo "AUDIT 2026 MARKETLINE CONSUMER READINESS"
          echo "============================================"
          echo "season: ${{ inputs.season }}"
          echo "week: ${{ inputs.week }}"
          echo "status: ${{ job.status }}"
          echo "mode: read-only SELECT — no Odds/CFBD/SGO keys"
          echo "secrets used (names only): DIRECT_URL"
          echo "prohibited: provider calls, MarketLine writes, bets, ratings, schedules"
          echo "============================================"
