# Manual READ-ONLY V4 Prospective V1 Week 4 preview.
# Provider calls capped at 6. No schedules. No persistence.

name: Preview V4 Prospective V1 2026 (Manual, Read Only)

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season (must be 2026)'
        required: true
        type: string
        default: '2026'
      week:
        description: 'Target week (must be 4)'
        required: true
        type: string
        default: '4'
      expected_main_sha:
        description: 'Exact main SHA authorized for this preview'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-v4-prospective-v1-${{ inputs.season }}-week-${{ inputs.week }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Source SHA guard
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "ACTUAL_SHA=${ACTUAL_SHA}" >> "$GITHUB_ENV"
          echo "actual_sha: ${ACTUAL_SHA}"
          echo "expected_main_sha: ${EXPECTED_MAIN_SHA}"
          echo "github_ref: ${GITHUB_REF:-}"
          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "::error::Workflow must run from main."
            exit 1
          fi
          if [ -z "${EXPECTED_MAIN_SHA}" ]; then
            echo "::error::expected_main_sha is required"
            exit 1
          fi
          if [ "${ACTUAL_SHA}" != "${EXPECTED_MAIN_SHA}" ]; then
            echo "::error::Checked-out SHA does not match expected_main_sha."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Preflight
        env:
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_WEEK: ${{ inputs.week }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          set -euo pipefail
          echo "season=${INPUT_SEASON}"
          echo "week=${INPUT_WEEK}"
          echo "researchOnly=true"
          echo "providerCallBudget=9"
          echo "mutationTargets=[]"
          echo "safeToPersistComparator=false"
          echo "persistenceAuthorized=false"
          echo "superTierAActivationAuthorized=false"
          echo "historicalBackfillAuthorized=false"
          echo "TeamSeasonRating writes=false"
          echo "Bet writes=false"
          echo "Shadow writes=false"
          echo "Game writes=false"
          echo "MarketLine writes=false"
          echo "Prisma migrate=false"
          if [ "${INPUT_SEASON}" != "2026" ]; then
            echo "::error::season must equal 2026"
            exit 1
          fi
          if [ "${INPUT_WEEK}" != "4" ]; then
            echo "::error::week must equal 4"
            exit 1
          fi
          if [ -z "${DIRECT_URL:-}" ]; then
            echo "::error::DIRECT_URL secret is missing"
            exit 1
          fi
          if [ -z "${CFBD_API_KEY:-}" ]; then
            echo "::error::CFBD_API_KEY secret is missing"
            exit 1
          fi
          echo "DIRECT_URL: present (not printed)"
          echo "CFBD_API_KEY: present (not printed)"

      - name: Install dependencies
        env:
          DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma_generate_placeholder
          DIRECT_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma_generate_placeholder
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma_generate_placeholder
          DIRECT_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma_generate_placeholder
        run: npm run prisma:generate

      - name: Run V4 Prospective V1 read-only preview
        env:
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_WEEK: ${{ inputs.week }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFBD_BASE_URL: ${{ vars.CFBD_BASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p reports/v4-prospective-v1-2026-week4-preview
          npx tsx apps/jobs/audit-v4-prospective-v1-preview-2026.ts             --season "$INPUT_SEASON"             --week "$INPUT_WEEK"             --output-dir reports/v4-prospective-v1-2026-week4-preview

      - name: Upload V4 Prospective V1 preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-prospective-v1-2026-week4-preview
          path: reports/v4-prospective-v1-2026-week4-preview/
          if-no-files-found: warn

      - name: Summary
        if: always()
        env:
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_WEEK: ${{ inputs.week }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "==================================================="
          echo "V4 PROSPECTIVE V1 WEEK 4 PREVIEW — READ ONLY"
          echo "==================================================="
          echo "season: ${INPUT_SEASON}"
          echo "week: ${INPUT_WEEK}"
          echo "expected_main_sha: ${EXPECTED_MAIN_SHA}"
          echo "actual_sha: ${ACTUAL_SHA:-unavailable}"
          echo "status: ${JOB_STATUS}"
          echo "providerCallBudget=9"
          echo "mutationsInvoked=false"
          echo "safeToPersistComparator=false"
          echo "persistenceAuthorized=false"
          echo "superTierAActivationAuthorized=false"
          echo "historicalBackfillAuthorized=false"
          echo "==================================================="
