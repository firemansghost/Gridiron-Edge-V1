# Windows Route A native lane for the already reviewed Framework helper.
# No DB, no secrets, no providers, no operator-root probes, no live pooler,
# no production writes, no pull_request_target, no privileged jobs, no SDK publish.
# The executable must already be the reviewed 20480-byte blob in Git.
# A missing or mismatched blob exits nonzero with native_lane=BLOCKED.
# Temp directories only. This job does not certify operator readiness.
#
# Targets stacked PR base: feat/ml-cal-1-g4-phase-a-w4-conflict-gate-ci-v1 (#258).
# pull_request checkout is GitHub's synthetic merge of PR head into that base.
# Direct workflow_dispatch checkout is the branch tip, not main and not a merge.
#
# Successor pin policy: W5 intentionally replaces the Phase A library blob.
# Historical #258 library bytes are verified from immutable commit 9ce55f11…
# (Git blob bytes + content SHA-256), not relabeled as the W5 successor.

name: Test ML-CAL-1 G4 W5 Route A Native

on:
  pull_request:
    branches:
      - 'feat/ml-cal-1-g4-phase-a-w4-conflict-gate-ci-v1'
    paths:
      - 'apps/jobs/lib/ml-cal-1-g4-windows-path-identity.ts'
      - 'apps/jobs/lib/ml-cal-1-g4-phase-a-retention-setup.ts'
      - 'apps/jobs/__tests__/ml-cal-1-g4-windows-path-identity.test.ts'
      - 'tools/windows-g4-fs-inspect/Program.cs'
      - 'tools/windows-g4-fs-inspect/WindowsG4FsInspect.csproj'
      - 'tools/windows-g4-fs-inspect/.gitignore'
      - 'research/moneyline/ML_CAL_1_G4_WINDOWS_W5_1_USAGE_20261015.md'
      - 'research/moneyline/ML_CAL_1_G4_WINDOWS_W5_1_RECOVERY_20261015.md'
      - 'research/moneyline/ML_CAL_1_G4_WINDOWS_W5_1_CHECKPOINT_20261015.md'
      - '.github/workflows/test-ml-cal-1-g4-w5-path-identity-v1.yml'
      - '.github/workflows/test-ml-cal-1-g4-w5-native-route-a-v1.yml'
      - 'tools/windows-g4-fs-inspect/reviewed-artifacts/.gitignore'
      - 'tools/windows-g4-fs-inspect/reviewed-artifacts/WindowsG4FsInspect-9fc710026f177525994126673f084274e94d17615ec136a72b60d3e7a558c9b5.exe'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-a-native:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Keep working-tree bytes equal to Git blobs
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Report checkout identity
        run: |
          set -euo pipefail
          echo "event_name=${GITHUB_EVENT_NAME}"
          echo "runner_os=${RUNNER_OS}"
          echo "uname=$(uname -a)"
          echo "checkout_HEAD=$(git rev-parse HEAD)"
          echo "checkout_parents=$(git rev-list --parents -n 1 HEAD)"
          echo "github_sha=${GITHUB_SHA}"
          echo "github_ref=${GITHUB_REF}"
          echo "github_head_ref=${GITHUB_HEAD_REF:-}"
          echo "github_base_ref=${GITHUB_BASE_REF:-}"
          echo "node_pending=setup_node_not_yet"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "checkout_kind=synthetic_pr_merge_of_source_head_into_base"
            echo "not_direct_source_checkout=true"
            echo "not_main=true"
          else
            echo "checkout_kind=direct_branch_checkout"
            echo "not_synthetic_pr_merge=true"
            echo "not_main=true"
          fi
          if [ -n "${GITHUB_EVENT_PATH:-}" ] && [ -f "${GITHUB_EVENT_PATH}" ]; then
            python - <<'PY'
          import json, os
          ev = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          pr = ev.get("pull_request") or {}
          head = pr.get("head") or {}
          base = pr.get("base") or {}
          print(f"pr_source_head={head.get('sha')}")
          print(f"pr_source_ref={head.get('ref')}")
          print(f"pr_base_sha={base.get('sha')}")
          print(f"pr_base_ref={base.get('ref')}")
          print(f"pr_number={pr.get('number')}")
          print("note=pull_request_checkout_HEAD_is_synthetic_merge_bind_pins_to_pr_source_head")
          PY
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Record Node toolchain
        run: |
          set -euo pipefail
          echo "node=$(node -v)"
          echo "npm=$(npm -v)"
          echo "no_env_dump=true"

      - name: Record Windows host evidence
        run: |
          set -euo pipefail
          echo "runner_os=${RUNNER_OS:-}"
          echo "image_os=${ImageOS:-}"
          echo "image_version=${ImageVersion:-}"
          echo "processor_architecture=${PROCESSOR_ARCHITECTURE:-}"
          echo "processor_identifier=${PROCESSOR_IDENTIFIER:-}"
          uname -a || true
          cmd.exe /c ver || true
          if [ -n "${WINDIR:-}" ] && [ -f "${WINDIR}/Microsoft.NET/Framework64/v4.0.30319/csc.exe" ]; then
            echo "framework64_csc=PRESENT"
          else
            echo "framework64_csc=ABSENT"
          fi
          if command -v dotnet >/dev/null 2>&1; then
            echo "dotnet_cli=PRESENT"
            dotnet --list-sdks || true
          else
            echo "dotnet_cli=ABSENT"
            echo "framework_route_does_not_require_dotnet_cli=true"
          fi
          echo "no_sdk_setup=true"
          echo "no_publish=true"
          echo "no_signing=true"

      - name: Install dependencies
        run: npm ci

      - name: Secret-free pin check (historical #258 library + W5 successor + reviewed files)
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess

          ACCEPTED_BASE = "9ce55f11f43156ba1ceb08dc57b88c48d9f9043a"
          HISTORICAL_LIB = "apps/jobs/lib/ml-cal-1-g4-phase-a-retention-setup.ts"

          def sha256_bytes(data: bytes) -> tuple[int, str]:
              return len(data), hashlib.sha256(data).hexdigest()

          def git_bytes(rev_path: str) -> bytes:
              return subprocess.check_output(["git", "cat-file", "blob", rev_path])

          def git_blob(rev_path: str) -> str:
              return subprocess.check_output(
                  ["git", "rev-parse", rev_path], text=True
              ).strip()

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          source_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          base_sha = ""
          if event == "pull_request":
              ev = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
              pr = ev["pull_request"]
              source_sha = pr["head"]["sha"]
              base_sha = pr["base"]["sha"]
              print("checkout_kind=synthetic_pr_merge")
              print(f"pr_source_head={source_sha}")
              print(f"pr_base_sha={base_sha}")
              assert base_sha == ACCEPTED_BASE, (
                  f"PR base {base_sha} != accepted #258 {ACCEPTED_BASE}"
              )
          else:
              print("checkout_kind=direct_branch_checkout")
              print(f"source_head={source_sha}")
              print("not_synthetic_merge=true")
              print("not_main=true")
          print(f"pin_source_head={source_sha}")
          print(f"accepted_base={ACCEPTED_BASE}")
          ancestor = subprocess.call(
              ["git", "merge-base", "--is-ancestor", ACCEPTED_BASE, "HEAD"]
          )
          assert ancestor == 0, "accepted #258 base is not an ancestor of checkout HEAD"

          reviewed = {
              "tools/windows-g4-fs-inspect/Program.cs": (
                  38655,
                  "02fe0670408dcc375a62d025dfeeb1480fba2279cac6dadc5a2c8a4ba04e517b",
              ),
              "tools/windows-g4-fs-inspect/WindowsG4FsInspect.csproj": (
                  696,
                  "d692a968b994d710890375344aae0cb5ac85436c9ab91696376d15ecade756ca",
              ),
              "tools/windows-g4-fs-inspect/.gitignore": (
                  28,
                  "1535b8cac593b5401cf2ed8f6e366cc6f1038a0b90004bbc6ea6690165b38fc1",
              ),
              "apps/jobs/lib/ml-cal-1-g4-windows-path-identity.ts": (
                  32738,
                  "7b60952a47e958b5091bd8e511390ce8fe0db255dc45c4639b1dcc916f08cd4f",
              ),
              "apps/jobs/lib/ml-cal-1-g4-phase-a-retention-setup.ts": (
                  91345,
                  "40bdf5702607f912143136ddc950f3fe17c376c839521736dc23dbc96659542e",
              ),
              "apps/jobs/__tests__/ml-cal-1-g4-windows-path-identity.test.ts": (
                  59327,
                  "6f0cf09356fba16abf4b525c4369c27460569f4fedc4e6bea16c1fe7fcb4e9f0",
              ),
              "research/moneyline/ML_CAL_1_G4_WINDOWS_W5_1_USAGE_20261015.md": (
                  2636,
                  "639bb14ad8c7098506cb50af6023e01fb2d75c64a5f0ca5f5a4b1db3350d6b3a",
              ),
              "research/moneyline/ML_CAL_1_G4_WINDOWS_W5_1_RECOVERY_20261015.md": (
                  1124,
                  "900f7822b39fceba5cfa889cbeb6359223e1de244f3ffb631476d047de9172e5",
              ),
              "research/moneyline/ML_CAL_1_G4_WINDOWS_W5_1_CHECKPOINT_20261015.md": (
                  1008,
                  "3abe6ad01e0c1fd4a3415830a73b6162d35951e47602d40d586e9fead4794a6b",
              ),
              "tools/windows-g4-fs-inspect/reviewed-artifacts/.gitignore": (
                  190,
                  "48a9420b7d640ca3c7ed4ba7e633b3ef5f96d58c777bc37b8422b3fcc8e7acdc",
              ),
          }
          for path, (exp_len, exp_sha) in reviewed.items():
              executed = pathlib.Path(path).read_bytes()
              source_blob = git_bytes(f"{source_sha}:{path}")
              ex_len, ex_sha = sha256_bytes(executed)
              src_len, src_sha = sha256_bytes(source_blob)
              assert executed == source_blob, f"{path} executed bytes != source head blob"
              assert ex_len == exp_len and ex_sha == exp_sha, (
                  f"{path} executed {ex_len} {ex_sha} != {exp_len} {exp_sha}"
              )
              assert src_len == exp_len and src_sha == exp_sha
              print(
                  f"ok REVIEWED_EXECUTED {path} blob={git_blob(f'{source_sha}:{path}')} "
                  f"bytes={ex_len} sha256={ex_sha} source_head={source_sha}"
              )

          hist = git_bytes(f"{ACCEPTED_BASE}:{HISTORICAL_LIB}")
          hist_len, hist_sha = sha256_bytes(hist)
          hist_blob = git_blob(f"{ACCEPTED_BASE}:{HISTORICAL_LIB}")
          assert hist_blob == "a82ce78206236343d59bbeacc9db3e0b2041af90"
          assert hist_len == 89980, f"HISTORICAL bytes {hist_len} != 89980"
          assert hist_sha == "8c7b3fc99263d2f37332002ba0e46cd5f13fd24afb1693383ad427c552762d86"
          print(
              f"ok HISTORICAL_258_LIBRARY blob={hist_blob} bytes={hist_len} "
              f"sha256={hist_sha} at {ACCEPTED_BASE}"
          )

          succ = pathlib.Path(HISTORICAL_LIB).read_bytes()
          succ_len, succ_sha = sha256_bytes(succ)
          succ_blob = git_blob(f"{source_sha}:{HISTORICAL_LIB}")
          assert succ_len == 91345
          assert succ_sha == "40bdf5702607f912143136ddc950f3fe17c376c839521736dc23dbc96659542e"
          assert succ_blob != hist_blob
          print(
              f"ok W5_SUCCESSOR_LIBRARY blob={succ_blob} bytes={succ_len} "
              f"sha256={succ_sha} (intentionally != historical {hist_blob})"
          )

          design = pathlib.Path(
              "research/moneyline/ML_CAL_1_G4_NONFIXTURE_OBSERVER_POOLER_PREFLIGHT_PROCEDURE_DESIGN_20261013.md"
          ).read_bytes()
          plan = pathlib.Path(
              "research/moneyline/ML_CAL_1_G4_RETENTION_PREFLIGHT_EXECUTION_PLAN_20261013.md"
          ).read_bytes()
          design_len, design_sha = sha256_bytes(design)
          plan_len, plan_sha = sha256_bytes(plan)
          assert design_sha == "55d4a3d72877abcf154461a6504bb702791339b41721729116472187fab7c95f"
          assert plan_len == 36740
          assert plan_sha == "22230e3946bc0fdc7753842c6dea362619f96b9b552c5a622571479fdc6d0926"
          print(f"ok design bytes={design_len} sha256={design_sha}")
          print(f"ok execution_plan bytes={plan_len} sha256={plan_sha}")

          inherited = {
              "apps/jobs/lib/ml-cal-1-g4-phase-a-json-command.ts":
                  "8b9aac3ec3fb618a2f67aced4c3025f73fe5eadb",
              "apps/jobs/run-ml-cal-1-g4-phase-a-json-command.ts":
                  "6bea4c4fec4e4c77e3c02501ce431ac876267fef",
              "apps/jobs/__tests__/ml-cal-1-g4-phase-a-json-command.test.ts":
                  "64b435c5d9a8af7695d6800dba0fe6ba89b2405a",
              "apps/jobs/run-ml-cal-1-g4-phase-a-retention-setup.ts":
                  "b6d84ac5fc72b3e5a4d7a129d68f953446a6fb56",
              "apps/jobs/__tests__/ml-cal-1-g4-phase-a-retention-setup.test.ts":
                  "ed9ffad9c45bf714ffc9199ff8a16c7057b44fad",
              "apps/jobs/lib/ml-cal-1-g4-pooler-preflight-live-runner.ts":
                  "ea201d6e401d298f604cc06bb022e43c75782df6",
              "apps/jobs/lib/ml-cal-1-g4-pooler-preflight-live-reader.ts":
                  "94b2aac959840cbbd8178ea0f6bd5cd354295e37",
              "apps/jobs/run-ml-cal-1-g4-pooler-preflight-live.ts":
                  "25f495fc5d154be1a6faa8300b2462fc33dc95cb",
              "apps/jobs/lib/ml-cal-1-g4-pooler-preflight-real-adapter.ts":
                  "a61a046a8128012c58046062d20b514ea2fad85a",
              "apps/jobs/lib/ml-cal-1-g4-pooler-preflight-fixture.ts":
                  "14f726efd60e8c4b0b14924f4a19470c2b8cd1cf",
              "apps/jobs/__tests__/ml-cal-1-g4-phase-a-w4-conflict-gate.test.ts":
                  "39ff24dcec7d39c1fb5fc8b79a38d999979a4d84",
              "apps/jobs/__tests__/ml-cal-1-g4-pooler-preflight-live-runner.test.ts":
                  "08c07a3cf1f0d855a03af88a73965bcb81536fb3",
              "apps/jobs/__tests__/ml-cal-1-g4-pooler-preflight-real-adapter.test.ts":
                  "a5d049808299d2cab651d3543c9a03632994bf7a",
              "apps/jobs/__tests__/ml-cal-1-g4-pooler-preflight-fixture.test.ts":
                  "225dc3188f84065dd0c5b5fb4aeee8ebd7d4c75f",
              "apps/jobs/__tests__/ml-cal-1-lifecycle-binding.test.ts":
                  "7aeee68eb90b5a2b052d11cd7a38f2da05fbed6d",
              "apps/jobs/__tests__/ml-cal-1-capture-binding-integration.test.ts":
                  "129b349a6e09c1cea6bcf440622a966d75512a11",
              "apps/jobs/__tests__/ml-cal-1-capture-binding-g3.test.ts":
                  "472fe71eeb471ef1e4e52a57862a71ed5a1d3037",
              "apps/jobs/__tests__/ml-cal-1-lifecycle-binding-observer-g4.test.ts":
                  "70e2d40f13742c8095e920ac01acb78d6f986eca",
              "package.json": "9dd5f3e9c136c4c0df0f7f46cf03c3a548052e73",
              "package-lock.json": "8c19ca0d028900a235d57b69f6802d2423b22af6",
          }
          for path, expected in inherited.items():
              base_blob = git_blob(f"{ACCEPTED_BASE}:{path}")
              head_blob = git_blob(f"HEAD:{path}")
              source_blob = git_blob(f"{source_sha}:{path}")
              assert base_blob == expected, f"{path} base {base_blob} != {expected}"
              assert head_blob == expected, f"{path} HEAD {head_blob} != {expected}"
              assert source_blob == expected, f"{path} source {source_blob} != {expected}"
              print(f"ok inherited_unchanged {path} blob={head_blob}")

          for rel in [
              HISTORICAL_LIB,
              "apps/jobs/lib/ml-cal-1-g4-windows-path-identity.ts",
              "apps/jobs/run-ml-cal-1-g4-phase-a-retention-setup.ts",
              "apps/jobs/lib/ml-cal-1-g4-phase-a-json-command.ts",
              "apps/jobs/run-ml-cal-1-g4-phase-a-json-command.ts",
          ]:
              text = pathlib.Path(rel).read_text(encoding="utf-8")
              assert "new PrismaClient" not in text, rel
              assert "process.env.DATABASE_URL" not in text, rel
              assert "process.env.DIRECT_URL" not in text, rel
              print(f"ok passive/gated {rel}")

          lib = pathlib.Path(HISTORICAL_LIB).read_text(encoding="utf-8")
          assert "ML_CAL_1_G4_PHASE_A_DESIGN_SHA256" in lib
          print("ok design_pin_present_in_w5_successor_library")

          secretish = re.compile(
              r"(?i)(api[_-]?key\s*[:=]\s*\S+|password\s*[:=]\s*\S+|bearer\s+[a-z0-9._-]{8,}|"
              r"ghp_[A-Za-z0-9]+|(DATABASE_URL|DIRECT_URL)\s*[:=]\s*\S+)"
          )
          for rel in list(reviewed) + [
              ".github/workflows/test-ml-cal-1-g4-w5-path-identity-v1.yml",
              ".github/workflows/test-ml-cal-1-g4-w5-native-route-a-v1.yml",
          ]:
              text = pathlib.Path(rel).read_text(encoding="utf-8")
              assert not secretish.search(text), rel
          print("ok secret-free scan (scoped W5 files + workflow)")
          print("ok dependencies_unchanged package.json package-lock.json")
          ART = (
              "tools/windows-g4-fs-inspect/reviewed-artifacts/"
              "WindowsG4FsInspect-9fc710026f177525994126673f084274e94d17615ec136a72b60d3e7a558c9b5.exe"
          )
          ART_LEN = 20480
          ART_SHA = "9fc710026f177525994126673f084274e94d17615ec136a72b60d3e7a558c9b5"
          bin_rel = "tools/windows-g4-fs-inspect/bin/WindowsG4FsInspect.exe"
          bin_present = subprocess.call(
              ["git", "cat-file", "-e", f"{source_sha}:{bin_rel}"]
          ) == 0
          assert not bin_present, (
              f"launcher bin exe must stay out of source head {source_sha}"
          )
          print(f"ok launcher_bin_exe_absent_from_source_head={source_sha}")
          art_in_git = subprocess.call(
              ["git", "cat-file", "-e", f"{source_sha}:{ART}"]
          ) == 0
          work_art = pathlib.Path(ART)
          print(f"expected_artifact_bytes={ART_LEN}")
          print(f"expected_artifact_sha256={ART_SHA}")
          assert art_in_git, (
              f"native_lane=BLOCKED missing_artifact source_head={source_sha} path={ART}"
          )
          assert work_art.is_file(), (
              f"native_lane=BLOCKED working tree missing reviewed artifact {ART}"
          )
          blob = git_bytes(f"{source_sha}:{ART}")
          disk = work_art.read_bytes()
          b_len, b_sha = sha256_bytes(blob)
          d_len, d_sha = sha256_bytes(disk)
          print(f"source_artifact_bytes={b_len} source_artifact_sha256={b_sha}")
          print(f"working_artifact_bytes={d_len} working_artifact_sha256={d_sha}")
          assert disk == blob, (
              f"reviewed artifact working bytes != source head blob {source_sha}"
          )
          assert (b_len, b_sha) == (ART_LEN, ART_SHA), (
              f"artifact {b_len} {b_sha} != {ART_LEN} {ART_SHA}"
          )
          print(f"ok REVIEWED_ARTIFACT source_head={source_sha}")
          print("ok no_env_dump no_secret_exfiltration")
          print("ok HISTORICAL_258_vs_W5_SUCCESSOR pins labeled and distinct")
          PY

      - name: Materialize reviewed helper to the launcher bin path
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          source_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          if event == "pull_request":
              ev = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
              source_sha = ev["pull_request"]["head"]["sha"]
              print("checkout_kind=synthetic_pr_merge")
              print(f"pr_source_head={source_sha}")
              print(f"pr_base_sha={ev['pull_request']['base']['sha']}")
          else:
              print("checkout_kind=direct_branch_checkout")
              print(f"source_head={source_sha}")
              print("not_synthetic_merge=true")
              print("not_main=true")
          art = (
              "tools/windows-g4-fs-inspect/reviewed-artifacts/"
              "WindowsG4FsInspect-9fc710026f177525994126673f084274e94d17615ec136a72b60d3e7a558c9b5.exe"
          )
          expected_len = 20480
          expected_sha = "9fc710026f177525994126673f084274e94d17615ec136a72b60d3e7a558c9b5"
          print(f"pin_source_head={source_sha}")
          print(f"expected_artifact_bytes={expected_len}")
          print(f"expected_artifact_sha256={expected_sha}")
          probe = subprocess.call(["git", "cat-file", "-e", f"{source_sha}:{art}"])
          if probe != 0:
              print("native_lane=BLOCKED")
              print("reason=missing_artifact")
              print(f"artifact={art}")
              sys.exit(1)
          blob = subprocess.check_output(["git", "cat-file", "blob", f"{source_sha}:{art}"])
          disk = pathlib.Path(art).read_bytes()

          def digest(data):
              return len(data), hashlib.sha256(data).hexdigest()

          b_len, b_sha = digest(blob)
          d_len, d_sha = digest(disk)
          print(f"source_artifact_bytes={b_len} source_artifact_sha256={b_sha}")
          print(f"working_artifact_bytes={d_len} working_artifact_sha256={d_sha}")
          if disk != blob or (b_len, b_sha) != (expected_len, expected_sha):
              print("native_lane=BLOCKED")
              print("reason=digest_mismatch")
              sys.exit(1)
          dest = pathlib.Path("tools/windows-g4-fs-inspect/bin/WindowsG4FsInspect.exe")
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_bytes(blob)
          got = dest.read_bytes()
          g_len, g_sha = digest(got)
          print(f"bin_bytes={g_len} bin_sha256={g_sha}")
          if got != blob or (g_len, g_sha) != (expected_len, expected_sha):
              print("native_lane=BLOCKED")
              print("reason=bin_materialize_mismatch")
              sys.exit(1)
          print("native_lane=MATERIALIZED")
          print("ok bin_exe_matches_source_head_blob")
          PY

      - name: Run inherited W4 conflict-gate suite
        run: |
