      - name: Classify Jest counts and W5 coverage
        if: always()
        run: |
          python - <<'PY'
          # CLASSIFIER_IMPL_BEGIN
          import json
          import pathlib
          import re
          from collections import Counter

          SUITE_EXPECTATIONS = (
              ("w4", "jest-w4.json", 25),
              ("json", "jest-json.json", 33),
              ("phase_a", "jest-phase-a.json", 27),
              ("runner", "jest-runner.json", 30),
              ("adapter", "jest-adapter.json", 21),
              ("fixture", "jest-fixture.json", 34),
              ("binding_g2_g3_g4", "jest-binding.json", 136),
              ("w5_focused", "jest-w5.json", 39),
          )

          # One Jest JSON file can cover several test paths. Each path must appear once.
          SUITE_FILES = {
              "w4": ("apps/jobs/__tests__/ml-cal-1-g4-phase-a-w4-conflict-gate.test.ts",),
              "json": ("apps/jobs/__tests__/ml-cal-1-g4-phase-a-json-command.test.ts",),
              "phase_a": ("apps/jobs/__tests__/ml-cal-1-g4-phase-a-retention-setup.test.ts",),
              "runner": ("apps/jobs/__tests__/ml-cal-1-g4-pooler-preflight-live-runner.test.ts",),
              "adapter": ("apps/jobs/__tests__/ml-cal-1-g4-pooler-preflight-real-adapter.test.ts",),
              "fixture": ("apps/jobs/__tests__/ml-cal-1-g4-pooler-preflight-fixture.test.ts",),
              "binding_g2_g3_g4": (
                  "apps/jobs/__tests__/ml-cal-1-lifecycle-binding.test.ts",
                  "apps/jobs/__tests__/ml-cal-1-capture-binding-integration.test.ts",
                  "apps/jobs/__tests__/ml-cal-1-capture-binding-g3.test.ts",
                  "apps/jobs/__tests__/ml-cal-1-lifecycle-binding-observer-g4.test.ts",
              ),
              "w5_focused": ("apps/jobs/__tests__/ml-cal-1-g4-windows-path-identity.test.ts",),
          }

          # Describe name, test title. Source order of the unchanged W5 test file.
          W5_CASES = (
              ("W5 helper pin + frozen caps", "records frozen caps and pin constants"),
              ("W5 helper pin + frozen caps", "verifies disposable helper pin when binary present"),
              ("PASS evidence gate", "rejects PASS with reasons / missing identity / malformed segments"),
              ("PASS evidence gate", 'rejects impossible all-"x" PASS and REFUSE_ALIAS segment PASS'),
              ("PASS evidence gate", "async+sync launchers refuse independently reproduced impossible PASS payloads"),
              ("PASS evidence gate", "async launcher refuses incomplete PASS JSON"),
              ("PASS evidence gate", "buildW5HelperEnv strips ambient G4_W5_TEST_* unless handshake enabled"),
              ("PASS evidence gate", "strips lowercase, mixed-case, and duplicate-case G4_W5_TEST_* variants"),
              ("PASS evidence gate", "async+sync launchers strip casing variants from spawn env"),
              ("W5 async launcher refusal surfaces (mocked spawn)", "does not pass maxBuffer into spawn options"),
              ("W5 async launcher refusal surfaces (mocked spawn)", "stdout/stderr overflow refuse"),
              ("W5 async launcher refusal surfaces (mocked spawn)", "timeout settles even when kill does not close"),
              ("W5 async launcher refusal surfaces (mocked spawn)", "stdin error settles"),
              ("W5 async launcher refusal surfaces (mocked spawn)", "schema/binding/nonzero refuse"),
              ("W5 async launcher refusal surfaces (mocked spawn)", "exact-cap complete PASS evidence accepted"),
              ("W5 sync launcher path (actual sync contract)", "pin mismatch does not spawnSync"),
              ("W5 sync launcher path (actual sync contract)", "schema mismatch / incomplete PASS refuse on sync path"),
              ("W5 sync launcher path (actual sync contract)", "sync timeout refuse"),
              ("W5 sync launcher path (actual sync contract)", "sync combined ceiling allows independent stream sizes under each cap"),
              ("W5 sync launcher path (actual sync contract)", "sync ENOBUFS / maxBuffer overflow refuse"),
              ("W5 sync launcher path (actual sync contract)", "sync stdout over dedicated cap refuse after collection"),
              ("W5 sync launcher path (actual sync contract)", "sync uses maxBuffer = stdoutCap + stderrCap"),
              ("Operator W5-only always BLOCKED (library/CLI/JSON)", "W5 PASS stub still leaves operator setup BLOCKED with zero mutation"),
              ("Operator W5-only always BLOCKED (library/CLI/JSON)", "W5 non-PASS: no clock, no user-root mutation"),
              ("Operator W5-only always BLOCKED (library/CLI/JSON)", "disabled: zero W5, clock, mutation"),
              ("Operator W5-only always BLOCKED (library/CLI/JSON)", "W4 refusal: no W5 inspect"),
              ("Operator W5-only always BLOCKED (library/CLI/JSON)", "temp mode skips W5 and can succeed"),
              ("Operator W5-only always BLOCKED (library/CLI/JSON)", "CLI/JSON operator BLOCKED"),
              ("unmocked non-Windows platform refusal", "refuses before spawn when the host platform is not win32"),
              ("Native W5 disposable Windows readback", "ordinary existing path PASS"),
              ("Native W5 disposable Windows readback", "missing leaf/ancestor BLOCKED"),
              ("Native W5 disposable Windows readback", "long / Unicode names"),
              ("Native W5 disposable Windows readback", "junction alias segment REFUSE (pre-existing)"),
              ("Native W5 disposable Windows readback", "dir symlink UNVERIFIED without privilege"),
              ("Native W5 disposable Windows readback", "controlled normal-directory parent swap via explicit handshake"),
              ("Native W5 disposable Windows readback", "controlled junction replacement during inspection via explicit handshake"),
              ("Native W5 disposable Windows readback", "ordinary inspection with ambient casing-variant G4_W5_TEST_* writes no handshake files"),
              ("Native W5 disposable Windows readback", "case-sensitive parent UNVERIFIED without privileged fixture"),
              ("Positive mutation recorder control", "temp success records mutations"),
          )

          # Derived from unchanged skipUnverified branches in
          # apps/jobs/__tests__/ml-cal-1-g4-windows-path-identity.test.ts.
          # Linux (!win32, helper not used): pin test, eight native-describe
          # helper gates, and the always-unverified case-sensitive parent test.
          LINUX_REASONS = {
              "helper exe absent or non-Windows": 1,
              "native helper unavailable": 8,
              "case-sensitive directory fixture requires privileged fsutil; not elevated in this task": 1,
          }
          LINUX_COUNTERS = (0, 28, 10, 10)  # native, mocked, skipped, unverified

          CASE_REASON = (
              "case-sensitive directory fixture requires privileged fsutil; not elevated in this task"
          )
          NON_WINDOWS_REASON = (
              "non-Windows platform refusal is not observable while process.platform is win32"
          )
          # Node's symlink exception text. Only EPERM and EACCES are privilege failures.
          # EIO, ENOSPC, a bare prefix, and any other code are not this gap.
          SYMLINK_PRIVILEGE_RE = re.compile(
              r"^dir symlink create requires privilege: Error: (EPERM|EACCES): \S"
          )
          FORBIDDEN_EXACT = {
              "native helper unavailable",
              "helper exe absent or non-Windows",
              "handshake ready not observed",
          }
          FORBIDDEN_PREFIXES = (
              "junction create failed:",
              "junction swap failed:",
          )
          COV_LINE = re.compile(
              r"^\s*\[W5 coverage\] native=(\d+) mocked=(\d+) skipped=(\d+) unverified=(\d+)\s*$"
          )
          WARN_LINE = re.compile(r"^\s*\[W5\] SKIPPED/UNVERIFIED:\s*(.*?)\s*$")
          ASSERTION_STATUSES = ("passed", "failed", "pending", "todo", "skipped")
          JEST_FIELDS = (
              "success",
              "numFailedTestSuites",
              "numFailedTests",
              "numPassedTestSuites",
              "numPassedTests",
              "numPendingTestSuites",
              "numPendingTests",
              "numRuntimeErrorTestSuites",
              "numTodoTests",
              "numTotalTestSuites",
              "numTotalTests",
              "testResults",
          )


          def _norm_path(value):
              return str(value).replace("\\", "/")


          def _matches_file(result_name, rel):
              norm = _norm_path(result_name)
              return norm == rel or norm.endswith("/" + rel)


          def check_inventory(name, expected_count, data, errors):
              """Reconcile Jest aggregates with per-file assertionResults.

              Custom W5 unverified/skipped counters are not Jest pending and are not
              read here. This frozen inventory expects every assertion to have passed:
              pending and todo are unexpected even when the custom counters are non-zero.
              """
              missing = [key for key in JEST_FIELDS if key not in data]
              for key in missing:
                  errors.append(f"jest_field_missing {name} {key}")
              if missing:
                  return
              results = data["testResults"]
              if not isinstance(results, list):
                  errors.append(f"jest_test_results_not_list {name}")
                  return
              expected_files = SUITE_FILES[name]
              if len(results) != len(expected_files):
                  errors.append(
                      f"jest_suite_file_count {name} expected={len(expected_files)} actual={len(results)}"
                  )
              matched = {rel: [] for rel in expected_files}
              for result in results:
                  if not isinstance(result, dict):
                      errors.append(f"jest_suite_result_not_object {name}")
                      continue
                  result_name = result.get("name")
                  hit = None
                  if isinstance(result_name, str):
                      for rel in expected_files:
                          if _matches_file(result_name, rel):
                              hit = rel
                              break
                  if hit is None:
                      errors.append(f"jest_suite_file_unexpected {name} name={result_name}")
                  else:
                      matched[hit].append(result)
                  if result.get("status") != "passed":
                      errors.append(
                          f"jest_suite_not_passed {name} status={result.get('status')} name={result_name}"
                      )
              for rel, hits in matched.items():
                  if len(hits) == 0:
                      errors.append(f"jest_suite_file_missing {name} {rel}")
                  elif len(hits) > 1:
                      errors.append(f"jest_suite_file_duplicate {name} {rel} count={len(hits)}")

              assertions = []
              for result in results:
                  if not isinstance(result, dict):
                      continue
                  rows = result.get("assertionResults")
                  if not isinstance(rows, list):
                      errors.append(f"jest_assertions_missing {name} name={result.get('name')}")
                      continue
                  identities = []
                  for row_index, row in enumerate(rows):
                      if not isinstance(row, dict):
                          errors.append(f"jest_assertion_not_object {name} index={row_index}")
                          continue
                      status = row.get("status")
                      title = row.get("title")
                      ancestors = row.get("ancestorTitles")
                      if not isinstance(title, str) or title == "":
                          errors.append(f"jest_assertion_title_missing {name} index={row_index}")
                      if status not in ASSERTION_STATUSES:
                          errors.append(
                              f"jest_assertion_status_unexpected {name} status={status} title={title}"
                          )
                      if not isinstance(ancestors, list) or not ancestors:
                          errors.append(f"jest_assertion_ancestors_missing {name} title={title}")
                      else:
                          identities.append((tuple(ancestors), title))
                      assertions.append(row)
                  identity_counts = Counter(identities)
                  for identity, count in identity_counts.items():
                      if count > 1:
                          errors.append(f"jest_assertion_duplicate {name} title={identity[1]} count={count}")

              counts = Counter(
                  row.get("status") for row in assertions if isinstance(row, dict)
              )
              passed = counts["passed"]
              failed = counts["failed"]
              pending = counts["pending"] + counts["skipped"]
              todo = counts["todo"]
              total = passed + failed + pending + todo
              if data["numPassedTests"] != passed:
                  errors.append(
                      f"jest_passed_mismatch {name} aggregate={data['numPassedTests']} assertions={passed}"
                  )
              if data["numFailedTests"] != failed:
                  errors.append(
                      f"jest_failed_mismatch {name} aggregate={data['numFailedTests']} assertions={failed}"
                  )
              if data["numPendingTests"] != pending:
                  errors.append(
                      f"jest_pending_mismatch {name} aggregate={data['numPendingTests']} assertions={pending}"
                  )
              if data["numTodoTests"] != todo:
                  errors.append(
                      f"jest_todo_mismatch {name} aggregate={data['numTodoTests']} assertions={todo}"
                  )
              if data["numTotalTests"] != total or len(assertions) != total:
                  errors.append(
                      f"jest_total_mismatch {name} aggregate={data['numTotalTests']} "
                      f"status_sum={total} assertions={len(assertions)}"
                  )
              if (
                  data["numPassedTests"]
                  + data["numFailedTests"]
                  + data["numPendingTests"]
                  + data["numTodoTests"]
                  != data["numTotalTests"]
              ):
                  errors.append(
                      f"jest_aggregate_contradiction {name} "
                      f"passed={data['numPassedTests']} failed={data['numFailedTests']} "
                      f"pending={data['numPendingTests']} todo={data['numTodoTests']} "
                      f"total={data['numTotalTests']}"
                  )
              if pending != 0:
                  errors.append(f"jest_pending_unexpected {name} pending={pending}")
              if todo != 0:
                  errors.append(f"jest_todo_unexpected {name} todo={todo}")
              if data["numPendingTestSuites"] != 0:
                  errors.append(
                      f"jest_pending_suites_unexpected {name} count={data['numPendingTestSuites']}"
                  )
              if data["numFailedTestSuites"] != 0:
                  errors.append(f"jest_failed_suites {name} count={data['numFailedTestSuites']}")
              if data["numRuntimeErrorTestSuites"] != 0:
                  errors.append(
                      f"jest_runtime_error_suites {name} count={data['numRuntimeErrorTestSuites']}"
                  )
              if data["numPassedTestSuites"] != len(expected_files):
                  errors.append(
                      f"jest_passed_suites {name} expected={len(expected_files)} "
                      f"actual={data['numPassedTestSuites']}"
                  )
              if data["numTotalTestSuites"] != len(expected_files):
                  errors.append(
                      f"jest_total_suites {name} expected={len(expected_files)} "
                      f"actual={data['numTotalTestSuites']}"
                  )
              if data["success"] is not True:
                  errors.append(f"jest_unsuccessful {name} success={data['success']}")
              if data["numFailedTests"] != 0:
                  errors.append(f"jest_failed_tests {name} failed={data['numFailedTests']}")
              if data["numPassedTests"] != expected_count or data["numTotalTests"] != expected_count:
                  errors.append(
                      f"jest_count {name} expected_passed_and_total={expected_count} "
                      f"actual_passed={data['numPassedTests']} actual_total={data['numTotalTests']}"
                  )
              if name != "w5_focused":
                  return
              actual_cases = []
              for result in results:
                  if not isinstance(result, dict):
                      continue
                  rows = result.get("assertionResults")
                  if not isinstance(rows, list):
                      continue
                  for row in rows:
                      if not isinstance(row, dict):
                          continue
                      ancestors = row.get("ancestorTitles")
                      describe = ancestors[0] if isinstance(ancestors, list) and len(ancestors) == 1 else None
                      actual_cases.append((describe, row.get("title")))
              if tuple(actual_cases) != W5_CASES:
                  errors.append(
                      f"w5_test_identity_mismatch expected={len(W5_CASES)} actual={len(actual_cases)}"
                  )


          def classify(lane, suites, log_text):
              """Return error strings. Empty means the lane evidence is acceptable.

              suites maps the suite name to parsed Jest JSON, None when the file is
              missing, or {"_malformed": "..."} when JSON parsing failed.
              Jest pending is an inventory field. It is not the custom unverified counter.
              native+mocked+skipped is not a partition of Jest functions.
              """
              errors = []
              if lane not in ("linux", "windows"):
                  errors.append(f"unknown_lane {lane}")

              inherited_passed = 0
              for name, _filename, expected in SUITE_EXPECTATIONS:
                  data = suites.get(name, None)
                  if data is None:
                      errors.append(f"jest_json_missing {name}")
                      continue
                  if isinstance(data, dict) and "_malformed" in data and len(data) == 1:
                      errors.append(f"jest_json_malformed {name} {data['_malformed']}")
                      continue
                  if not isinstance(data, dict):
                      errors.append(f"jest_json_malformed {name} not_an_object")
                      continue
                  check_inventory(name, expected, data, errors)
                  passed = data.get("numPassedTests")
                  if name != "w5_focused" and isinstance(passed, int):
                      inherited_passed += passed
              if inherited_passed != 306:
                  errors.append(f"jest_inherited_passed_sum {inherited_passed} != 306")

              cov_hits = []
              for line in log_text.splitlines():
                  # Jest call-site frames echo the template. Only message lines count.
                  if not line.lstrip().startswith("[W5 coverage]"):
                      continue
                  match = COV_LINE.fullmatch(line)
                  if match is None:
                      errors.append(f"coverage_line_malformed {line.strip()}")
                      continue
                  cov_hits.append(tuple(int(part) for part in match.groups()))
              if len(cov_hits) == 0:
                  errors.append("coverage_line_missing")
                  native = mocked = skipped = unverified = None
              elif len(cov_hits) > 1:
                  errors.append(f"coverage_line_duplicate count={len(cov_hits)}")
                  native = mocked = skipped = unverified = None
              else:
                  native, mocked, skipped, unverified = cov_hits[0]
                  if min(native, mocked, skipped, unverified) < 0:
                      errors.append("coverage_counter_negative")

              reasons = []
              for line in log_text.splitlines():
                  if not line.lstrip().startswith("[W5] SKIPPED/UNVERIFIED:"):
                      continue
                  match = WARN_LINE.fullmatch(line)
                  if match is None:
                      errors.append(f"unavailable_reason_malformed {line.strip()}")
                      continue
                  reasons.append(match.group(1))

              if skipped is not None and unverified is not None:
                  if skipped != unverified:
                      errors.append(
                          f"counter_inconsistent skipped={skipped} unverified={unverified}"
                      )
                  if len(reasons) != unverified:
                      errors.append(
                          f"reason_multiplicity warnings={len(reasons)} unverified={unverified}"
                      )

              counts = Counter(reasons)
              if lane == "linux" and native is not None:
                  if (native, mocked, skipped, unverified) != LINUX_COUNTERS:
                      errors.append(
                          "linux_counters expected native=0 mocked=28 skipped=10 unverified=10 "
                          f"actual native={native} mocked={mocked} skipped={skipped} unverified={unverified}"
                      )
                  if counts != Counter(LINUX_REASONS):
                      errors.append(
                          f"linux_reasons expected={dict(LINUX_REASONS)} actual={dict(counts)}"
                      )
              if lane == "windows" and native is not None:
                  priv_count = 0
                  for reason, count in counts.items():
                      if reason in (CASE_REASON, NON_WINDOWS_REASON):
                          continue
                      if SYMLINK_PRIVILEGE_RE.match(reason):
                          priv_count += count
                          if count != 1:
                              errors.append(
                                  f"symlink_privilege_reason_multiplicity {reason} x{count}"
                              )
                          continue
                      if reason in FORBIDDEN_EXACT or reason.startswith(FORBIDDEN_PREFIXES):
                          errors.append(f"forbidden_unavailable_reason {reason} x{count}")
                          continue
                      errors.append(f"unexpected_unavailable_reason {reason} x{count}")
                  if counts[NON_WINDOWS_REASON] != 1:
                      errors.append(
                          f"non_windows_reason_count {counts[NON_WINDOWS_REASON]} != 1"
                      )
                  if counts[CASE_REASON] != 1:
                      errors.append(f"case_sensitive_reason_count {counts[CASE_REASON]} != 1")
                  if priv_count not in (0, 1):
                      errors.append(f"symlink_privilege_reason_count {priv_count} not_in_0_1")
                  expected = (9, 27, 2, 2) if priv_count == 0 else (8, 27, 3, 3)
                  if priv_count in (0, 1) and (native, mocked, skipped, unverified) != expected:
                      kind = "symlink_executed" if priv_count == 0 else "symlink_unverified"
                      errors.append(
                          f"windows_counters mode={kind} expected native,mocked,skipped,unverified="
                          f"{expected} actual={(native, mocked, skipped, unverified)}"
                      )
              return errors


          def load_suites():
              loaded = {}
              for name, filename, _expected in SUITE_EXPECTATIONS:
                  path = pathlib.Path(filename)
                  if not path.is_file():
                      loaded[name] = None
                      continue
                  try:
                      loaded[name] = json.loads(path.read_text(encoding="utf-8"))
                  except json.JSONDecodeError as exc:
                      loaded[name] = {"_malformed": str(exc)}
              return loaded


          def print_suite_pending(suites):
              for name, _filename, _expected in SUITE_EXPECTATIONS:
                  data = suites.get(name)
                  if isinstance(data, dict) and "_malformed" not in data:
                      print(
                          f"jest_pending_independent {name} "
                          f"skipped_pending={data.get('numPendingTests')} "
                          f"todo={data.get('numTodoTests')} "
                          f"custom_unverified_is_separate=true"
                      )
          # CLASSIFIER_IMPL_END


          LANE = "windows"

          def main():
              print("coverage_classification_begin")
              print(f"lane={LANE}")
              print("helper_pin_bytes=20480")
              print("helper_pin_sha256=9fc710026f177525994126673f084274e94d17615ec136a72b60d3e7a558c9b5")
              print("production_signing=UNRESOLVED")
              print("testOnlySkipPinCheck_not_used_to_green_native_ci=true")
              print("jest_green_is_not_native_body_execution=true")
              print("jest_pending_is_not_required_to_equal_unverified=true")
              print("custom_counters_are_not_a_partition_of_jest_functions=true")
              print("not_full_native_certification=true")
              print("not_operator_ready=true")
              print("historical_linux_run_38940275351_is_not_windows_evidence=true")
              print("historical_failed_run_38935173033_unchanged=true")
              suites = load_suites()
              print_suite_pending(suites)
              log_path = pathlib.Path("w5-focused.log")
              log_text = log_path.read_text(encoding="utf-8", errors="replace") if log_path.is_file() else ""
              if not log_path.is_file():
                  print("w5_focused_log=MISSING")
              errors = classify(LANE, suites, log_text)
              if errors:
                  print("classification=FAIL")
                  for err in errors:
                      print(f"classification_error {err}")
                  print("coverage_classification_end")
                  raise SystemExit(1)
              print("classification=PASS")
              print("coverage_classification_end")

          main()
          PY

      - name: Summarize W5 diagnostic evidence
        if: always()
        run: |
          set +e
          mkdir -p w5-diagnostic-staging
          checkout_sha="$(git rev-parse HEAD 2>/dev/null)"
          if [ -z "${checkout_sha}" ]; then
            checkout_sha="UNAVAILABLE"
          fi
          export DIAG_CHECKOUT_SHA="${checkout_sha}"
          export PYTHONUTF8=1
          export PYTHONIOENCODING=utf-8
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import shutil
          import sys
          import traceback

          try:
              sys.stdout.reconfigure(encoding="utf-8", errors="backslashreplace")
              sys.stderr.reconfigure(encoding="utf-8", errors="backslashreplace")
          except (AttributeError, OSError) as exc:
              print(f"diagnostic_utf8_reconfigure_failed {type(exc).__name__}")

          MESSAGE_CHARS = 4000
          STAGING = pathlib.Path("w5-diagnostic-staging")
          ALLOWLIST = (
              "w5-focused.log",
              "w5-jest-status.txt",
              "jest-w5.json",
              "jest-w4.json",
              "jest-json.json",
              "jest-phase-a.json",
              "jest-runner.json",
              "jest-adapter.json",
              "jest-fixture.json",
              "jest-binding.json",
          )
          COV_LINE = re.compile(
              r"^\s*\[W5 coverage\] native=(\d+) mocked=(\d+) skipped=(\d+) unverified=(\d+)\s*$"
          )
          WARN_LINE = re.compile(r"^\s*\[W5\] SKIPPED/UNVERIFIED:\s*(.*?)\s*$")


          def sha256_bytes(data):
              return len(data), hashlib.sha256(data).hexdigest()


          def source_head():
              event = os.environ.get("GITHUB_EVENT_NAME", "")
              event_path = os.environ.get("GITHUB_EVENT_PATH", "")
              if event == "pull_request":
                  if not event_path or not pathlib.Path(event_path).is_file():
                      return "UNAVAILABLE"
                  try:
                      payload = json.loads(pathlib.Path(event_path).read_text(encoding="utf-8"))
                      return payload["pull_request"]["head"]["sha"]
                  except (OSError, json.JSONDecodeError, KeyError, TypeError) as exc:
                      return f"UNAVAILABLE {type(exc).__name__}"
              value = os.environ.get("GITHUB_SHA", "")
              return value if value else "UNAVAILABLE"


          def bounded(text):
              if len(text) <= MESSAGE_CHARS:
                  return [text], False
              return [
                  text[:MESSAGE_CHARS],
                  (
                      f"failure_message_truncated shown={MESSAGE_CHARS} total={len(text)} "
                      "full_file=jest-w5.json"
                  ),
              ], True


          def load_jest(problems):
              path = pathlib.Path("jest-w5.json")
              if not path.is_file():
                  problems.append("diagnostic_unavailable jest-w5.json missing")
                  return None
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except json.JSONDecodeError as exc:
                  problems.append(f"diagnostic_unavailable jest-w5.json malformed {exc}")
                  return None
              if not isinstance(data, dict):
                  problems.append("diagnostic_unavailable jest-w5.json not_an_object")
                  return None
              return data


          def summarize_jest(data, lines, problems):
              if data is None:
                  lines.append("jest_w5_counts=UNAVAILABLE")
                  return
              for key in (
                  "success",
                  "numFailedTests",
                  "numPassedTests",
                  "numPendingTests",
                  "numTodoTests",
                  "numTotalTests",
                  "testResults",
              ):
                  if key not in data:
                      problems.append(f"diagnostic_incomplete jest-w5.json field={key}")
              lines.append(
                  "jest_w5_counts "
                  f"success={data.get('success', 'UNAVAILABLE')} "
                  f"failed={data.get('numFailedTests', 'UNAVAILABLE')} "
                  f"passed={data.get('numPassedTests', 'UNAVAILABLE')} "
                  f"pending={data.get('numPendingTests', 'UNAVAILABLE')} "
                  f"todo={data.get('numTodoTests', 'UNAVAILABLE')} "
                  f"total={data.get('numTotalTests', 'UNAVAILABLE')}"
              )
              results = data.get("testResults", None)
              if not isinstance(results, list):
                  problems.append("diagnostic_unavailable jest-w5.json testResults_not_a_list")
                  return
              failed_rows = 0
              for result in results:
                  if not isinstance(result, dict):
                      problems.append("diagnostic_incomplete testResult_not_an_object")
                      continue
                  suite = result.get("name", "UNAVAILABLE")
                  suite_status = result.get("status", "UNAVAILABLE")
                  suite_message = result.get("message")
                  if suite_message is None:
                      suite_message = result.get("failureMessage") or ""
                  if not isinstance(suite_message, str):
                      problems.append("diagnostic_incomplete suite_message_not_a_string")
                      suite_message = str(suite_message)
                  assertions = result.get("assertionResults", None)
                  if assertions is None:
                      problems.append(f"diagnostic_incomplete assertionResults missing suite={suite}")
                      assertions = []
                  elif not isinstance(assertions, list):
                      problems.append(f"diagnostic_incomplete assertionResults_not_a_list suite={suite}")
                      assertions = []
                  if suite_status == "failed" and len(assertions) == 0:
                      lines.append(
                          f"suite_failure suite={suite} status={suite_status} assertions=0"
                      )
                      if suite_message == "":
                          problems.append(f"diagnostic_incomplete suite_failure_message_empty suite={suite}")
                      else:
                          shown, _truncated = bounded(suite_message)
                          lines.extend(shown)
                  elif suite_message and suite_status != "passed":
                      lines.append(f"suite_message suite={suite} status={suite_status}")
                      shown, _truncated = bounded(suite_message)
                      lines.extend(shown)
                  for row in assertions:
                      if not isinstance(row, dict):
                          problems.append(f"diagnostic_incomplete assertion_not_an_object suite={suite}")
                          continue
                      status = row.get("status", "UNAVAILABLE")
                      if status != "failed":
                          continue
                      failed_rows += 1
                      title = row.get("title", "UNAVAILABLE")
                      if "title" not in row or "status" not in row:
                          problems.append(
                              f"diagnostic_incomplete assertion_identity suite={suite} title={title}"
                          )
                      ancestors = row.get("ancestorTitles", "UNAVAILABLE")
                      lines.append(
                          f"failed_assertion suite={suite} ancestors={ancestors!r} "
                          f"title={title} status={status}"
                      )
                      messages = row.get("failureMessages", None)
                      if messages is None:
                          problems.append(f"diagnostic_incomplete failureMessages missing title={title}")
                          continue
                      if not isinstance(messages, list):
                          problems.append(f"diagnostic_incomplete failureMessages_not_a_list title={title}")
                          continue
                      if len(messages) == 0:
                          problems.append(f"diagnostic_incomplete failureMessages_empty title={title}")
                      for message in messages:
                          if not isinstance(message, str):
                              problems.append(f"diagnostic_incomplete failureMessage_not_a_string title={title}")
                              message = str(message)
                          shown, _truncated = bounded(message)
                          lines.extend(shown)
              declared = data.get("numFailedTests", None)
              if isinstance(declared, int) and declared != failed_rows:
                  problems.append(
                      f"diagnostic_incomplete failed_count_mismatch declared={declared} displayed={failed_rows}"
                  )
              lines.append(f"failed_assertions_displayed={failed_rows}")


          def summarize_log(lines, problems):
              path = pathlib.Path("w5-focused.log")
              if not path.is_file():
                  problems.append("diagnostic_unavailable w5-focused.log missing")
                  lines.append("coverage_lines=0")
                  lines.append("unavailable_reasons=0")
                  return
              try:
                  text = path.read_text(encoding="utf-8", errors="replace")
              except OSError as exc:
                  problems.append(f"diagnostic_unavailable w5-focused.log unreadable {exc}")
                  return
              coverage = []
              reasons = []
              for line in text.splitlines():
                  if line.lstrip().startswith("[W5 coverage]"):
                      match = COV_LINE.fullmatch(line)
                      if match is None:
                          problems.append(f"diagnostic_incomplete coverage_line_malformed {line.strip()}")
                      else:
                          coverage.append(line.strip())
                  if line.lstrip().startswith("[W5] SKIPPED/UNVERIFIED:"):
                      match = WARN_LINE.fullmatch(line)
                      if match is None:
                          problems.append(f"diagnostic_incomplete unavailable_reason_malformed {line.strip()}")
                      else:
                          reasons.append(match.group(1))
              if not coverage:
                  problems.append("diagnostic_unavailable coverage_line missing")
              for item in coverage:
                  lines.append(f"coverage_line {item}")
              lines.append(f"coverage_lines={len(coverage)}")
              for reason in reasons:
                  lines.append(f"unavailable_reason {reason}")
              lines.append(f"unavailable_reasons={len(reasons)}")


          def valid_exit_status(text):
              if not re.fullmatch(r"0|[1-9][0-9]{0,2}", text):
                  return False
              return int(text) <= 255


          def jest_status_text(problems):
              path = pathlib.Path("w5-jest-status.txt")
              if not path.is_file():
                  problems.append("diagnostic_unavailable w5-jest-status.txt missing")
                  return "UNAVAILABLE"
              try:
                  raw = path.read_bytes()
              except OSError as exc:
                  problems.append(
                      f"diagnostic_unavailable w5-jest-status.txt unreadable {type(exc).__name__}"
                  )
                  return f"UNAVAILABLE {type(exc).__name__}"
              try:
                  text = raw.decode("utf-8").strip()
              except UnicodeDecodeError:
                  problems.append("diagnostic_unavailable w5-jest-status.txt malformed")
                  return "UNAVAILABLE malformed utf-8"
              if text == "":
                  problems.append("diagnostic_unavailable w5-jest-status.txt empty")
                  return "UNAVAILABLE"
              if valid_exit_status(text):
                  return text
              problems.append("diagnostic_unavailable w5-jest-status.txt malformed")
              return f"UNAVAILABLE malformed {text!r}"


          def stage_files(lines, problems):
              if STAGING.exists():
                  shutil.rmtree(STAGING)
              STAGING.mkdir()
              unreadable = False
              for name in ALLOWLIST:
                  source = pathlib.Path(name)
                  if not source.is_file():
                      lines.append(f"receipt_file {name} MISSING")
                      continue
                  try:
                      data = source.read_bytes()
                  except OSError as exc:
                      unreadable = True
                      problems.append(
                          f"diagnostic_unavailable {name} unreadable {type(exc).__name__}"
                      )
                      lines.append(f"receipt_file {name} UNAVAILABLE {type(exc).__name__}")
                      continue
                  size, digest = sha256_bytes(data)
                  # A destination write error stays fail-closed.
                  (STAGING / name).write_bytes(data)
                  lines.append(f"receipt_file {name} EXISTS bytes={size} sha256={digest}")
              lines.append("receipt_self_hash_is_not_approval=true")
              if unreadable:
                  lines.append("unreadable_allowlisted_files_not_staged=true")
              else:
                  lines.append("full_raw_files_retained_when_listed_exists=true")


          def write_receipt(lines):
              receipt = STAGING / "w5-diagnostic-receipt.txt"
              body = "\n".join(lines) + "\n"
              receipt.write_bytes(body.encode("utf-8"))


          def main():
              problems = []
              lines = [
                  "diagnostic_summary_begin",
                  f"source_sha={source_head()}",
                  f"checkout_sha={os.environ.get('DIAG_CHECKOUT_SHA', 'UNAVAILABLE') or 'UNAVAILABLE'}",
                  f"github_run_id={os.environ.get('GITHUB_RUN_ID', 'UNAVAILABLE') or 'UNAVAILABLE'}",
                  f"github_run_attempt={os.environ.get('GITHUB_RUN_ATTEMPT', 'UNAVAILABLE') or 'UNAVAILABLE'}",
                  f"w5_jest_status={jest_status_text(problems)}",
                  "diagnostic_does_not_replace_jest_or_classifier_status=true",
                  "artifact_upload=NOT_RUN_BY_THIS_STEP",
              ]
              code = 0
              try:
                  summarize_jest(load_jest(problems), lines, problems)
                  summarize_log(lines, problems)
              except Exception:
                  code = 1
                  problems.append("diagnostic_display_failed")
                  lines.append(traceback.format_exc())
              try:
                  stage_files(lines, problems)
                  lines.extend(problems)
                  if code == 0:
                      lines.append(
                          "diagnostic_evidence=INCOMPLETE" if problems else "diagnostic_evidence=FILES_READ"
                      )
                      lines.append("diagnostic_conclusion=REPORTED")
                  else:
                      lines.append("diagnostic_evidence=DISPLAY_FAILED")
                      lines.append("diagnostic_conclusion=DISPLAY_FAILED")
                  lines.append("diagnostic_summary_end")
                  write_receipt(lines)
              except Exception:
                  print("diagnostic_display_failed receipt_or_stage")
                  print(traceback.format_exc())
                  raise SystemExit(1)
              for line in lines:
                  print(line)
              raise SystemExit(code)


          if __name__ == "__main__":
              main()
          PY
          summary_status=$?
          echo "diagnostic_summary_process_status=${summary_status}"
          exit "${summary_status}"

      - name: Route A acceptance scope
        if: always()
        run: |
          echo "this_job=windows_route_a"
          echo "permitted_unverified_gaps=non_windows_refusal,case_sensitive_parent,dir_symlink_without_privilege"
          echo "not_full_native_certification=true"
          echo "not_operator_ready=true"
          echo "do_not_replace_helper_pin_from_ci_build=true"
          echo "route_b_sdk_publish=NOT_THIS_JOB"
          echo "historical_run_38940275351_remains_linux_acceptance=true"
          echo "historical_failed_run_38935173033_unchanged=true"

      - name: Upload W5 diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w5-route-a-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: w5-diagnostic-staging
          if-no-files-found: warn
          retention-days: 14
          overwrite: false
