# Validation-only CI for ML-CAL-1 G4 Phase A W4 pre-mutation conflict gate.
# No DB, no secrets, no providers, no operator mode, no operator-root probes,
# no live pooler, no production writes. Temp directories only.
#
# Targets stacked PR base: feat/ml-cal-1-g4-phase-a-json-command-v1 (#257).
# pull_request checkout is GitHub's synthetic merge of PR head into that base.
#
# Successor pin policy: W4 intentionally replaces the Phase A library blob.
# Historical #257 library bytes are verified from immutable commit 5ca8aa36…
# (Git blob OID + content SHA-256), not from the mutable checkout library.

name: Test ML-CAL-1 G4 Phase A W4 Conflict Gate

on:
  pull_request:
    branches:
      - 'feat/ml-cal-1-g4-phase-a-json-command-v1'
    paths:
      - 'apps/jobs/lib/ml-cal-1-g4-phase-a-retention-setup.ts'
      - 'apps/jobs/__tests__/ml-cal-1-g4-phase-a-w4-conflict-gate.test.ts'
      - 'apps/jobs/lib/ml-cal-1-g4-phase-a-json-command.ts'
      - 'apps/jobs/run-ml-cal-1-g4-phase-a-json-command.ts'
      - 'apps/jobs/__tests__/ml-cal-1-g4-phase-a-json-command.test.ts'
      - 'apps/jobs/run-ml-cal-1-g4-phase-a-retention-setup.ts'
      - 'apps/jobs/__tests__/ml-cal-1-g4-phase-a-retention-setup.test.ts'
      - 'apps/jobs/lib/ml-cal-1-g4-pooler-preflight-live-runner.ts'
      - 'apps/jobs/lib/ml-cal-1-g4-pooler-preflight-live-reader.ts'
      - 'apps/jobs/run-ml-cal-1-g4-pooler-preflight-live.ts'
      - 'apps/jobs/lib/ml-cal-1-g4-pooler-preflight-real-adapter.ts'
      - 'apps/jobs/lib/ml-cal-1-g4-pooler-preflight-fixture.ts'
      - 'apps/jobs/lib/ml-cal-1-lifecycle-binding-observer.ts'
      - 'apps/jobs/lib/ml-cal-1-lifecycle-binding.ts'
      - 'apps/jobs/lib/ml-cal-1-capture.ts'
      - 'apps/jobs/lib/ml-cal-1-capture-binding-integration.ts'
      - 'apps/jobs/lib/ml-cal-1-capture-binding-fixture.ts'
      - 'apps/jobs/__tests__/ml-cal-1-g4-pooler-preflight-live-runner.test.ts'
      - 'apps/jobs/__tests__/ml-cal-1-g4-pooler-preflight-real-adapter.test.ts'
      - 'apps/jobs/__tests__/ml-cal-1-g4-pooler-preflight-fixture.test.ts'
      - 'apps/jobs/__tests__/ml-cal-1-lifecycle-binding.test.ts'
      - 'apps/jobs/__tests__/ml-cal-1-capture-binding-integration.test.ts'
      - 'apps/jobs/__tests__/ml-cal-1-capture-binding-g3.test.ts'
      - 'apps/jobs/__tests__/ml-cal-1-lifecycle-binding-observer-g4.test.ts'
      - 'research/moneyline/ML_CAL_1_G4_PHASE_A_W4_CONFLICT_GATE_*.md'
      - 'research/moneyline/ML_CAL_1_G4_PHASE_A_JSON_COMMAND_*.md'
      - 'research/moneyline/ML_CAL_1_G4_PHASE_A_RETENTION_SETUP_*.md'
      - 'research/moneyline/ML_CAL_1_G4_NONFIXTURE_OBSERVER_POOLER_PREFLIGHT_*.md'
      - 'research/moneyline/ML_CAL_1_G4_RETENTION_PREFLIGHT_EXECUTION_PLAN_20261013.md'
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.*'
      - '.github/workflows/test-ml-cal-1-g4-phase-a-w4-conflict-gate-v1.yml'

permissions:
  contents: read

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Report checkout identity
        run: |
          set -euo pipefail
          echo "event_name=${GITHUB_EVENT_NAME}"
          echo "checkout_HEAD=$(git rev-parse HEAD)"
          echo "checkout_parents=$(git rev-list --parents -n 1 HEAD)"
          echo "github_sha=${GITHUB_SHA}"
          echo "github_head_ref=${GITHUB_HEAD_REF:-}"
          echo "github_base_ref=${GITHUB_BASE_REF:-}"
          if [ -n "${GITHUB_EVENT_PATH:-}" ] && [ -f "${GITHUB_EVENT_PATH}" ]; then
            python3 - <<'PY'
          import json, os
          ev = json.load(open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8'))
          pr = ev.get('pull_request') or {}
          head = (pr.get('head') or {})
          base = (pr.get('base') or {})
          print(f"pr_source_head={head.get('sha')}")
          print(f"pr_base_sha={base.get('sha')}")
          print(f"pr_number={pr.get('number')}")
          print('note=pull_request_checkout_is_synthetic_merge_of_head_into_base_unless_otherwise_stated')
          PY
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run W4 conflict-gate suite
        run: |
          npx jest --runInBand --runTestsByPath \
            apps/jobs/__tests__/ml-cal-1-g4-phase-a-w4-conflict-gate.test.ts

      - name: Run accepted #257 Phase A JSON command suite
        run: |
          npx jest --runInBand --runTestsByPath \
            apps/jobs/__tests__/ml-cal-1-g4-phase-a-json-command.test.ts

      - name: Run accepted #256 Phase A retention setup suite
        run: |
          npx jest --runInBand --runTestsByPath \
            apps/jobs/__tests__/ml-cal-1-g4-phase-a-retention-setup.test.ts

      - name: Run accepted #255 nonfixture runner suite
        run: |
          npx jest --runInBand --runTestsByPath \
            apps/jobs/__tests__/ml-cal-1-g4-pooler-preflight-live-runner.test.ts

      - name: Run accepted real-adapter suite
        run: |
          npx jest --runInBand --runTestsByPath \
            apps/jobs/__tests__/ml-cal-1-g4-pooler-preflight-real-adapter.test.ts

      - name: Run accepted fixture-preflight suite
        run: |
          npx jest --runInBand --runTestsByPath \
            apps/jobs/__tests__/ml-cal-1-g4-pooler-preflight-fixture.test.ts

      - name: Run accepted binding / G2 / G3 / G4 regressions
        run: |
          npx jest --runInBand --runTestsByPath \
            apps/jobs/__tests__/ml-cal-1-lifecycle-binding.test.ts \
            apps/jobs/__tests__/ml-cal-1-capture-binding-integration.test.ts \
            apps/jobs/__tests__/ml-cal-1-capture-binding-g3.test.ts \
            apps/jobs/__tests__/ml-cal-1-lifecycle-binding-observer-g4.test.ts

      - name: Secret-free pin + scan check (historical baseline + W4 successor)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, re, subprocess

          HISTORICAL_COMMIT = '5ca8aa36e848e1bfc6839575dc65006feeca0621'

          def sha256_bytes(data: bytes) -> tuple[int, str]:
              return len(data), hashlib.sha256(data).hexdigest()

          def sha256_path(p: pathlib.Path) -> tuple[int, str]:
              return sha256_bytes(p.read_bytes())

          def git_blob_sha(path: str, rev: str = 'HEAD') -> str:
              return subprocess.check_output(
                  ['git', 'rev-parse', f'{rev}:{path}'], text=True
              ).strip()

          def git_blob_bytes(path: str, rev: str) -> bytes:
              # Raw blob bytes (no working-tree EOL filters). Prefer over `git show`.
              return subprocess.check_output(
                  ['git', 'cat-file', 'blob', f'{rev}:{path}']
              )

          design = pathlib.Path(
              'research/moneyline/ML_CAL_1_G4_NONFIXTURE_OBSERVER_POOLER_PREFLIGHT_PROCEDURE_DESIGN_20261013.md'
          )
          design_bytes, design_sha = sha256_path(design)
          expected_design = '55d4a3d72877abcf154461a6504bb702791339b41721729116472187fab7c95f'
          assert design_sha == expected_design, f'design {design_sha} != {expected_design}'
          print(f'ok design_sha {design_sha} bytes={design_bytes}')

          plan = pathlib.Path(
              'research/moneyline/ML_CAL_1_G4_RETENTION_PREFLIGHT_EXECUTION_PLAN_20261013.md'
          )
          assert plan.exists(), 'execution plan missing'
          plan_bytes, plan_sha = sha256_path(plan)
          expected_plan = '22230e3946bc0fdc7753842c6dea362619f96b9b552c5a622571479fdc6d0926'
          assert plan_bytes == 36740, f'plan bytes {plan_bytes} != 36740'
          assert plan_sha == expected_plan, f'plan {plan_sha} != {expected_plan}'
          print(f'ok plan_git_bytes_sha {plan_sha} bytes={plan_bytes}')

          # --- Historical baseline (#257 accepted library; immutable commit) ---
          # Git blob OID retained by #257 workflow (not reinvented).
          hist_path = 'apps/jobs/lib/ml-cal-1-g4-phase-a-retention-setup.ts'
          hist_blob_expected = '37edc14ff5a60c270beebe75751a586bdc5a514a'
          hist_blob_actual = git_blob_sha(hist_path, HISTORICAL_COMMIT)
          assert hist_blob_actual == hist_blob_expected, (
              f'HISTORICAL baseline blob {hist_blob_actual} != {hist_blob_expected}'
          )
          hist_data = git_blob_bytes(hist_path, HISTORICAL_COMMIT)
          hist_bytes, hist_sha = sha256_bytes(hist_data)
          # Content digest of that same historical Git blob (distinct from Git object id).
          # Derived from blob 37edc14f… via `git cat-file blob` (not a Windows text pipe).
          hist_sha_expected = '11134072792752f1034c1e8f4bd1217e803b231d689e427f18b0e7284d0f97ff'
          assert hist_bytes == 75444, f'HISTORICAL bytes {hist_bytes} != 75444'
          assert hist_sha == hist_sha_expected, f'HISTORICAL sha {hist_sha} != {hist_sha_expected}'
          print(
              f'ok HISTORICAL_BASELINE library blob={hist_blob_actual} '
              f'sha256={hist_sha} bytes={hist_bytes} at {HISTORICAL_COMMIT}'
          )

          # --- W4 successor pins (current checkout; deliberately differs from historical) ---
          w4_lib = pathlib.Path(hist_path)
          w4_bytes, w4_sha = sha256_path(w4_lib)
          assert w4_bytes == 89980, f'W4 library bytes {w4_bytes} != 89980'
          assert w4_sha == '8c7b3fc99263d2f37332002ba0e46cd5f13fd24afb1693383ad427c552762d86', (
              f'W4 library sha {w4_sha}'
          )
          w4_blob = git_blob_sha(hist_path)
          assert w4_blob != hist_blob_expected, 'W4 successor must replace historical library blob'
          print(
              f'ok W4_SUCCESSOR library blob={w4_blob} sha256={w4_sha} bytes={w4_bytes} '
              f'(intentionally != historical {hist_blob_expected})'
          )

          w4_pins = {
              'apps/jobs/__tests__/ml-cal-1-g4-phase-a-w4-conflict-gate.test.ts':
                  (37218, '8c62409a6d0b5cdbbfe809839f54675f303d995a18beb2e38df72ae12bc15872'),
              'research/moneyline/ML_CAL_1_G4_PHASE_A_W4_CONFLICT_GATE_USAGE_20261015.md':
                  (4073, '55c64cb76f6418ca94f5d37d0621d178bc45f33899d87f79248bf50aadb62e77'),
              'research/moneyline/ML_CAL_1_G4_PHASE_A_W4_CONFLICT_GATE_RECOVERY_20261015.md':
                  (1381, '621a13c9ecc996cb06be7f99d8fc8bbdb8bb2cf9bf9b9ecb60298a2babbfae08'),
          }
          for path, (exp_bytes, exp_sha) in w4_pins.items():
              b, s = sha256_path(pathlib.Path(path))
              assert b == exp_bytes, f'{path} bytes {b} != {exp_bytes}'
              assert s == exp_sha, f'{path} sha {s} != {exp_sha}'
              print(f'ok W4_SUCCESSOR pin {path} sha256={s} bytes={b}')

          # Inherited #257 surfaces: verify current blobs against immutable #257 base
          # (not recomputed from both sides of the mutable checkout).
          inherited_blobs = {
              'apps/jobs/lib/ml-cal-1-g4-phase-a-json-command.ts':
                  '8b9aac3ec3fb618a2f67aced4c3025f73fe5eadb',
              'apps/jobs/run-ml-cal-1-g4-phase-a-json-command.ts':
                  '6bea4c4fec4e4c77e3c02501ce431ac876267fef',
              'apps/jobs/__tests__/ml-cal-1-g4-phase-a-json-command.test.ts':
                  '64b435c5d9a8af7695d6800dba0fe6ba89b2405a',
              'apps/jobs/run-ml-cal-1-g4-phase-a-retention-setup.ts':
                  'b6d84ac5fc72b3e5a4d7a129d68f953446a6fb56',
              'apps/jobs/__tests__/ml-cal-1-g4-phase-a-retention-setup.test.ts':
                  'ed9ffad9c45bf714ffc9199ff8a16c7057b44fad',
              'package.json': '9dd5f3e9c136c4c0df0f7f46cf03c3a548052e73',
              'package-lock.json': '8c19ca0d028900a235d57b69f6802d2423b22af6',
          }
          for path, expected in inherited_blobs.items():
              base_blob = git_blob_sha(path, HISTORICAL_COMMIT)
              head_blob = git_blob_sha(path)
              assert base_blob == expected, f'{path} base blob {base_blob} != {expected}'
              assert head_blob == expected, f'{path} HEAD blob {head_blob} != {expected} (must match #257)'
              print(f'ok inherited_unchanged {path}={head_blob}')

          # Passive / gated: no client construction / env URL reads in scoped surfaces.
          for rel in [
              'apps/jobs/lib/ml-cal-1-g4-phase-a-retention-setup.ts',
              'apps/jobs/run-ml-cal-1-g4-phase-a-retention-setup.ts',
              'apps/jobs/lib/ml-cal-1-g4-phase-a-json-command.ts',
              'apps/jobs/run-ml-cal-1-g4-phase-a-json-command.ts',
          ]:
              text = pathlib.Path(rel).read_text(encoding='utf-8')
              assert 'new PrismaClient' not in text, rel
              assert 'process.env.DATABASE_URL' not in text, rel
              assert 'process.env.DIRECT_URL' not in text, rel
              print(f'ok passive/gated {rel}')

          lib = pathlib.Path(hist_path).read_text(encoding='utf-8')
          assert expected_design in lib or 'ML_CAL_1_G4_PHASE_A_DESIGN_SHA256' in lib
          print('ok design_pin_present_in_w4_successor_library')

          secretish = re.compile(
              r'(?i)(api[_-]?key\s*[:=]\s*\S+|password\s*[:=]\s*\S+|bearer\s+[a-z0-9._-]{8,}|ghp_[A-Za-z0-9]+|'
              r'(DATABASE_URL|DIRECT_URL)\s*[:=]\s*\S+)'
          )
          for p in [
              pathlib.Path('apps/jobs/lib/ml-cal-1-g4-phase-a-retention-setup.ts'),
              pathlib.Path('apps/jobs/__tests__/ml-cal-1-g4-phase-a-w4-conflict-gate.test.ts'),
              pathlib.Path('research/moneyline/ML_CAL_1_G4_PHASE_A_W4_CONFLICT_GATE_USAGE_20261015.md'),
              pathlib.Path('research/moneyline/ML_CAL_1_G4_PHASE_A_W4_CONFLICT_GATE_RECOVERY_20261015.md'),
              pathlib.Path('.github/workflows/test-ml-cal-1-g4-phase-a-w4-conflict-gate-v1.yml'),
          ]:
              text = p.read_text(encoding='utf-8')
              assert not secretish.search(text), p
          print('ok secret-free scan (scoped W4 files + workflow)')
          print('ok temp-only CI; operator setup command not executed')
          print('ok no_env_dump no_secret_exfiltration')
          print('ok HISTORICAL_vs_W4_SUCCESSOR pins labeled and distinct')
          PY
