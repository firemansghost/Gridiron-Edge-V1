# Manual READ-ONLY preview of proposed 2026 FBS TeamMembership.
# workflow_dispatch ONLY — no schedule, push, or pull_request.
# Does not write membership. Does not call CFBD/Odds. Does not run ratings/talent/stats.

name: Preview 2026 FBS Membership (Manual, Read Only)

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season year (must be 2026)'
        required: true
        type: string
        default: '2026'

permissions:
  contents: read

concurrency:
  group: preview-2026-fbs-membership-${{ inputs.season }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DIRECT_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Preflight (names/presence only)
        run: |
          set -euo pipefail
          SEASON="${{ inputs.season }}"
          echo "season_input=${SEASON}"
          if [ "$SEASON" != "2026" ]; then
            echo "::error::season must equal 2026 (got ${SEASON})"
            exit 1
          fi
          if [ -z "${DIRECT_URL:-}" ] && [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DIRECT_URL / DATABASE_URL secret is missing"
            exit 1
          fi
          echo "CFBD_API_KEY: not provided"
          echo "ODDS_API_KEY: not provided"
          echo "DIRECT_URL: present (value not printed)"
          echo "database mutations: not invoked"
          echo "ratings/talent/stats: not invoked"
          echo "providers: not invoked"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Preview 2026 FBS membership (read-only)
        run: |
          npx tsx apps/jobs/preview-fbs-membership.ts --season "${{ inputs.season }}" --preview

      - name: Summary
        if: always()
        run: |
          echo "============================================"
          echo "PREVIEW 2026 FBS MEMBERSHIP (READ ONLY)"
          echo "============================================"
          echo "season: ${{ inputs.season }}"
          echo "status: ${{ job.status }}"
          echo "mode: preview only — no membership writes"
          echo "secrets used (names only): DIRECT_URL"
          echo "============================================"
