name: Test Historical Feature V1

on:
  pull_request:
    paths:
      - 'research/historical/HISTORICAL_FEATURE_DEFINITION_V1_CONTRACT.md'
      - 'research/historical/HISTORICAL_MODEL_DEVELOPMENT_TUNING_PROTOCOL_V1.md'
      - 'research/historical/HISTORICAL_SOURCE_RESOLUTION_CONFIRMATION_V2_CONTRACT.md'
      - 'research/historical/HISTORICAL_SOURCE_RESILIENT_CONFIRMATION_V3_CONTRACT.md'
      - 'apps/jobs/src/research/historical-feature-v1.ts'
      - 'apps/jobs/build-historical-feature-v1.ts'
      - 'apps/jobs/__tests__/historical-feature-v1.test.ts'
      - '.github/workflows/build-historical-feature-v1.yml'
      - '.github/workflows/test-historical-feature-v1.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: TypeScript smoke compile
        run: |
          npx tsc --noEmit \
            --module commonjs \
            --moduleResolution node \
            --target ES2019 \
            --esModuleInterop \
            --skipLibCheck \
            apps/jobs/src/research/historical-feature-v1.ts \
            apps/jobs/build-historical-feature-v1.ts

      - name: Compile and start offline feature runtime
        run: |
          set -euo pipefail
          command -v unzip >/dev/null
          rm -rf .tmp/historical-feature-v1
          npx tsc --module commonjs \
            --moduleResolution node \
            --target ES2019 \
            --esModuleInterop \
            --skipLibCheck \
            --outDir .tmp/historical-feature-v1 \
            apps/jobs/src/research/historical-feature-v1.ts \
            apps/jobs/build-historical-feature-v1.ts

          test -f .tmp/historical-feature-v1/build-historical-feature-v1.js

          set +e
          OUTPUT="$(node .tmp/historical-feature-v1/build-historical-feature-v1.js \
            --source-corpus-zip .tmp/does-not-exist-corpus.zip \
            --confirm BUILD_2022_2023_HISTORICAL_FEATURE_V1 \
            --output-dir .tmp/no-feature-run 2>&1)"
          STATUS=$?
          set -e

          test "${STATUS}" -eq 1
          echo "${OUTPUT}" | grep -F "[historical-feature-v1] source_corpus_zip_missing"

      - name: Test Historical Feature V1
        run: npx jest apps/jobs/__tests__/historical-feature-v1.test.ts --runInBand
