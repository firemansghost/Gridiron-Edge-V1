# Secret-free CI for guarded 2026 Live Odds pure/regression tests.
# No DB, no production secrets, no Odds/CFBD/SGO providers, no operational dispatch.

name: Test Live Odds 2026

on:
  pull_request:
    paths:
      - 'apps/jobs/write-live-odds-2026.ts'
      - 'apps/jobs/src/odds/live-odds-2026.ts'
      - 'apps/jobs/__tests__/live-odds-2026.test.ts'
      - 'apps/jobs/adapters/OddsApiAdapter.ts'
      - 'apps/jobs/adapters/TeamResolver.ts'
      - '.github/workflows/write-live-odds-2026.yml'
      - '.github/workflows/test-live-odds-2026.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-odds-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        env:
          # Inert placeholders only — generate/install must not touch production DB.
          DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma_generate_placeholder
          DIRECT_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma_generate_placeholder
        run: npm ci

      - name: Run Live Odds 2026 regression tests
        env:
          DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma_generate_placeholder
          DIRECT_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma_generate_placeholder
        run: |
          npx jest --runInBand --runTestsByPath \
            apps/jobs/__tests__/live-odds-2026.test.ts
