name: Build Historical V3 Predictive Inputs (Manual, Guarded)

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: 'Exact current main SHA'
        required: true
        type: string
      v3_model_artifact_id:
        description: 'Audited Historical Model V3 backcompat artifact ID'
        required: true
        type: string
      v3_model_zip_sha256:
        description: 'Exact audited Historical Model V3 artifact ZIP SHA-256'
        required: true
        type: string
      confirmation:
        description: 'Type BUILD_2024_HISTORICAL_V3_PREDICTIVE_INPUTS exactly'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-v3-predictive-inputs
  cancel-in-progress: false

env:
  SNAPSHOT_ARTIFACT_ID: '11008470975'
  SNAPSHOT_ZIP_SHA256: 'b41e934b26952100e7e056a56114dc81df6bbe77f5c787f28b75b646ae7ea544'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Source SHA and confirmation guard
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          V3_MODEL_ARTIFACT_ID_INPUT: ${{ inputs.v3_model_artifact_id }}
          V3_MODEL_ZIP_SHA256_INPUT: ${{ inputs.v3_model_zip_sha256 }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "ACTUAL_SHA=${ACTUAL_SHA}" >> "$GITHUB_ENV"

          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "::error::Refusing V3 predictive-input build outside refs/heads/main."
            exit 1
          fi
          if [ -z "${EXPECTED_MAIN_SHA}" ] || [ "${ACTUAL_SHA}" != "${EXPECTED_MAIN_SHA}" ]; then
            echo "::error::Refusing V3 predictive-input build because main SHA does not match expected_main_sha."
            exit 1
          fi
          if [ "${INPUT_CONFIRMATION}" != "BUILD_2024_HISTORICAL_V3_PREDICTIVE_INPUTS" ]; then
            echo "::error::Exact V3 predictive-input confirmation is required."
            exit 1
          fi
          if ! printf '%s' "${V3_MODEL_ARTIFACT_ID_INPUT}" | grep -Eq '^[0-9]+$'; then
            echo "::error::v3_model_artifact_id must be numeric."
            exit 1
          fi
          if ! printf '%s' "${V3_MODEL_ZIP_SHA256_INPUT}" | grep -Eq '^[0-9a-fA-F]{64}$'; then
            echo "::error::v3_model_zip_sha256 must be an exact SHA-256."
            exit 1
          fi

          echo "V3_MODEL_ARTIFACT_ID=${V3_MODEL_ARTIFACT_ID_INPUT}" >> "$GITHUB_ENV"
          echo "V3_MODEL_ZIP_SHA256=$(printf '%s' "${V3_MODEL_ZIP_SHA256_INPUT}" | tr 'A-F' 'a-f')" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Preflight
        run: |
          set -euo pipefail
          command -v curl >/dev/null
          command -v unzip >/dev/null
          command -v sha256sum >/dev/null
          echo "mode=ARTIFACT_ONLY_OFFLINE_2024_V3_PREDICTIVE_INPUT_BUILD"
          echo "providerCalls=0"
          echo "marketReads=0"
          echo "ppaSidecarReads=0"
          echo "portalReads=0"
          echo "outcomeFieldsUsed=false"
          echo "modelPredictionsComputed=false"
          echo "holdout2025Reads=0"
          echo "databaseReads=false"
          echo "databaseWrites=false"
          echo "recoveryArtifactUsed=false"

      - name: Download frozen source and audited V3 model artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .research-inputs
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts"

          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json"             "${API}/${SNAPSHOT_ARTIFACT_ID}/zip"             -o .research-inputs/historical-research-snapshot-v1-2024.zip

          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json"             "${API}/${V3_MODEL_ARTIFACT_ID}/zip"             -o .research-inputs/historical-model-v3-backcompat.zip

      - name: Verify source ZIP hashes
        run: |
          set -euo pipefail
          echo "${SNAPSHOT_ZIP_SHA256}  .research-inputs/historical-research-snapshot-v1-2024.zip" | sha256sum -c -
          echo "${V3_MODEL_ZIP_SHA256}  .research-inputs/historical-model-v3-backcompat.zip" | sha256sum -c -

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Compile V3 predictive-input runtime
        run: |
          set -euo pipefail
          rm -rf .tmp/historical-v3-predictive
          npx tsc --module commonjs             --moduleResolution node             --target ES2019             --esModuleInterop             --skipLibCheck             --outDir .tmp/historical-v3-predictive             apps/jobs/src/research/historical-model-development-v1.ts             apps/jobs/src/research/historical-model-v3.ts             apps/jobs/src/research/historical-v3-predictive-inputs.ts             apps/jobs/build-historical-v3-predictive-inputs.ts

      - name: Build source-resilient predictive inputs from frozen bulk source
        env:
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          OUT="reports/historical-v3-predictive-inputs/${GITHUB_RUN_ID}"
          node .tmp/historical-v3-predictive/build-historical-v3-predictive-inputs.js             --snapshot-zip .research-inputs/historical-research-snapshot-v1-2024.zip             --v3-model-zip .research-inputs/historical-model-v3-backcompat.zip             --v3-model-zip-sha256 "${V3_MODEL_ZIP_SHA256}"             --confirm "${INPUT_CONFIRMATION}"             --output-dir "${OUT}"

      - name: Upload immutable V3 predictive-input evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-v3-predictive-inputs-${{ github.run_id }}
          path: reports/historical-v3-predictive-inputs/**
          if-no-files-found: warn
          retention-days: 90

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "==================================================="
          echo "HISTORICAL V3 PREDICTIVE INPUT BUILD"
          echo "==================================================="
          echo "status=${JOB_STATUS}"
          echo "sourceSha=${ACTUAL_SHA:-unavailable}"
          echo "providerCalls=0"
          echo "marketReads=0"
          echo "ppaSidecarReads=0"
          echo "portalReads=0"
          echo "outcomeFieldsUsed=false"
          echo "modelPredictionsComputed=false"
          echo "2025 reads=0"
          echo "recoveryArtifactUsed=false"
          echo "database reads/writes=false/false"
          echo "==================================================="
