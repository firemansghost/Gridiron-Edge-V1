name: Test Historical Research Snapshot V1

on:
  pull_request:
    paths:
      - 'research/historical/HISTORICAL_RESEARCH_SNAPSHOT_V1_CONTRACT.md'
      - 'research/historical/HISTORICAL_DEVELOPMENT_CORPUS_V1_CONTRACT.md'
      - 'research/historical/HISTORICAL_VALIDATION_V1_CONTRACT.md'
      - 'research/historical/HISTORICAL_SOURCE_RESOLUTION_CONFIRMATION_V2_CONTRACT.md'
      - 'apps/jobs/src/research/historical-research-snapshot-v1.ts'
      - 'apps/jobs/capture-historical-research-snapshot-v1.ts'
      - 'apps/jobs/__tests__/historical-research-snapshot-v1.test.ts'
      - '.github/workflows/capture-historical-research-snapshot-v1.yml'
      - '.github/workflows/capture-historical-research-snapshot-v1-2022.yml'
      - '.github/workflows/capture-historical-research-snapshot-v1-2023.yml'
      - '.github/workflows/test-historical-research-snapshot-v1.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: TypeScript smoke compile
        run: |
          npx tsc --noEmit             --module commonjs             --moduleResolution node             --target ES2019             --esModuleInterop             --skipLibCheck             apps/jobs/src/research/historical-research-snapshot-v1.ts             apps/jobs/capture-historical-research-snapshot-v1.ts

      - name: Compile and start guarded capture runtime without provider access
        run: |
          set -euo pipefail
          rm -rf .tmp/historical-research-snapshot-v1
          npx tsc --module commonjs \
            --moduleResolution node \
            --target ES2019 \
            --esModuleInterop \
            --skipLibCheck \
            --outDir .tmp/historical-research-snapshot-v1 \
            apps/jobs/src/research/historical-research-snapshot-v1.ts \
            apps/jobs/capture-historical-research-snapshot-v1.ts

          test -f .tmp/historical-research-snapshot-v1/capture-historical-research-snapshot-v1.js

          set +e
          OUTPUT="$(node .tmp/historical-research-snapshot-v1/capture-historical-research-snapshot-v1.js \
            --season 2026 \
            --confirm INVALID \
            --output-dir .tmp/historical-research-snapshot-v1/no-provider-run 2>&1)"
          STATUS=$?
          set -e

          test "${STATUS}" -eq 1
          echo "${OUTPUT}" | grep -F "[historical-snapshot] invalid_season"

      - name: Test Historical Research Snapshot V1
        run: npx jest apps/jobs/__tests__/historical-research-snapshot-v1.test.ts --runInBand
