# Manual rollback-only validation of the 2026 TeamUnitGrades write path.
# workflow_dispatch ONLY. This intentionally issues TeamUnitGrades INSERTs inside
# one Serializable transaction and MUST roll them back before success.
# No providers. No persistent writes. No Shadow. No Prisma migrate.

name: Validate 2026 TeamUnitGrades Write Path (Manual, Rollback Only)

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season year (must be 2026)'
        required: true
        type: string
        default: '2026'
      expected_main_sha:
        description: 'Exact main commit SHA authorized for this validation'
        required: true
        type: string
      confirm:
        description: 'Type VALIDATE_2026_TEAM_UNIT_GRADES_ROLLBACK exactly'
        required: true
        type: string

permissions:
  contents: read

# Deliberately shares the production writer concurrency group so the rollback
# validator and a real TeamUnitGrades COMMIT can never overlap.
concurrency:
  group: write-team-unit-grades-2026
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Source SHA guard
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "ACTUAL_SHA=${ACTUAL_SHA}" >> "$GITHUB_ENV"
          echo "actual_sha: ${ACTUAL_SHA}"
          echo "expected_main_sha: ${EXPECTED_MAIN_SHA}"
          echo "github_ref: ${GITHUB_REF:-}"
          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "::error::Refusing rollback validation. Workflow must run from main."
            exit 1
          fi
          if [ -z "${EXPECTED_MAIN_SHA}" ]; then
            echo "::error::expected_main_sha is required."
            exit 1
          fi
          if [ "${ACTUAL_SHA}" != "${EXPECTED_MAIN_SHA}" ]; then
            echo "::error::Checked-out SHA does not match expected_main_sha."
            echo "::error::actual_sha=${ACTUAL_SHA}"
            echo "::error::expected_main_sha=${EXPECTED_MAIN_SHA}"
            exit 1
          fi
          echo "Source SHA guard passed."

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Preflight (names/presence only)
        env:
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          echo "season=${INPUT_SEASON}"
          echo "mode=ROLLBACK_ONLY_VALIDATION"
          echo "providersInvoked=false"
          echo "providerCalls=0"
          echo "CFBD_API_KEY: not provided"
          echo "ODDS_API_KEY: not provided"
          echo "persistent TeamUnitGrades writes: forbidden"
          echo "cfbd source writes: false"
          echo "priors writes: false"
          echo "Shadow writes: false"
          echo "Bet writes: false"
          echo "MatchupOutput writes: false"
          echo "ratings writes: false"
          echo "prisma migrate: not invoked"
          echo "compute_unit_grades: not invoked"

          if [ "$INPUT_SEASON" != "2026" ]; then
            echo "::error::season must equal 2026 (got ${INPUT_SEASON})"
            exit 1
          fi
          if [ "$INPUT_CONFIRM" != "VALIDATE_2026_TEAM_UNIT_GRADES_ROLLBACK" ]; then
            echo "::error::validation requires confirm=VALIDATE_2026_TEAM_UNIT_GRADES_ROLLBACK"
            exit 1
          fi
          if [ -z "${DIRECT_URL:-}" ]; then
            echo "::error::DIRECT_URL secret is missing"
            exit 1
          fi
          echo "DIRECT_URL: present (value not printed)"
          echo "Preflight OK"

      - name: Install dependencies
        env:
          DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma_generate_placeholder
          DIRECT_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma_generate_placeholder
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma_generate_placeholder
          DIRECT_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma_generate_placeholder
        run: npm run prisma:generate

      - name: Run rollback-only TeamUnitGrades validation
        env:
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          mkdir -p reports
          npx tsx apps/jobs/validate-team-unit-grades-2026-write-path.ts \
            --season "$INPUT_SEASON" \
            --confirm "$INPUT_CONFIRM" \
            --report "reports/team-unit-grades-2026-rollback-validation.json"

      - name: Upload rollback-validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-unit-grades-2026-ROLLBACK-VALIDATION
          path: reports/team-unit-grades-2026-rollback-validation.json
          if-no-files-found: warn

      - name: Summary
        if: always()
        env:
          INPUT_SEASON: ${{ inputs.season }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "========================================================"
          echo "2026 TEAM UNIT GRADES — ROLLBACK-ONLY WRITE VALIDATION"
          echo "========================================================"
          echo "season: ${INPUT_SEASON}"
          echo "expected_main_sha: ${EXPECTED_MAIN_SHA}"
          if [ -n "${ACTUAL_SHA:-}" ]; then
            echo "actual_sha: ${ACTUAL_SHA}"
          else
            echo "actual_sha: (unavailable)"
          fi
          echo "status: ${JOB_STATUS}"
          echo "providersInvoked: false"
          echo "providerCalls=0"
          echo "persistent writes are forbidden; artifact must show rollbackVerified=true"
          echo "Shadow writes: false"
          echo "prisma migrate: not invoked"
          echo "========================================================"
