# Validation-only CI for ML-CAL-1 G3 fixture-first capture/binding wiring.
# No DB, no secrets, no providers, no production writes, no live capture.

name: Test ML-CAL-1 Capture-Binding G3

on:
  pull_request:
    paths:
      - 'apps/jobs/lib/ml-cal-1-capture-binding-fixture.ts'
      - 'apps/jobs/lib/ml-cal-1-capture-binding-integration.ts'
      - 'apps/jobs/lib/ml-cal-1-capture.ts'
      - 'apps/jobs/lib/ml-cal-1-lifecycle-binding.ts'
      - 'apps/jobs/capture-ml-cal-1-2026.ts'
      - 'apps/jobs/__tests__/ml-cal-1-capture-binding-g3.test.ts'
      - 'apps/jobs/__tests__/fixtures/packages/ml-cal-1-lifecycle-binding-week5-commit/**'
      - 'research/moneyline/ML_CAL_1_CAPTURE_BINDING_INTEGRATION_G3_RUNBOOK.md'
      - '.github/workflows/test-ml-cal-1-capture-binding-g3-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run G3 fixture wiring tests
        run: |
          npx jest --runInBand --runTestsByPath \
            apps/jobs/__tests__/ml-cal-1-capture-binding-g3.test.ts

      - name: Secret-free Week 5 digest check
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, re
          root = pathlib.Path('apps/jobs/__tests__/fixtures/packages/ml-cal-1-lifecycle-binding-week5-commit')
          expected = {
              'archive.zip': 'b0177de089237876c2e258fb97d84af3803ef7d1e7402cae853670ee8a6cd316',
              'core-v1-lifecycle-2026-through-week-5-COMMIT.json': 'c20b789ce45b58362a23b2ab2a69184fda2a39377c99d58db6268376b79a2e1e',
          }
          for name, digest in expected.items():
              got = hashlib.sha256((root / name).read_bytes()).hexdigest()
              assert got == digest, f'{name}: {got} != {digest}'
              print(f'ok {name} {got}')
          secretish = re.compile(r'(?i)(api[_-]?key|secret|password|bearer\s+[a-z0-9]|ghp_[A-Za-z0-9]+)')
          for p in [
              pathlib.Path('apps/jobs/lib/ml-cal-1-capture-binding-fixture.ts'),
              pathlib.Path('apps/jobs/__tests__/ml-cal-1-capture-binding-g3.test.ts'),
          ]:
              assert not secretish.search(p.read_text(encoding='utf-8')), p
          print('ok secret-free scan')
          PY
