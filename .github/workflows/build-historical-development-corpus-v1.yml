name: Build Historical Development Corpus V1 (Manual, Guarded)

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: 'Exact current main SHA'
        required: true
        type: string
      confirmation:
        description: 'Type BUILD_2022_2023_HISTORICAL_DEVELOPMENT_CORPUS_V1 exactly'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-development-corpus-v1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SOURCE_2022_ARTIFACT_ID: '10988661299'
      SOURCE_2023_ARTIFACT_ID: '10990949531'
      SOURCE_2022_SHA256: '7a5b76b681b0ef1873853956cdc5b39cb3581675cf84e6ca6f972141ea2dfe99'
      SOURCE_2023_SHA256: '479d5dc4481a6f7ab7b2c034976b8845814121cfc0f11c0b18a8166c61fc5bd4'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Source SHA guard
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "ACTUAL_SHA=${ACTUAL_SHA}" >> "$GITHUB_ENV"
          echo "actual_sha=${ACTUAL_SHA}"
          echo "expected_main_sha=${EXPECTED_MAIN_SHA}"
          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "::error::Refusing corpus build outside refs/heads/main."
            exit 1
          fi
          if [ -z "${EXPECTED_MAIN_SHA}" ] || [ "${ACTUAL_SHA}" != "${EXPECTED_MAIN_SHA}" ]; then
            echo "::error::Refusing corpus build because main SHA does not match expected_main_sha."
            exit 1
          fi
          echo "Source SHA guard passed."

      - name: Preflight
        env:
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "${INPUT_CONFIRMATION}" != "BUILD_2022_2023_HISTORICAL_DEVELOPMENT_CORPUS_V1" ]; then
            echo "::error::Exact corpus-build confirmation is required."
            exit 1
          fi
          command -v curl >/dev/null
          command -v unzip >/dev/null
          command -v sha256sum >/dev/null
          echo "mode=ARTIFACT_ONLY_OFFLINE_BUILD"
          echo "developmentSeasons=2022,2023"
          echo "sourceProviderCalls=0"
          echo "databaseReads=false"
          echo "databaseWrites=false"
          echo "featureEngineering=false"
          echo "modelFitting=false"
          echo "validation2024=false"
          echo "holdout2025=false"

      - name: Download frozen GitHub source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .research-inputs
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts"

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/${SOURCE_2022_ARTIFACT_ID}/zip" \
            -o .research-inputs/historical-research-snapshot-v1-2022-36464140881.zip

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/${SOURCE_2023_ARTIFACT_ID}/zip" \
            -o .research-inputs/historical-research-snapshot-v1-2023-36470674904.zip

      - name: Verify frozen source ZIP hashes
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            "${SOURCE_2022_SHA256}" \
            ".research-inputs/historical-research-snapshot-v1-2022-36464140881.zip" \
            | sha256sum -c -
          printf '%s  %s\n' \
            "${SOURCE_2023_SHA256}" \
            ".research-inputs/historical-research-snapshot-v1-2023-36470674904.zip" \
            | sha256sum -c -

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Compile corpus builder without lifecycle-dependent runtime
        run: |
          set -euo pipefail
          rm -rf .tmp/historical-development-corpus-v1
          npx tsc --module commonjs \
            --moduleResolution node \
            --target ES2019 \
            --esModuleInterop \
            --skipLibCheck \
            --outDir .tmp/historical-development-corpus-v1 \
            apps/jobs/src/research/historical-development-corpus-v1.ts \
            apps/jobs/build-historical-development-corpus-v1.ts

      - name: Build Historical Development Corpus V1
        env:
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          OUT="reports/historical-development-corpus-v1/${GITHUB_RUN_ID}"
          node .tmp/historical-development-corpus-v1/build-historical-development-corpus-v1.js \
            --source-2022-zip .research-inputs/historical-research-snapshot-v1-2022-36464140881.zip \
            --source-2023-zip .research-inputs/historical-research-snapshot-v1-2023-36470674904.zip \
            --confirm "${INPUT_CONFIRMATION}" \
            --output-dir "${OUT}"

      - name: Upload immutable corpus evidence
        uses: actions/upload-artifact@v4
        with:
          name: historical-development-corpus-v1-${{ github.run_id }}
          path: reports/historical-development-corpus-v1/**
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
          overwrite: false
          include-hidden-files: false

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "==================================================="
          echo "HISTORICAL DEVELOPMENT CORPUS V1"
          echo "==================================================="
          echo "status=${JOB_STATUS}"
          echo "sourceSha=${ACTUAL_SHA:-unavailable}"
          echo "mode=ARTIFACT_ONLY_OFFLINE_BUILD"
          echo "frozenSource2022ArtifactId=${SOURCE_2022_ARTIFACT_ID}"
          echo "frozenSource2023ArtifactId=${SOURCE_2023_ARTIFACT_ID}"
          echo "sourceProviderCalls=0"
          echo "databaseReads=false"
          echo "databaseWrites=false"
          echo "prisma=false"
          echo "featureEngineering=false"
          echo "modelFitting=false"
          echo "2024=reserved validation; not included"
          echo "2025=locked final holdout; not included"
          echo "==================================================="
