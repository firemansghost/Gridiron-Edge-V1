name: Run Historical V2 Source Equivalence & Recovery (Manual, Guarded)

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: 'Exact current main SHA'
        required: true
        type: string
      confirmation:
        description: 'Type RUN_HISTORICAL_V2_SOURCE_EQUIVALENCE_RECOVERY exactly'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-v2-source-equivalence-recovery
  cancel-in-progress: false

env:
  CORPUS_ARTIFACT_ID: '10997010171'
  CORPUS_ZIP_SHA256: 'cea83762d2b6e492caec680a74a085ef5a5e283c36a402ef4b35acbe2ce22b7d'
  SNAPSHOT_2024_ARTIFACT_ID: '11008470975'
  SNAPSHOT_2024_ZIP_SHA256: 'b41e934b26952100e7e056a56114dc81df6bbe77f5c787f28b75b646ae7ea544'

jobs:
  source-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Source SHA guard
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "ACTUAL_SHA=${ACTUAL_SHA}" >> "$GITHUB_ENV"
          echo "actual_sha=${ACTUAL_SHA}"
          echo "expected_main_sha=${EXPECTED_MAIN_SHA}"

          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "::error::Refusing V2 source resolution outside refs/heads/main."
            exit 1
          fi
          if [ -z "${EXPECTED_MAIN_SHA}" ] || [ "${ACTUAL_SHA}" != "${EXPECTED_MAIN_SHA}" ]; then
            echo "::error::Refusing V2 source resolution because main SHA does not match expected_main_sha."
            exit 1
          fi
          echo "Source SHA guard passed."

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Preflight
        env:
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          set -euo pipefail

          if [ "${INPUT_CONFIRMATION}" != "RUN_HISTORICAL_V2_SOURCE_EQUIVALENCE_RECOVERY" ]; then
            echo "::error::Exact V2 source-resolution confirmation is required."
            exit 1
          fi
          if [ -z "${CFBD_API_KEY:-}" ]; then
            echo "::error::CFBD_API_KEY secret is missing."
            exit 1
          fi

          command -v curl >/dev/null
          command -v unzip >/dev/null
          command -v sha256sum >/dev/null

          echo "mode=HISTORICAL_V2_SOURCE_EQUIVALENCE_AND_RECOVERY"
          echo "provider=CFBD"
          echo "endpoint=/game/box/advanced"
          echo "providerCallsHardMax=12"
          echo "calibrationSeasons=2022,2023"
          echo "observedSourceSeason=2024"
          echo "modelScore2024=false"
          echo "marketReads=0"
          echo "holdout2025Reads=0"
          echo "databaseReads=false"
          echo "databaseWrites=false"
          echo "prisma=false"

      - name: Download frozen research artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .research-inputs

          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts"

          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API}/${CORPUS_ARTIFACT_ID}/zip" \
            -o .research-inputs/historical-development-corpus-v1-36479515332.zip

          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API}/${SNAPSHOT_2024_ARTIFACT_ID}/zip" \
            -o .research-inputs/historical-research-snapshot-v1-2024-36508377627.zip

      - name: Verify frozen ZIP hashes
        run: |
          set -euo pipefail

          echo "${CORPUS_ZIP_SHA256}  .research-inputs/historical-development-corpus-v1-36479515332.zip" | sha256sum -c -
          echo "${SNAPSHOT_2024_ZIP_SHA256}  .research-inputs/historical-research-snapshot-v1-2024-36508377627.zip" | sha256sum -c -

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Compile V2 source-resolution runtime
        run: |
          set -euo pipefail
          rm -rf .tmp/historical-v2-source-resolution
          npx tsc --module commonjs \
            --moduleResolution node \
            --target ES2019 \
            --esModuleInterop \
            --skipLibCheck \
            --outDir .tmp/historical-v2-source-resolution \
            apps/jobs/src/research/historical-source-resolution-v2.ts \
            apps/jobs/run-historical-v2-source-resolution.ts

      - name: Run source equivalence and conditional recovery
        env:
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          set -euo pipefail
          OUT="reports/historical-v2-source-resolution/${GITHUB_RUN_ID}"

          node .tmp/historical-v2-source-resolution/run-historical-v2-source-resolution.js \
            --corpus-zip .research-inputs/historical-development-corpus-v1-36479515332.zip \
            --snapshot-zip .research-inputs/historical-research-snapshot-v1-2024-36508377627.zip \
            --confirm "${INPUT_CONFIRMATION}" \
            --output-dir "${OUT}"

      - name: Upload immutable V2 source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-v2-source-resolution-${{ github.run_id }}
          path: reports/historical-v2-source-resolution/**
          if-no-files-found: warn
          retention-days: 90

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "==================================================="
          echo "HISTORICAL V2 SOURCE EQUIVALENCE & RECOVERY"
          echo "==================================================="
          echo "status=${JOB_STATUS}"
          echo "sourceSha=${ACTUAL_SHA:-unavailable}"
          echo "provider=CFBD"
          echo "endpoint=/game/box/advanced"
          echo "providerCallsHardMax=12"
          echo "2024 model score=false"
          echo "market reads=0"
          echo "2025 reads=0"
          echo "database reads/writes=false/false"
          echo "==================================================="
