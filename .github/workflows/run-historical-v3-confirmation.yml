name: Run Historical V3 Confirmation (Manual, Guarded)

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: 'Exact current main SHA'
        required: true
        type: string
      prescore_artifact_id:
        description: 'Audited Historical V3 prescore artifact ID'
        required: true
        type: string
      prescore_zip_sha256:
        description: 'Exact audited V3 prescore ZIP SHA-256'
        required: true
        type: string
      v3_model_artifact_id:
        description: 'Audited Historical Model V3 artifact ID'
        required: true
        type: string
      v3_model_zip_sha256:
        description: 'Exact audited Historical Model V3 ZIP SHA-256'
        required: true
        type: string
      predictive_artifact_id:
        description: 'Audited Historical V3 predictive-input artifact ID'
        required: true
        type: string
      predictive_zip_sha256:
        description: 'Exact audited V3 predictive-input ZIP SHA-256'
        required: true
        type: string
      resolution_artifact_id:
        description: 'Audited Historical V3 week-query resolution artifact ID'
        required: true
        type: string
      resolution_zip_sha256:
        description: 'Exact audited week-query resolution ZIP SHA-256'
        required: true
        type: string
      confirmation:
        description: 'Type SCORE_2024_HISTORICAL_V3_CONFIRMATION_ONCE exactly'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-v3-confirmation-one-shot
  cancel-in-progress: false

env:
  SNAPSHOT_ARTIFACT_ID: '11008470975'
  SNAPSHOT_ZIP_SHA256: 'b41e934b26952100e7e056a56114dc81df6bbe77f5c787f28b75b646ae7ea544'

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Source SHA and one-shot confirmation guard
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          PRESCORE_ARTIFACT_ID_INPUT: ${{ inputs.prescore_artifact_id }}
          PRESCORE_ZIP_SHA256_INPUT: ${{ inputs.prescore_zip_sha256 }}
          V3_MODEL_ARTIFACT_ID_INPUT: ${{ inputs.v3_model_artifact_id }}
          V3_MODEL_ZIP_SHA256_INPUT: ${{ inputs.v3_model_zip_sha256 }}
          PREDICTIVE_ARTIFACT_ID_INPUT: ${{ inputs.predictive_artifact_id }}
          PREDICTIVE_ZIP_SHA256_INPUT: ${{ inputs.predictive_zip_sha256 }}
          RESOLUTION_ARTIFACT_ID_INPUT: ${{ inputs.resolution_artifact_id }}
          RESOLUTION_ZIP_SHA256_INPUT: ${{ inputs.resolution_zip_sha256 }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "ACTUAL_SHA=${ACTUAL_SHA}" >> "$GITHUB_ENV"

          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "::error::Refusing V3 confirmation outside refs/heads/main."
            exit 1
          fi
          if [ -z "${EXPECTED_MAIN_SHA}" ] || [ "${ACTUAL_SHA}" != "${EXPECTED_MAIN_SHA}" ]; then
            echo "::error::Refusing V3 confirmation because main SHA does not match expected_main_sha."
            exit 1
          fi
          if [ "${INPUT_CONFIRMATION}" != "SCORE_2024_HISTORICAL_V3_CONFIRMATION_ONCE" ]; then
            echo "::error::Exact one-shot V3 confirmation string is required."
            exit 1
          fi

          for VALUE in "${PRESCORE_ARTIFACT_ID_INPUT}" "${V3_MODEL_ARTIFACT_ID_INPUT}" "${PREDICTIVE_ARTIFACT_ID_INPUT}" "${RESOLUTION_ARTIFACT_ID_INPUT}"; do
            printf '%s' "${VALUE}" | grep -Eq '^[0-9]+$' || {
              echo "::error::Artifact IDs must be numeric."
              exit 1
            }
          done
          for VALUE in "${PRESCORE_ZIP_SHA256_INPUT}" "${V3_MODEL_ZIP_SHA256_INPUT}" "${PREDICTIVE_ZIP_SHA256_INPUT}" "${RESOLUTION_ZIP_SHA256_INPUT}"; do
            printf '%s' "${VALUE}" | grep -Eq '^[0-9a-fA-F]{64}$' || {
              echo "::error::Artifact ZIP hashes must be exact SHA-256 values."
              exit 1
            }
          done

          echo "PRESCORE_ARTIFACT_ID=${PRESCORE_ARTIFACT_ID_INPUT}" >> "$GITHUB_ENV"
          echo "PRESCORE_ZIP_SHA256=$(printf '%s' "${PRESCORE_ZIP_SHA256_INPUT}" | tr 'A-F' 'a-f')" >> "$GITHUB_ENV"
          echo "V3_MODEL_ARTIFACT_ID=${V3_MODEL_ARTIFACT_ID_INPUT}" >> "$GITHUB_ENV"
          echo "V3_MODEL_ZIP_SHA256=$(printf '%s' "${V3_MODEL_ZIP_SHA256_INPUT}" | tr 'A-F' 'a-f')" >> "$GITHUB_ENV"
          echo "PREDICTIVE_ARTIFACT_ID=${PREDICTIVE_ARTIFACT_ID_INPUT}" >> "$GITHUB_ENV"
          echo "PREDICTIVE_ZIP_SHA256=$(printf '%s' "${PREDICTIVE_ZIP_SHA256_INPUT}" | tr 'A-F' 'a-f')" >> "$GITHUB_ENV"
          echo "RESOLUTION_ARTIFACT_ID=${RESOLUTION_ARTIFACT_ID_INPUT}" >> "$GITHUB_ENV"
          echo "RESOLUTION_ZIP_SHA256=$(printf '%s' "${RESOLUTION_ZIP_SHA256_INPUT}" | tr 'A-F' 'a-f')" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Preflight
        run: |
          set -euo pipefail
          command -v curl >/dev/null
          command -v unzip >/dev/null
          command -v sha256sum >/dev/null
          echo "mode=ONE_SHOT_2024_SOURCE_INFORMED_CONFIRMATION"
          echo "providerCalls=0"
          echo "marketReads=0"
          echo "ppaSidecarReads=0"
          echo "portalReads=0"
          echo "holdout2025Reads=0"
          echo "databaseReads=false"
          echo "databaseWrites=false"
          echo "reservedOutcome2024Read=AUTHORIZED_ONLY_BY_THIS_EXACT_DISPATCH"

      - name: Download exact frozen evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .research-inputs
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts"

          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json"             "${API}/${SNAPSHOT_ARTIFACT_ID}/zip"             -o .research-inputs/historical-2024-snapshot.zip
          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json"             "${API}/${PRESCORE_ARTIFACT_ID}/zip"             -o .research-inputs/historical-v3-prescore.zip
          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json"             "${API}/${V3_MODEL_ARTIFACT_ID}/zip"             -o .research-inputs/historical-model-v3.zip
          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json"             "${API}/${PREDICTIVE_ARTIFACT_ID}/zip"             -o .research-inputs/historical-v3-predictive.zip
          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json"             "${API}/${RESOLUTION_ARTIFACT_ID}/zip"             -o .research-inputs/historical-v3-resolution.zip

      - name: Verify ZIP hashes
        run: |
          set -euo pipefail
          echo "${SNAPSHOT_ZIP_SHA256}  .research-inputs/historical-2024-snapshot.zip" | sha256sum -c -
          echo "${PRESCORE_ZIP_SHA256}  .research-inputs/historical-v3-prescore.zip" | sha256sum -c -
          echo "${V3_MODEL_ZIP_SHA256}  .research-inputs/historical-model-v3.zip" | sha256sum -c -
          echo "${PREDICTIVE_ZIP_SHA256}  .research-inputs/historical-v3-predictive.zip" | sha256sum -c -
          echo "${RESOLUTION_ZIP_SHA256}  .research-inputs/historical-v3-resolution.zip" | sha256sum -c -

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Compile one-shot scorer
        run: |
          set -euo pipefail
          rm -rf .tmp/historical-v3-confirmation
          npx tsc             --module commonjs             --moduleResolution node             --target ES2019             --esModuleInterop             --skipLibCheck             --outDir .tmp/historical-v3-confirmation             apps/jobs/src/research/historical-model-development-v1.ts             apps/jobs/src/research/historical-model-v3.ts             apps/jobs/src/research/historical-v3-predictive-inputs.ts             apps/jobs/src/research/historical-v3-confirmation.ts             apps/jobs/run-historical-v3-confirmation.ts

      - name: Run one-shot 2024 source-informed confirmation
        env:
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          OUT="reports/historical-v3-confirmation/${GITHUB_RUN_ID}"
          node .tmp/historical-v3-confirmation/run-historical-v3-confirmation.js             --snapshot-zip .research-inputs/historical-2024-snapshot.zip             --prescore-zip .research-inputs/historical-v3-prescore.zip             --prescore-zip-sha256 "${PRESCORE_ZIP_SHA256}"             --v3-model-zip .research-inputs/historical-model-v3.zip             --v3-model-zip-sha256 "${V3_MODEL_ZIP_SHA256}"             --predictive-zip .research-inputs/historical-v3-predictive.zip             --predictive-zip-sha256 "${PREDICTIVE_ZIP_SHA256}"             --resolution-zip .research-inputs/historical-v3-resolution.zip             --resolution-zip-sha256 "${RESOLUTION_ZIP_SHA256}"             --confirm "${INPUT_CONFIRMATION}"             --output-dir "${OUT}"

      - name: Upload immutable V3 confirmation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-v3-confirmation-${{ github.run_id }}
          path: reports/historical-v3-confirmation/**
          if-no-files-found: warn
          retention-days: 90

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "==================================================="
          echo "HISTORICAL V3 ONE-SHOT 2024 CONFIRMATION"
          echo "==================================================="
          echo "status=${JOB_STATUS}"
          echo "sourceSha=${ACTUAL_SHA:-unavailable}"
          echo "providerCalls=0"
          echo "marketReads=0"
          echo "ppaSidecarReads=0"
          echo "portalReads=0"
          echo "2025 reads=0"
          echo "database reads/writes=false/false"
          echo "==================================================="
