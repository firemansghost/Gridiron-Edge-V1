# Legacy Grade Bets workflow (Phase 2C-2J-6C-1).
# Identity/schedule retained for inventory compatibility.
# ALL events (schedule + workflow_dispatch) are HARD-HELD:
# zero checkout, secrets, npm, grading commands, providers, or Bet writes.
# Production grading uses 2026 Grade Bets (Manual, Guarded) instead.

name: Grade Bets

on:
  schedule:
    # Hourly on Saturday and Sunday
    - cron: '0 * * * 6,0'
    # Nightly otherwise at 3:00 UTC
    - cron: '0 3 * * 1-5'
  workflow_dispatch:
    inputs:
      season:
        description: 'Season to grade (optional) — IGNORED under 6C-1 hold'
        required: false
        type: string
      week:
        description: 'Week to grade (optional) — IGNORED under 6C-1 hold'
        required: false
        type: string
      force:
        description: 'Force regrade — IGNORED under 6C-1 hold'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: grade-bets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 2C-2J-6C-1 hold — zero checkout / secrets / provider / DB / Bet writes.
  grading-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hold Grade Bets (2C-2J-6C-1)
        run: |
          set -euo pipefail
          echo "2C-2J-6C-1 Grade Bets hold"
          echo "Recurring / legacy grading is NOT AUTHORIZED in this phase."
          echo "gradingWrites=false"
          echo "dbAccess=false"
          echo "providerCalls=0"
          echo "legacy npm run grade:bets: not invoked"
          echo "Use workflow 2026 Grade Bets (Manual, Guarded) for PREVIEW/COMMIT."
