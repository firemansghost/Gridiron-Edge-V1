# Manual GUARDED Core V1 2026 lifecycle ratings (Candidate A + B1 GLOBAL_BLEND_W3_W6).
# workflow_dispatch ONLY — no schedule, push, or pull_request.
# PREVIEW by default. COMMIT requires mode=COMMIT and confirmation=WRITE_2026_CORE_V1.
# completed_through_week = last week of FINAL results allowed into ratings (not prediction week).
# DIRECT_URL only. No CFBD. No Odds. No schedule ingest.
# First production COMMIT remains NOT AUTHORIZED until PREVIEW independently reviewed.
#
# Security:
# - Dispatch inputs reach shell only via step-level env (never ${{ inputs.* }} inside run:).
# - Production DIRECT_URL is NOT job-wide; scoped only to Preflight presence check + lifecycle execution.

name: Write 2026 Core V1 Lifecycle Ratings (Manual, Guarded)

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season year (must be 2026)'
        required: true
        type: string
        default: '2026'
      completed_through_week:
        description: 'Last completed week of FINAL results included in ratings (>=0)'
        required: true
        type: string
        default: '0'
      mode:
        description: 'PREVIEW (read-only) or COMMIT (transactional write)'
        required: true
        type: choice
        options:
          - PREVIEW
          - COMMIT
        default: PREVIEW
      confirmation:
        description: 'For COMMIT, type WRITE_2026_CORE_V1 exactly'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: write-core-v1-lifecycle-${{ inputs.season }}-${{ inputs.completed_through_week }}
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Preflight (names/presence only)
        env:
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_COMPLETED_THROUGH_WEEK: ${{ inputs.completed_through_week }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          SEASON="$INPUT_SEASON"
          WEEK="$INPUT_COMPLETED_THROUGH_WEEK"
          MODE="$INPUT_MODE"
          CONFIRM="$INPUT_CONFIRMATION"
          echo "season=${SEASON}"
          echo "completedThroughWeek=${WEEK}"
          echo "mode=${MODE}"
          echo "selectedPolicy=GLOBAL_BLEND_W3_W6"
          echo "candidateAFormula=talentZ*3.5"
          echo "providersInvoked=false"
          echo "Odds=false"
          echo "CFBD_API_KEY: not provided"
          echo "ODDS_API_KEY: not provided"

          if [ "$SEASON" != "2026" ]; then
            echo "::error::season must equal 2026 (got ${SEASON})"
            exit 1
          fi
          if ! [[ "$WEEK" =~ ^[0-9]+$ ]]; then
            echo "::error::completed_through_week must be a non-negative integer"
            exit 1
          fi
          if [ "$MODE" != "PREVIEW" ] && [ "$MODE" != "COMMIT" ]; then
            echo "::error::mode must be PREVIEW or COMMIT"
            exit 1
          fi
          if [ "$MODE" = "COMMIT" ] && [ "$CONFIRM" != "WRITE_2026_CORE_V1" ]; then
            echo "::error::COMMIT requires confirmation=WRITE_2026_CORE_V1"
            exit 1
          fi
          if [ -z "${DIRECT_URL:-}" ]; then
            echo "::error::DIRECT_URL secret is missing"
            exit 1
          fi
          echo "DIRECT_URL: present (value not printed)"

      - name: Install dependencies
        env:
          # Inert placeholders only — no production DB secret.
          DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma_generate_placeholder
          DIRECT_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma_generate_placeholder
        run: npm ci

      - name: Generate Prisma client
        env:
          # Inert placeholders only — no production DB secret; generate does not connect.
          DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma_generate_placeholder
          DIRECT_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma_generate_placeholder
        run: npm run prisma:generate

      - name: Run Core V1 lifecycle (guarded)
        env:
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_COMPLETED_THROUGH_WEEK: ${{ inputs.completed_through_week }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          if [ "$INPUT_MODE" = "COMMIT" ]; then
            npx tsx apps/jobs/write-core-v1-lifecycle.ts \
              --season "$INPUT_SEASON" \
              --completed-through-week "$INPUT_COMPLETED_THROUGH_WEEK" \
              --mode "$INPUT_MODE" \
              --confirm "$INPUT_CONFIRMATION"
          else
            npx tsx apps/jobs/write-core-v1-lifecycle.ts \
              --season "$INPUT_SEASON" \
              --completed-through-week "$INPUT_COMPLETED_THROUGH_WEEK" \
              --mode "$INPUT_MODE"
          fi

      - name: Summary
        if: always()
        env:
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_COMPLETED_THROUGH_WEEK: ${{ inputs.completed_through_week }}
          INPUT_MODE: ${{ inputs.mode }}
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "============================================"
          echo "WRITE 2026 CORE V1 LIFECYCLE RATINGS (GUARDED)"
          echo "============================================"
          echo "season: ${INPUT_SEASON}"
          echo "completedThroughWeek: ${INPUT_COMPLETED_THROUGH_WEEK}"
          echo "mode: ${INPUT_MODE}"
          echo "status: ${JOB_STATUS}"
          echo "selectedPolicy: GLOBAL_BLEND_W3_W6"
          echo "secrets used (names only): DIRECT_URL"
          echo "providers: none"
          echo "Odds: false"
          echo "============================================"
