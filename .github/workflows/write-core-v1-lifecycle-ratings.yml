# Manual GUARDED Core V1 2026 lifecycle ratings (Candidate A + B1 GLOBAL_BLEND_W3_W6).
# workflow_dispatch ONLY — no schedule, push, or pull_request.
# PREVIEW by default. COMMIT requires mode=COMMIT and confirmation=WRITE_2026_CORE_V1.
# completed_through_week = last week of FINAL results allowed into ratings (not prediction week).
# DIRECT_URL only. No CFBD. No Odds. No schedule ingest.
# First production COMMIT remains NOT AUTHORIZED until PREVIEW independently reviewed.

name: Write 2026 Core V1 Lifecycle Ratings (Manual, Guarded)

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season year (must be 2026)'
        required: true
        type: string
        default: '2026'
      completed_through_week:
        description: 'Last completed week of FINAL results included in ratings (>=0)'
        required: true
        type: string
        default: '0'
      mode:
        description: 'PREVIEW (read-only) or COMMIT (transactional write)'
        required: true
        type: choice
        options:
          - PREVIEW
          - COMMIT
        default: PREVIEW
      confirmation:
        description: 'For COMMIT, type WRITE_2026_CORE_V1 exactly'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: write-core-v1-lifecycle-${{ inputs.season }}-${{ inputs.completed_through_week }}
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DIRECT_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Preflight (names/presence only)
        run: |
          set -euo pipefail
          SEASON="${{ inputs.season }}"
          WEEK="${{ inputs.completed_through_week }}"
          MODE="${{ inputs.mode }}"
          CONFIRM="${{ inputs.confirmation }}"
          echo "season=${SEASON}"
          echo "completedThroughWeek=${WEEK}"
          echo "mode=${MODE}"
          echo "selectedPolicy=GLOBAL_BLEND_W3_W6"
          echo "candidateAFormula=talentZ*3.5"
          echo "providersInvoked=false"
          echo "Odds=false"
          echo "CFBD_API_KEY: not provided"
          echo "ODDS_API_KEY: not provided"

          if [ "$SEASON" != "2026" ]; then
            echo "::error::season must equal 2026 (got ${SEASON})"
            exit 1
          fi
          if ! [[ "$WEEK" =~ ^[0-9]+$ ]]; then
            echo "::error::completed_through_week must be a non-negative integer"
            exit 1
          fi
          if [ "$MODE" != "PREVIEW" ] && [ "$MODE" != "COMMIT" ]; then
            echo "::error::mode must be PREVIEW or COMMIT"
            exit 1
          fi
          if [ "$MODE" = "COMMIT" ] && [ "$CONFIRM" != "WRITE_2026_CORE_V1" ]; then
            echo "::error::COMMIT requires confirmation=WRITE_2026_CORE_V1"
            exit 1
          fi
          if [ -z "${DIRECT_URL:-}" ] && [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DIRECT_URL secret is missing"
            exit 1
          fi
          echo "DIRECT_URL: present (value not printed)"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run Core V1 lifecycle (guarded)
        run: |
          set -euo pipefail
          if [ "${{ inputs.mode }}" = "COMMIT" ]; then
            npx tsx apps/jobs/write-core-v1-lifecycle.ts \
              --season "${{ inputs.season }}" \
              --completed-through-week "${{ inputs.completed_through_week }}" \
              --mode COMMIT \
              --confirm "${{ inputs.confirmation }}"
          else
            npx tsx apps/jobs/write-core-v1-lifecycle.ts \
              --season "${{ inputs.season }}" \
              --completed-through-week "${{ inputs.completed_through_week }}" \
              --mode PREVIEW
          fi

      - name: Summary
        if: always()
        run: |
          echo "============================================"
          echo "WRITE 2026 CORE V1 LIFECYCLE RATINGS (GUARDED)"
          echo "============================================"
          echo "season: ${{ inputs.season }}"
          echo "completedThroughWeek: ${{ inputs.completed_through_week }}"
          echo "mode: ${{ inputs.mode }}"
          echo "status: ${{ job.status }}"
          echo "selectedPolicy: GLOBAL_BLEND_W3_W6"
          echo "secrets used (names only): DIRECT_URL"
          echo "providers: none"
          echo "Odds: false"
          echo "============================================"
