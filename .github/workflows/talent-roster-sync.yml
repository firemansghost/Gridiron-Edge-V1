# LEGACY / HISTORICAL — CFBD Team Roster Talent Sync (≤2025 only)
# NOT the approved 2026 write path.
# For 2026 use: Initialize 2026 Team Talent (Guarded)
# workflow_dispatch ONLY — schedule removed (Phase 2C-2H-2).
# Legacy writer refuses season >= 2026 before provider/mutation.

name: "[LEGACY] CFBD Team Roster Talent Sync (≤2025)"

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Historical season to sync (must be ≤2025; 2026+ refused by writer)'
        required: true
        default: '2025'
        type: string

jobs:
  sync-roster-talent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build jobs
        run: npm run build:jobs

      - name: Set DATABASE_URL for Prisma
        run: |
          if [ -n "${{ secrets.DATABASE_URL }}" ]; then
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> $GITHUB_ENV
          else
            echo "ERROR: DATABASE_URL secret not set"; exit 1
          fi
          echo "FORCE_DB_TEAMS=true" >> $GITHUB_ENV

      - name: Set DIRECT_URL for Prisma
        run: |
          if [ -n "${{ secrets.DIRECT_URL }}" ]; then
            echo "DIRECT_URL=${{ secrets.DIRECT_URL }}" >> $GITHUB_ENV
          else
            echo "DIRECT_URL=${{ secrets.DATABASE_URL }}" >> $GITHUB_ENV
          fi

      - name: Run CFBD Team Roster Talent Sync (legacy)
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFBD_BASE_URL: ${{ vars.CFBD_BASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          LEGACY_TALENT_SEASON: ${{ github.event.inputs.season }}
        run: |
          set -euo pipefail
          SEASON="${LEGACY_TALENT_SEASON}"
          echo "LEGACY roster talent sync for season $SEASON (≤2025 only)"
          if [ "$SEASON" -ge 2026 ]; then
            echo "::error::Legacy talent workflow refuses season >= 2026. Use Initialize 2026 Team Talent (Guarded)."
            exit 1
          fi
          node apps/jobs/dist/src/talent/cfbd_team_roster_talent.js --season "$SEASON"

      - name: Verify talent data was inserted
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          LEGACY_TALENT_SEASON: ${{ github.event.inputs.season }}
        run: |
          set -euo pipefail
          SEASON="${LEGACY_TALENT_SEASON}"
          echo "Checking team_season_talent table..."
          npx prisma db execute --schema=prisma/schema.prisma --stdin <<< "SELECT COUNT(*) as total_records, COUNT(DISTINCT season) as seasons, COUNT(DISTINCT team_id) as teams FROM team_season_talent WHERE season = $SEASON;"
          
          echo "Sample records:"
          npx prisma db execute --schema=prisma/schema.prisma --stdin <<< "SELECT team_id, talent_composite, blue_chips_pct, five_star, four_star, three_star FROM team_season_talent WHERE season = $SEASON ORDER BY talent_composite DESC LIMIT 5;"
