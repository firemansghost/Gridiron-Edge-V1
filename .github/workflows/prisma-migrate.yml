# Manual production Prisma migration deployment.
# workflow_dispatch ONLY — no push/schedule/pull_request auto-migrate.
#
# Operational note (Phase 2C-2G-1):
# Merging prisma/schema.prisma or prisma/migrations/** to main does NOT
# apply production migrations. After a schema PR merges, an operator must
# deliberately run this workflow with confirm=MIGRATE_PRODUCTION.
#
# Phase 2C-2G-2B: Preflight/post-deploy fail closed on migration-history
# divergence (DB migrations not found locally), even when pending migrations
# are also present. Do not auto-repair _prisma_migrations.
#
# Historical note: The former recurring DELETE/INSERT against
# _prisma_migrations for 20251027_t6q_fixup_missing_teams was a one-time
# Oct 2025 repair for a failed team-backfill migration. It is intentionally
# NOT part of the normal deploy path. Ad-hoc SQL under prisma/migrations/
# (*cleanup*, *resolve*, *mark-migration*) remains historical/emergency only.

name: Prisma Migrate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type MIGRATE_PRODUCTION to authorize production migrate deploy'
        required: true
        type: string
      expected_main_sha:
        description: 'Exact main commit SHA authorized for this deployment'
        required: true
        type: string
      expected_migration:
        description: 'Exact single pending migration expected to be deployed'
        required: true
        type: string
      migration_reason:
        description: 'Short reason for this production migration (log context only)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: prisma-migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Confirm production migration authorization
        env:
          MIGRATION_CONFIRM: ${{ inputs.confirm }}
          MIGRATION_REASON: ${{ inputs.migration_reason }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          EXPECTED_MIGRATION: ${{ inputs.expected_migration }}
        run: |
          set -euo pipefail
          if [ "$MIGRATION_CONFIRM" != "MIGRATE_PRODUCTION" ]; then
            echo "::error::Refusing migrate deploy. confirm must equal MIGRATE_PRODUCTION."
            exit 1
          fi
          if [ -z "${EXPECTED_MAIN_SHA}" ]; then
            echo "::error::Refusing migrate deploy. expected_main_sha is required."
            exit 1
          fi
          if [ -z "${EXPECTED_MIGRATION}" ]; then
            echo "::error::Refusing migrate deploy. expected_migration is required."
            exit 1
          fi
          echo "confirm: MIGRATE_PRODUCTION"
          printf 'expected_main_sha: %s\n' "$EXPECTED_MAIN_SHA"
          printf 'expected_migration: %s\n' "$EXPECTED_MIGRATION"
          if [ -n "$MIGRATION_REASON" ]; then
            printf 'migration_reason: %s\n' "$MIGRATION_REASON"
          else
            echo "migration_reason: (none provided)"
          fi
          echo "ODDS_API_KEY: not provided"
          echo "CFBD_API_KEY: not provided"
          echo "providers/ETL/ratings: not invoked"
          echo "_prisma_migrations repair: not invoked"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Source SHA guard
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "ACTUAL_SHA=${ACTUAL_SHA}" >> "$GITHUB_ENV"
          echo "actual_sha: ${ACTUAL_SHA}"
          echo "expected_main_sha: ${EXPECTED_MAIN_SHA}"
          echo "github_ref: ${GITHUB_REF:-}"
          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "::error::Refusing migrate deploy. Workflow must run from main."
            echo "::error::github_ref=${GITHUB_REF:-}"
            exit 1
          fi
          if [ "${ACTUAL_SHA}" != "${EXPECTED_MAIN_SHA}" ]; then
            echo "::error::Refusing migrate deploy. Checked-out SHA does not match expected_main_sha."
            echo "::error::actual_sha=${ACTUAL_SHA}"
            echo "::error::expected_main_sha=${EXPECTED_MAIN_SHA}"
            exit 1
          fi
          echo "Source SHA guard passed."

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Preflight secrets (names/presence only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret is missing"
            exit 1
          fi
          if [ -z "${DIRECT_URL:-}" ]; then
            echo "::error::DIRECT_URL secret is missing"
            exit 1
          fi
          echo "DATABASE_URL: present (value not printed)"
          echo "DIRECT_URL: present (value not printed)"

      - name: Install dependencies
        run: npm ci

      - name: Prisma version
        run: npx prisma -v

      - name: Verify migration directory
        run: |
          set -euo pipefail
          test -f prisma/schema.prisma
          test -d prisma/migrations
          ls -la prisma/migrations

      - name: Wait for pooled (6543)
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..12}; do
            if timeout 5 bash -lc "echo > /dev/tcp/aws-1-us-east-2.pooler.supabase.com/6543"; then
              echo "Pooled reachable"
              exit 0
            fi
            echo "Waiting pooled... ($i/12)"
            sleep 5
          done
          echo "::error::Pooled database endpoint not reachable"
          exit 1

      - name: Wait for direct (5432)
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..12}; do
            if timeout 5 bash -lc "echo > /dev/tcp/aws-1-us-east-2.pooler.supabase.com/5432"; then
              echo "Direct reachable"
              exit 0
            fi
            echo "Waiting direct... ($i/12)"
            sleep 5
          done
          echo "::error::Direct database endpoint not reachable"
          exit 1

      - name: Prisma migrate status (fail closed on failed/unsafe state)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          EXPECTED_MIGRATION: ${{ inputs.expected_migration }}
        shell: bash
        run: |
          set -uo pipefail
          set +e
          STATUS_OUTPUT=$(npx prisma migrate status --schema=prisma/schema.prisma 2>&1)
          STATUS_CODE=$?
          set -e
          echo "$STATUS_OUTPUT"

          # 1) Failed / P3009 / unresolved failed migration → operator intervention required
          if echo "$STATUS_OUTPUT" | grep -Eqi 'P3009|have failed|migration .* failed|failed migrations? in the (target )?database|The following migration\(s\) have failed'; then
            echo "::error::Unsafe failed-migration state detected. Do not auto-repair. Resolve manually, then re-run."
            exit 1
          fi

          # 2) Migration-history divergence (DB has migrations absent from repo) → fail closed
          # Must run BEFORE accepting pending: real production status can contain BOTH.
          if echo "$STATUS_OUTPUT" | grep -Eqi 'Your local migration history and the migrations table from your database are different|The migrations from the database are not found locally in prisma/migrations'; then
            echo "::error::Production migration history contains migrations that are not present in the repository."
            echo "::error::Refusing migrate deploy. Investigate migration history before applying new migrations."
            echo "::error::Do not auto-repair or modify _prisma_migrations."
            exit 1
          fi

          if [ -z "${EXPECTED_MIGRATION}" ]; then
            echo "::error::expected_migration is required."
            exit 1
          fi

          PENDING_NAMES=$(printf '%s\n' "$STATUS_OUTPUT" | awk '
            BEGIN { pending = 0 }
            tolower($0) ~ /have not yet been applied/ {
              pending = 1
              next
            }
            pending && $0 ~ /^To apply migrations/ {
              pending = 0
              next
            }
            pending && $0 ~ /^[[:space:]]*$/ { next }
            pending { print }
          ')

          PENDING_COUNT=0
          PENDING_MIGRATION=""
          if [ -n "${PENDING_NAMES}" ]; then
            while IFS= read -r name; do
              [ -z "${name}" ] && continue
              if ! printf '%s\n' "$name" | grep -Eq '^[0-9]{8}[0-9]*_[A-Za-z0-9_]+$'; then
                echo "::error::Ambiguous pending-migration parse; refusing prose as a migration name."
                printf 'parsed_line: %s\n' "$name"
                exit 1
              fi
              if [ ! -f "prisma/migrations/${name}/migration.sql" ]; then
                echo "::error::Parsed pending name has no prisma/migrations/<name>/migration.sql."
                printf 'parsed_line: %s\n' "$name"
                exit 1
              fi
              PENDING_COUNT=$((PENDING_COUNT + 1))
              if [ -n "${PENDING_MIGRATION}" ]; then
                PENDING_MIGRATION="${PENDING_MIGRATION}"$'\n'"${name}"
              else
                PENDING_MIGRATION="${name}"
              fi
            done < <(printf '%s\n' "$PENDING_NAMES")
          fi

          echo "pending_count=${PENDING_COUNT}"
          echo "pending_migration=${PENDING_MIGRATION}"
          echo "expected_migration=${EXPECTED_MIGRATION}"

          if [ "${PENDING_COUNT}" -eq 0 ]; then
            echo "::error::Zero pending migrations. This is a production deployment workflow, not a no-op."
            exit 1
          fi

          if [ "${PENDING_COUNT}" -ne 1 ]; then
            echo "::error::Refusing migrate deploy. Exactly one pending migration is required."
            echo "::error::pending_count=${PENDING_COUNT}"
            exit 1
          fi

          if [ "${PENDING_MIGRATION}" != "${EXPECTED_MIGRATION}" ]; then
            echo "::error::Refusing migrate deploy. Pending migration does not match expected_migration."
            echo "::error::pending_migration=${PENDING_MIGRATION}"
            echo "::error::expected_migration=${EXPECTED_MIGRATION}"
            exit 1
          fi

          echo "Preflight: exactly one expected pending migration; proceeding to migrate deploy."

      - name: Prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Prisma generate
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Post-deploy migrate status (must be healthy)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        shell: bash
        run: |
          set -uo pipefail
          set +e
          STATUS_OUTPUT=$(npx prisma migrate status --schema=prisma/schema.prisma 2>&1)
          STATUS_CODE=$?
          set -e
          echo "$STATUS_OUTPUT"

          if echo "$STATUS_OUTPUT" | grep -Eqi 'P3009|have failed|migration .* failed|failed migrations?'; then
            echo "::error::Post-deploy status reports a failed migration"
            exit 1
          fi

          # History divergence remains unsafe even if schema appears up to date
          if echo "$STATUS_OUTPUT" | grep -Eqi 'Your local migration history and the migrations table from your database are different|The migrations from the database are not found locally in prisma/migrations'; then
            echo "::error::Post-deploy status reports migration-history divergence."
            echo "::error::Do not auto-repair or modify _prisma_migrations."
            exit 1
          fi

          if echo "$STATUS_OUTPUT" | grep -Eqi 'have not yet been applied|Following migration|not yet been applied'; then
            echo "::error::Post-deploy status still reports pending migrations"
            exit 1
          fi

          if ! echo "$STATUS_OUTPUT" | grep -Eqi 'Database schema is up to date'; then
            echo "::error::Post-deploy status did not confirm database schema is up to date (exit=${STATUS_CODE})"
            exit 1
          fi

          echo "Post-deploy migration status healthy."

      - name: Summary
        if: always()
        env:
          MIGRATION_CONFIRM: ${{ inputs.confirm }}
          MIGRATION_REASON: ${{ inputs.migration_reason }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          EXPECTED_MIGRATION: ${{ inputs.expected_migration }}
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "============================================"
          echo "PRISMA MIGRATE (MANUAL PRODUCTION)"
          echo "============================================"
          printf 'confirm: %s\n' "$MIGRATION_CONFIRM"
          printf 'expected_main_sha: %s\n' "$EXPECTED_MAIN_SHA"
          if [ -n "${ACTUAL_SHA:-}" ]; then
            printf 'actual_sha: %s\n' "$ACTUAL_SHA"
          else
            echo "actual_sha: (unavailable)"
          fi
          printf 'expected_migration: %s\n' "$EXPECTED_MIGRATION"
          if [ -n "$MIGRATION_REASON" ]; then
            printf 'migration_reason: %s\n' "$MIGRATION_REASON"
          else
            echo "migration_reason: (none provided)"
          fi
          printf 'status: %s\n' "$JOB_STATUS"
          echo "auto push trigger: disabled"
          echo "_prisma_migrations repair: not invoked"
          echo "secrets used (names only): DATABASE_URL, DIRECT_URL"
          echo "============================================"
