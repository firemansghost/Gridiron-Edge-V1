name: Test V4 Prospective V1 Generic Shadow

on:
  pull_request:
    paths:
      - 'research/v4-prospective/V4_PROSPECTIVE_V1_RUNTIME_ARTIFACT.json'
      - 'research/v4-prospective/V4_PROSPECTIVE_V1_GENERIC_SHADOW_CONTRACT.md'
      - 'apps/jobs/src/research/v4-prospective/v4-prospective-v1-*.ts'
      - 'apps/jobs/capture-shadow-model-predictions-2026.ts'
      - 'apps/jobs/src/shadow-model-operational-frame.ts'
      - 'apps/web/lib/shadow-model-capture-v1.ts'
      - '.github/workflows/capture-shadow-model-predictions-2026-manual.yml'
      - 'apps/jobs/__tests__/v4-prospective-v1-shadow-adapter.test.ts'
      - 'apps/jobs/__tests__/shadow-model-capture-v1-workflow.test.ts'
      - 'apps/web/__tests__/shadow-model-capture-v1.test.ts'
      - '.github/workflows/test-v4-prospective-v1-generic-shadow.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test V4 prospective artifact, adapter, workflow, and Generic Shadow regressions
        run: |
          npx jest \
            apps/jobs/__tests__/v4-prospective-v1-shadow-adapter.test.ts \
            apps/jobs/__tests__/shadow-model-capture-v1-workflow.test.ts \
            apps/web/__tests__/shadow-model-capture-v1.test.ts \
            --runInBand
