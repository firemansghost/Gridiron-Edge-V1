          python3 - << 'PY'
          # DIAGNOSTIC_IMPL_BEGIN
          import json
          import re
          from pathlib import Path

          OUTPUT_LIMIT = 65536
          NAME_LIMIT = 512
          ANCESTOR_LIMIT = 1024
          MESSAGE_LIMIT = 4000
          ASSERTION_PRINT_LIMIT = 40
          MESSAGE_PRINT_LIMIT = 3
          LOG_SCAN_LIMIT = 1_000_000
          EXIT_RESERVE = len("\ndiagnostic_step_exit=1\n")
          FOOTER_RESERVE = 4608
          JSON_PATH = Path("jest-integrated.json")
          LOG_PATH = Path("jest-integrated.log")
          SECRETISH = (
              (
                  re.compile(r"(?i)(?<![A-Za-z0-9_])authorization\s*[:=]\s*\S+(?:\s+\S+)?"),
                  "authorization=[REDACTED]",
              ),
              (
                  re.compile(r"(?i)([a-z][a-z0-9+.-]*://)[^\s/@:]+:[^\s/@]+@"),
                  r"\1[REDACTED]@",
              ),
              (
                  re.compile(
                      r"(?i)(?<![A-Za-z0-9_])(DATABASE_URL|DIRECT_URL|SUPABASE_DB_URL|SHADOW_DATABASE_URL)\s*[:=]\s*\S+"
                  ),
                  r"\1=[REDACTED]",
              ),
              (
                  re.compile(
                      r"(?i)(?<![A-Za-z0-9_])("
                      r"access[_-]?token|refresh[_-]?token|session[_-]?token|auth[_-]?token|"
                      r"client[_-]?secret|private[_-]?key|api[_-]?key|password|passwd|"
                      r"credentials|credential|token|secret"
                      r")\s*[:=]\s*\S+"
                  ),
                  r"\1=[REDACTED]",
              ),
              (re.compile(r"(?i)bearer\s+\S+"), "bearer [REDACTED]"),
              (re.compile(r"github_pat_[A-Za-z0-9_]+"), "[REDACTED]"),
              (re.compile(r"(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]+"), "[REDACTED]"),
          )

          def sanitize(text):
              value = str(text)
              for pattern, replacement in SECRETISH:
                  value = pattern.sub(replacement, value)
              return value


          def bound_text(text, limit):
              value = sanitize(text)
              if len(value) <= limit:
                  return value
              return value[:limit] + f"\n[truncated after {limit} characters]"


          def bound_line(text, limit):
              value = sanitize(text).replace("\r", " ").replace("\n", " ")
              if len(value) <= limit:
                  return value
              return value[:limit] + f" [truncated after {limit} characters]"


          class Budget:
              def __init__(self):
                  self.lines = []
                  self.size = 0
                  self.stopped = False
                  self.omitted = 0

              def _addition(self, piece):
                  return len(piece) + (1 if self.lines else 0)

              def add(self, text):
                  piece = str(text)
                  if self.stopped:
                      self.omitted += 1
                      return False
                  if self.size + self._addition(piece) + FOOTER_RESERVE > OUTPUT_LIMIT:
                      self.stopped = True
                      self.omitted += 1
                      return False
                  self.lines.append(piece)
                  self.size += self._addition(piece)
                  return True

              def add_final(self, text):
                  piece = str(text)
                  if self.size + self._addition(piece) + EXIT_RESERVE > OUTPUT_LIMIT:
                      self.stopped = True
                      self.omitted += 1
                      return False
                  self.lines.append(piece)
                  self.size += self._addition(piece)
                  return True


          def bound_ancestors(items):
              if not isinstance(items, list):
                  return bound_line(items, ANCESTOR_LIMIT)
              parts = []
              used = 0
              omitted = 0
              for index, item in enumerate(items):
                  full = sanitize(item).replace("\r", " ").replace("\n", " ")
                  if len(full) > NAME_LIMIT:
                      piece = full[:NAME_LIMIT] + f" [truncated after {NAME_LIMIT} characters]"
                  else:
                      piece = full
                  extra = len(piece) if not parts else len(" > ") + len(piece)
                  if used + extra > ANCESTOR_LIMIT:
                      omitted = len(items) - index
                      break
                  parts.append(piece)
                  used += extra
              text = " > ".join(parts)
              if omitted:
                  text += f" [truncated after {ANCESTOR_LIMIT} characters; omitted_ancestors={omitted}]"
              return text


          def coverage_summary(path):
              if not path.is_file():
                  return ["coverage_summary_unavailable reason=log_missing"]
              try:
                  with path.open("rb") as handle:
                      data = handle.read(LOG_SCAN_LIMIT)
                      more = handle.read(1)
              except OSError as exc:
                  return [f"coverage_summary_unavailable reason=log_unreadable {exc.__class__.__name__}"]
              lines = ["coverage_scan_bounded"] if more else []
              found = 0
              for line in data.decode("utf-8", errors="replace").splitlines():
                  if not line.lstrip().startswith("[W5 coverage]"):
                      continue
                  lines.append(bound_line(line.strip(), NAME_LIMIT))
                  found += 1
                  if found >= 5:
                      lines.append("additional_coverage_lines_omitted=true")
                      break
              if found == 0:
                  lines.append("coverage_summary_absent")
              return lines


          def finish(budget, extra):
              for line in extra:
                  budget.add_final(line)
              if budget.stopped:
                  omitted = budget.omitted
                  budget.add_final("diagnostic_output_truncated=true")
                  budget.add_final(f"omitted_diagnostic_records={omitted}")
              return budget.lines


          def diagnose(json_path, log_path):
              budget = Budget()
              budget.add("underlying_job_remains_failed=true")
              if not json_path.is_file():
                  budget.add("diagnostics=UNAVAILABLE reason=jest_json_missing")
                  return finish(budget, coverage_summary(log_path))
              try:
                  data = json.loads(json_path.read_text(encoding="utf-8-sig"))
              except (OSError, UnicodeError, json.JSONDecodeError) as exc:
                  budget.add(
                      f"diagnostics=UNAVAILABLE reason=jest_json_malformed {exc.__class__.__name__}"
                  )
                  return finish(budget, coverage_summary(log_path))
              if not isinstance(data, dict) or not isinstance(data.get("testResults"), list):
                  budget.add("diagnostics=UNAVAILABLE reason=jest_json_malformed shape")
                  return finish(budget, coverage_summary(log_path))
              failed_suites = 0
              suites_printed = 0
              failed_assertions = 0
              printed = 0
              for result in data["testResults"]:
                  if not isinstance(result, dict):
                      continue
                  status = bound_line(result.get("status", ""), NAME_LIMIT)
                  name = bound_line(result.get("name", ""), NAME_LIMIT)
                  rows = result.get("assertionResults")
                  if not isinstance(rows, list):
                      rows = []
                  failed_rows = [
                      row for row in rows if isinstance(row, dict) and row.get("status") != "passed"
                  ]
                  if status == "passed" and not failed_rows:
                      continue
                  failed_suites += 1
                  if budget.add(f"failed_suite status={status} name={name}"):
                      suites_printed += 1
                  message = result.get("message")
                  if isinstance(message, str) and message.strip():
                      budget.add("suite_message_begin")
                      budget.add(bound_text(message, MESSAGE_LIMIT))
                      budget.add("suite_message_end")
                  for row in failed_rows:
                      failed_assertions += 1
                      if printed >= ASSERTION_PRINT_LIMIT:
                          continue
                      header = (
                          "failed_assertion "
                          f"status={bound_line(row.get('status', ''), NAME_LIMIT)} "
                          f"ancestors={bound_ancestors(row.get('ancestorTitles'))} "
                          f"title={bound_line(row.get('title', ''), NAME_LIMIT)}"
                      )
                      if not budget.add(header):
                          continue
                      printed += 1
                      messages = row.get("failureMessages")
                      shown = 0
                      extra_messages = 0
                      if isinstance(messages, list):
                          for item in messages:
                              if shown >= MESSAGE_PRINT_LIMIT:
                                  extra_messages += 1
                                  continue
                              if not budget.add("failure_message_begin"):
                                  extra_messages += 1
                                  continue
                              if not budget.add(bound_text(item, MESSAGE_LIMIT)):
                                  extra_messages += 1
                                  continue
                              if not budget.add("failure_message_end"):
                                  continue
                              shown += 1
                      if extra_messages:
                          budget.add(f"additional_failure_messages_omitted={extra_messages}")
              extra = []
              omitted_assertions = failed_assertions - printed
              if omitted_assertions > 0:
                  extra.append(f"additional_failed_assertions_omitted={omitted_assertions}")
              omitted_suites = failed_suites - suites_printed
              if omitted_suites > 0:
                  extra.append(f"additional_failed_suites_omitted={omitted_suites}")
              extra.append(
                  f"diagnostics=REPORTED failed_suites={failed_suites} failed_assertions={failed_assertions}"
              )
              if failed_assertions == 0 and failed_suites == 0:
                  extra.append("job_failure_outside_jest_assertions=true")
              extra.extend(coverage_summary(log_path))
              return finish(budget, extra)


          def main():
              for line in diagnose(JSON_PATH, LOG_PATH):
                  print(line)
              print("diagnostic_step_exit=1")
              return 1
          # DIAGNOSTIC_IMPL_END
          raise SystemExit(main())
          PY
