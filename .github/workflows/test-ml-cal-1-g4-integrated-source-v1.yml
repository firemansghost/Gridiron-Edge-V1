              if base_sha != FROZEN_MAIN:
                  errors.append(f"base_sha {base_sha} != {FROZEN_MAIN}")
              return errors

          def tree_pair_errors(expected, actual):
              if expected != actual:
                  return [f"checkout_tree {actual} != merge_tree {expected}"]
              return []

          def name_status(repo, left, right):
              text = subprocess.check_output(
                  ["git", "-C", repo, "diff", "--name-status", "--no-renames", left, right],
                  text=True,
              )
              return [line for line in text.splitlines() if line.strip()]

          def merge_tree_sha(repo, base, head):
              proc = subprocess.run(
                  ["git", "-C", repo, "merge-tree", "--write-tree", base, head],
                  capture_output=True,
                  text=True,
              )
              if proc.returncode != 0:
                  return None
              lines = [line.strip() for line in proc.stdout.splitlines() if line.strip()]
              return lines[0] if lines else None

          def verify(repo, event, checkout_sha, worktree_root=None):
              errors = []
              event_name = event.get("event_name", "")
              if event_name == "pull_request_target":
                  return ["refused_pull_request_target"]
              if event_name != "pull_request":
                  return [f"refused_event {event_name}"]
              pr = event["pull_request"]
              base = pr["base"]["sha"]
              head = pr["head"]["sha"]
              errors.extend(base_errors(base, pr["base"].get("ref", "")))
              head_parents = git_text(repo, ["rev-parse", f"{head}^@"]).split()
              errors.extend(direct_child_errors(head_parents))
              errors.extend(ancestry_errors(repo, head))
              errors.extend(addition_errors(name_status(repo, REPAIR, head)))
              checkout_parents = git_text(
                  repo, ["rev-list", "--parents", "-n", "1", checkout_sha]
              ).split()[1:]
              errors.extend(parent_order_errors(checkout_parents, base, head))
              expected_tree = merge_tree_sha(repo, base, head)
              checkout_tree = git_text(repo, ["rev-parse", f"{checkout_sha}^{{tree}}"])
              if expected_tree is None:
                  errors.append("merge_tree_failed")
              else:
                  errors.extend(tree_pair_errors(expected_tree, checkout_tree))
              errors.extend(addition_errors(name_status(repo, REPAIR_TREE, checkout_tree)))
              for label, commit, oid, length, sha in HISTORICAL:
                  spec = f"{commit}:{LIB}"
                  data = git_bytes(repo, spec)
                  actual = None if data is None else git_text(repo, ["rev-parse", spec])
                  errors.extend(pin_identity(data, oid, length, sha, f"historical_{label}", actual))
                  if data is not None and hashlib.sha256(data).hexdigest() == INTEGRATED_LIB_SHA:
                      errors.append(f"historical_{label}_substituted_integrated_digest")
              for path, (oid, length, sha) in PINS.items():
                  for rev, slot in ((checkout_sha, "checkout"), (head, "source_head")):
                      spec = f"{rev}:{path}"
                      data = git_bytes(repo, spec)
                      actual = None if data is None else git_text(repo, ["rev-parse", spec])
                      errors.extend(pin_identity(data, oid, length, sha, f"{slot}:{path}", actual))
                  root = Path(worktree_root or repo)
                  disk_path = root / path
                  blob = git_bytes(repo, f"{checkout_sha}:{path}")
                  disk = disk_path.read_bytes() if disk_path.is_file() else None
                  errors.extend(worktree_errors(blob, disk, path))
              for path, oid in HISTORICAL_WORKFLOWS.items():
                  for rev in (REPAIR, head, checkout_sha):
                      actual = git_text(repo, ["rev-parse", f"{rev}:{path}"])
                      if actual != oid:
                          errors.append(f"historical_workflow {path} at {rev} {actual} != {oid}")
              launcher = subprocess.run(
                  ["git", "-C", repo, "cat-file", "-e", f"{head}:{LAUNCHER_BIN}"]
              )
              if launcher.returncode == 0:
                  errors.append("launcher_bin_present_in_source_head")
              library = git_bytes(repo, f"{checkout_sha}:{LIB}")
              if library is None:
                  errors.append("missing_source_blob integrated_library")
              else:
                  text = library.decode("utf-8")
                  if "operator_mode_refused_in_this_build" not in text:
                      errors.append("operator_refusal_missing")
                  if "evaluateOperatorWindowsGatesAfterW4" in text:
                      errors.append("operator_gate_call_present")
                  for flag in ("liveAccepted: false", "approved: false", "deployedPoolerProof: false"):
                      if flag not in text:
                          errors.append(f"approval_flag_missing {flag}")
                  if "ML_CAL_1_G4_PHASE_A_DESIGN_SHA256" not in text:
                      errors.append("design_constant_missing")
              w5 = git_bytes(
                  repo,
                  f"{checkout_sha}:apps/jobs/__tests__/ml-cal-1-g4-windows-path-identity.test.ts",
              )
              if w5 is None:
                  errors.append("missing_source_blob w5_tests")
              else:
                  w5_text = w5.decode("utf-8")
                  if "operator_mode_refused_in_this_build" not in w5_text:
                      errors.append("w5_operator_refusal_assertion_missing")
                  if "w4_pre_mutation_conflict" not in w5_text:
                      errors.append("w5_temp_w4_conflict_assertion_missing")
              for rel in PASSIVE:
                  data = git_bytes(repo, f"{checkout_sha}:{rel}")
                  if data is None:
                      errors.append(f"missing_source_blob {rel}")
                      continue
                  text = data.decode("utf-8")
                  if "new PrismaClient" in text or "process.env.DATABASE_URL" in text or "process.env.DIRECT_URL" in text:
                      errors.append(f"passive_violation {rel}")
                  if SECRETISH.search(text):
                      errors.append(f"secretish {rel}")
              return errors

          def norm_path(value):
              return str(value).replace("\\", "/")

          def classify(data, log_text):
              errors = []
              if not isinstance(data, dict):
                  return ["jest_json_missing"]
              required = (
                  "numFailedTestSuites",
                  "numFailedTests",
                  "numPassedTestSuites",
                  "numPassedTests",
                  "numPendingTestSuites",
                  "numPendingTests",
                  "numTodoTests",
                  "numTotalTestSuites",
                  "numTotalTests",
                  "testResults",
              )
              for key in required:
                  if key not in data:
                      errors.append(f"jest_field_missing {key}")
              if errors:
                  return errors
              if data["numTotalTestSuites"] != 18 or data["numPassedTestSuites"] != 18:
                  errors.append(
                      f"suite_count total={data['numTotalTestSuites']} passed={data['numPassedTestSuites']}"
                  )
              if data["numFailedTestSuites"] != 0 or data["numFailedTests"] != 0:
                  errors.append("failed_tests_present")
              if data["numPendingTests"] != 0 or data["numPendingTestSuites"] != 0 or data["numTodoTests"] != 0:
                  errors.append("pending_or_todo_present")
              if data["numPassedTests"] != 615 or data["numTotalTests"] != 615:
                  errors.append(
                      f"assertion_count passed={data['numPassedTests']} total={data['numTotalTests']}"
                  )
              results = data["testResults"]
              if not isinstance(results, list):
                  return errors + ["jest_test_results_not_list"]
              matched = {rel: [] for rel, _count in SUITES}
              for result in results:
                  name = norm_path(result.get("name", ""))
                  hit = None
                  for rel, _count in SUITES:
                      if name == rel or name.endswith("/" + rel):
                          hit = rel
                          break
                  if hit is None:
                      errors.append(f"unexpected_suite {name}")
                      continue
                  matched[hit].append(result)
                  if result.get("status") != "passed":
                      errors.append(f"suite_not_passed {hit} {result.get('status')}")
              for rel, hits in matched.items():
                  if len(hits) != 1:
                      errors.append(f"suite_membership {rel} count={len(hits)}")
              seen = []
              for rel, expected in SUITES:
                  hits = matched[rel]
                  if len(hits) != 1:
                      continue
                  rows = hits[0].get("assertionResults")
                  if not isinstance(rows, list):
                      errors.append(f"assertions_missing {rel}")
                      continue
                  identities = []
                  for row in rows:
                      status = row.get("status")
                      title = row.get("title")
                      ancestors = row.get("ancestorTitles")
                      if status != "passed":
                          errors.append(f"assertion_not_passed {rel} {status} {title}")
                      if not isinstance(title, str) or title == "":
                          errors.append(f"assertion_title_missing {rel}")
                          continue
                      if not isinstance(ancestors, list) or not ancestors:
                          errors.append(f"assertion_ancestors_missing {rel} {title}")
                          continue
                      identities.append((tuple(ancestors), title))
                  if len(rows) != expected:
                      errors.append(f"assertion_count {rel} {len(rows)} != {expected}")
                  counts = Counter(identities)
                  for identity, count in counts.items():
                      if count != 1:
                          errors.append(f"assertion_identity_duplicated {rel} {identity[1]} x{count}")
                  if rel.endswith("ml-cal-1-g4-windows-path-identity.test.ts"):
                      actual_cases = [(item[0][-1], item[1]) for item in identities]
                      if actual_cases != list(W5_CASES):
                          errors.append("w5_case_inventory_mismatch")
                  seen.extend(identities)
              cov_hits = []
              for line in log_text.splitlines():
                  if not line.lstrip().startswith("[W5 coverage]"):
                      continue
                  match = COV_LINE.fullmatch(line)
                  if match is None:
                      errors.append(f"coverage_line_malformed {line.strip()}")
                      continue
                  cov_hits.append(tuple(int(part) for part in match.groups()))
              if len(cov_hits) != 1:
                  errors.append(f"coverage_line_count {len(cov_hits)}")
                  return errors
              native, mocked, skipped, unverified = cov_hits[0]
              if native != 0:
                  errors.append(f"native_coverage_reported_as_pass native={native}")
              if (native, mocked, skipped, unverified) != LINUX_COUNTERS:
                  errors.append(
                      "linux_counters expected native=0 mocked=28 skipped=10 unverified=10 "
                      f"actual native={native} mocked={mocked} skipped={skipped} unverified={unverified}"
                  )
              reasons = []
              for line in log_text.splitlines():
                  if not line.lstrip().startswith("[W5] SKIPPED/UNVERIFIED:"):
                      continue
                  match = WARN_LINE.fullmatch(line)
                  if match is None:
                      errors.append(f"unavailable_reason_malformed {line.strip()}")
                      continue
                  reasons.append(match.group(1))
              if skipped != unverified:
                  errors.append(f"counter_inconsistent skipped={skipped} unverified={unverified}")
              if len(reasons) != unverified:
                  errors.append(f"reason_multiplicity warnings={len(reasons)} unverified={unverified}")
              if Counter(reasons) != Counter(LINUX_REASONS):
                  errors.append(f"linux_reasons actual={dict(Counter(reasons))}")
              return errors

          def load_event():
              event_name = os.environ.get("GITHUB_EVENT_NAME", "")
              path = os.environ.get("GITHUB_EVENT_PATH", "")
              payload = json.loads(Path(path).read_text(encoding="utf-8"))
              payload["event_name"] = event_name
              return payload

          def pin_main():
              event = load_event()
              checkout = git_text(".", ["rev-parse", "HEAD"])
              errors = verify(".", event, checkout)
              for error in errors:
                  print(f"integrity_error {error}")
              if errors:
                  print(f"integrity=FAIL count={len(errors)}")
                  return 1
              print("integrity=PASS")
              print("tests_not_started=true")
              return 0

          def classify_main():
              json_path = Path("jest-integrated.json")
              log_path = Path("jest-integrated.log")
              if not json_path.is_file():
                  print("integrity_error jest_json_missing")
                  return 1
              data = json.loads(json_path.read_text(encoding="utf-8"))
              log_text = log_path.read_text(encoding="utf-8", errors="replace") if log_path.is_file() else ""
              errors = classify(data, log_text)
              for error in errors:
                  print(f"classification_error {error}")
              if errors:
                  print(f"classification=FAIL count={len(errors)}")
                  return 1
              print("classification=PASS")
              print("linux_counters native=0 mocked=28 skipped=10 unverified=10")
              print("native_pass_not_claimed=true")
              return 0

          def main(argv):
              mode = argv[1] if len(argv) > 1 else ""
              if mode == "pin":
                  return pin_main()
              if mode == "classify":
                  return classify_main()
              print("refused_unknown_mode")
              return 1
          # INTEGRITY_IMPL_END
          sys.exit(main(sys.argv))
          PY
