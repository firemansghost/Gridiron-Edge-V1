          def git_bytes(repo, spec):
              proc = subprocess.run(
                  ["git", "-C", repo, "cat-file", "blob", spec],
                  capture_output=True,
              )
              if proc.returncode != 0:
                  return None
              return proc.stdout

          def git_text(repo, args):
              return subprocess.check_output(["git", "-C", repo, *args], text=True).strip()

          def worktree_errors(blob, disk, label):
              if blob is None:
                  return [f"missing_source_blob {label}"]
              if disk is None:
                  return [f"worktree_missing {label}"]
              if disk != blob:
                  return [f"worktree_mismatch {label}"]
              return []

          def pin_identity(data, oid, length, sha, label, actual_oid=None):
              if data is None:
                  return [f"missing_source_blob {label}"]
              if len(data) != length:
                  return [f"{label} bytes {len(data)} != {length}"]
              digest = hashlib.sha256(data).hexdigest()
              if digest != sha:
                  return [f"{label} sha256 {digest} != {sha}"]
              if actual_oid is not None and actual_oid != oid:
                  return [f"{label} blob {actual_oid} != {oid}"]
              return []

          def addition_errors(lines):
              expected = "A\t" + WORKFLOW_PATH
              if lines != [expected]:
                  return [f"workflow_addition expected [{expected!r}] actual={lines!r}"]
              return []

          def parent_order_errors(parents, base, head):
              if parents != [base, head]:
                  return [f"checkout_parents {parents} != [{base}, {head}]"]
              return []

          def direct_child_errors(parents):
              if parents != [REPAIR]:
                  return [f"source_head_parent {parents} != [{REPAIR}]"]
              return []

          def ancestry_errors(repo, source_head):
              errors = []
              for ancestor in ANCESTORS:
                  proc = subprocess.run(
