name: Inspect Generic Shadow T-30 Repository Vars (One Shot)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/advance-generic-shadow-t30-week5-once.yml'

permissions:
  contents: read

concurrency:
  group: inspect-generic-shadow-t30-vars-once
  cancel-in-progress: false

jobs:
  inspect:
    if: ${{ github.repository == 'firemansghost/Gridiron-Edge-V1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Report repository variable values
        env:
          ACTIVE_WEEK: ${{ vars.GENERIC_SHADOW_T30_AUTOMATION_V1_WEEK }}
          AUTOMATION_ENABLED: ${{ vars.GENERIC_SHADOW_T30_AUTOMATION_V1_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          echo "active_week=${ACTIVE_WEEK:-<unset>}"
          echo "automation_enabled=${AUTOMATION_ENABLED:-<unset>}"
          echo "mutation=false"
