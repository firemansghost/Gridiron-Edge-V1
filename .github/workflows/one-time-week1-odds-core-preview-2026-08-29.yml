# ONE-TIME production fallback for Saturday, August 29, 2026.
# Scheduled for 13:15 UTC = 08:15 America/Chicago (CDT).
# The date guard makes all non-2026-08-29 invocations a no-op before secrets/provider access.
#
# Authorized actions on the target date only:
#   1) append one fresh 2026 Week 1 live Odds snapshot (COMMIT)
#   2) if Odds succeeds, run Core V1 Week 1 tranche PREVIEW only
#
# NO Core Bet COMMIT. NO grading. NO ratings/Game/score writes.
# Remove this temporary workflow after the opening-weekend fallback is no longer needed.

name: One-Time Week 1 Odds + Core PREVIEW (Aug 29, 2026)

on:
  schedule:
    - cron: '15 13 29 8 *'

permissions:
  contents: read

concurrency:
  group: one-time-week1-odds-core-preview-2026-08-29
  cancel-in-progress: false

jobs:
  date_guard:
    name: One-time date guard
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
    steps:
      - name: Allow only 2026-08-29 UTC
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          TODAY_UTC="$(date -u +%F)"
          if [ "$TODAY_UTC" = "2026-08-29" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "One-time target date matched: ${TODAY_UTC}"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Outside one-time target date (${TODAY_UTC}); no provider or DB action will run."
          fi

  execute:
    name: Fresh Odds COMMIT then Core PREVIEW
    needs: date_guard
    if: needs.date_guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Preflight (names/presence only)
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          echo "ONE-TIME FALLBACK: 2026 Week 1"
          echo "target date: 2026-08-29 UTC"
          echo "scheduled target: 08:15 America/Chicago"
          echo "Odds: COMMIT append-only"
          echo "Core V1 card: PREVIEW only"
          echo "Core kickoff_before: 2026-09-01T00:00:00Z"
          echo "CFBD_API_KEY: not provided"
          echo "SGO_API_KEY: not provided"
          echo "VISUALCROSSING_API_KEY: not provided"
          if [ -z "${DIRECT_URL:-}" ]; then
            echo "::error::DIRECT_URL secret is missing"
            exit 1
          fi
          if [ -z "${ODDS_API_KEY:-}" ]; then
            echo "::error::ODDS_API_KEY secret is missing"
            exit 1
          fi
          echo "DIRECT_URL: present (value not printed)"
          echo "ODDS_API_KEY: present (value not printed)"

      - name: Install dependencies
        env:
          DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma_generate_placeholder
          DIRECT_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma_generate_placeholder
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma_generate_placeholder
          DIRECT_URL: postgresql://prisma:prisma@127.0.0.1:5432/prisma_generate_placeholder
        run: npm run prisma:generate

      - name: Append fresh Week 1 live Odds
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p reports
          npx tsx apps/jobs/write-live-odds-2026.ts \
            --season 2026 \
            --week 1 \
            --mode COMMIT \
            --confirm "WRITE_2026_WEEK_1_ODDS" \
            --report "reports/live-odds-2026-w1-commit.json"

      - name: Run fresh Core V1 opening-tranche PREVIEW
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          npx tsx apps/jobs/write-core-v1-weekly-card-2026.ts \
            --season 2026 \
            --week 1 \
            --mode PREVIEW \
            --kickoff-before "2026-09-01T00:00:00Z" \
            --report "reports/core-v1-weekly-card-2026-2026-week-1-preview.json"

      - name: Upload one-time audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-time-week1-odds-core-preview-2026-08-29
          path: reports/*.json
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          echo "============================================"
          echo "ONE-TIME WEEK 1 FALLBACK — AUG 29, 2026"
          echo "============================================"
          echo "Odds target: COMMIT append-only"
          echo "Core target: PREVIEW only"
          echo "Core Bet COMMIT: false"
          echo "kickoff_before: 2026-09-01T00:00:00Z"
          echo "scheduled target: 08:15 America/Chicago"
          echo "See uploaded JSON artifacts for exact provider/write/audit results."
          echo "============================================"
