name: Test Historical V2 Source Resolution

on:
  pull_request:
    paths:
      - 'research/historical/HISTORICAL_SOURCE_RESOLUTION_CONFIRMATION_V2_CONTRACT.md'
      - 'research/historical/HISTORICAL_VALIDATION_V1_CONTRACT.md'
      - 'apps/jobs/src/research/historical-source-resolution-v2.ts'
      - 'apps/jobs/run-historical-v2-source-resolution.ts'
      - 'apps/jobs/__tests__/historical-source-resolution-v2.test.ts'
      - '.github/workflows/test-historical-v2-source-resolution.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: TypeScript smoke compile
        run: |
          npx tsc --noEmit \
            --module commonjs \
            --moduleResolution node \
            --target ES2019 \
            --esModuleInterop \
            --skipLibCheck \
            apps/jobs/src/research/historical-source-resolution-v2.ts \
            apps/jobs/run-historical-v2-source-resolution.ts

      - name: Compile and start guarded V2 runtime without provider access
        run: |
          set -euo pipefail
          rm -rf .tmp/historical-v2-source-resolution
          npx tsc --module commonjs \
            --moduleResolution node \
            --target ES2019 \
            --esModuleInterop \
            --skipLibCheck \
            --outDir .tmp/historical-v2-source-resolution \
            apps/jobs/src/research/historical-source-resolution-v2.ts \
            apps/jobs/run-historical-v2-source-resolution.ts

          test -f .tmp/historical-v2-source-resolution/run-historical-v2-source-resolution.js

          set +e
          OUTPUT="$(node .tmp/historical-v2-source-resolution/run-historical-v2-source-resolution.js \
            --corpus-zip .tmp/does-not-exist-corpus.zip \
            --snapshot-zip .tmp/does-not-exist-snapshot.zip \
            --confirm RUN_HISTORICAL_V2_SOURCE_EQUIVALENCE_RECOVERY \
            --output-dir .tmp/no-v2-source-run 2>&1)"
          STATUS=$?
          set -e

          test "${STATUS}" -eq 1
          echo "${OUTPUT}" | grep -F "[historical-v2-source-resolution] corpus_zip_missing"

      - name: Test Historical V2 Source Resolution
        run: npx jest apps/jobs/__tests__/historical-source-resolution-v2.test.ts --runInBand
