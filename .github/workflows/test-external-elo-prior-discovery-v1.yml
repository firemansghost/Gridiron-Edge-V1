name: Test External Elo Prior Discovery V1

on:
  pull_request:
    paths:
      - 'research/candidate-b/EXTERNAL_ELO_PRIOR_DISCOVERY_V1_CONTRACT.md'
      - 'apps/jobs/src/research/candidate-b/external-elo-prior-discovery-v1.ts'
      - 'apps/jobs/capture-external-elo-prior-discovery-v1.ts'
      - 'apps/jobs/__tests__/external-elo-prior-discovery-v1.test.ts'
      - '.github/workflows/capture-external-elo-prior-discovery-v1.yml'
      - '.github/workflows/test-external-elo-prior-discovery-v1.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test External Elo Prior Discovery V1
        run: npx jest apps/jobs/__tests__/external-elo-prior-discovery-v1.test.ts --runInBand
