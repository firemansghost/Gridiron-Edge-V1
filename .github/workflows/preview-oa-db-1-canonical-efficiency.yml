name: Preview OA-DB-1 Canonical Efficiency (Manual, Guarded)

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: 'Exact current main SHA authorized for this PREVIEW'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: oa-db-1-canonical-efficiency-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      OA_ARCHIVE_ARTIFACT_ID: '11436781151'
      OA_ARCHIVE_SHA256: '0d5371f7dda6f95a14bbd4d40d7a04c442c998daa1a0e47a3459b76364631e10'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Source SHA guard
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "ACTUAL_SHA=${ACTUAL_SHA}" >> "$GITHUB_ENV"
          echo "actual_sha=${ACTUAL_SHA}"
          echo "expected_main_sha=${EXPECTED_MAIN_SHA}"
          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "::error::Refusing OA-DB-1 PREVIEW outside refs/heads/main."
            exit 1
          fi
          if [ -z "${EXPECTED_MAIN_SHA}" ] || [ "${ACTUAL_SHA}" != "${EXPECTED_MAIN_SHA}" ]; then
            echo "::error::Refusing OA-DB-1 PREVIEW because main SHA does not match expected_main_sha."
            exit 1
          fi
          echo "Source SHA guard passed."

      - name: Preflight
        run: |
          set -euo pipefail
          command -v curl >/dev/null
          command -v unzip >/dev/null
          command -v sha256sum >/dev/null
          echo "mode=PREVIEW"
          echo "sourceArtifactId=${OA_ARCHIVE_ARTIFACT_ID}"
          echo "providerCalls=0"
          echo "databaseWrites=false"
          echo "prismaMigrateInvoked=false"
          echo "legacyTeamGameStatsWrites=false"
          echo "gamesWrites=false"
          echo "marketReads=0"
          echo "outcomePerformanceReads=0"
          echo "planned2026Mutations=0"

      - name: Download accepted OA-DATA-1 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .research-inputs
          curl --fail --location --silent --show-error             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${OA_ARCHIVE_ARTIFACT_ID}/zip"             -o .research-inputs/oa-data-1-accepted.zip

      - name: Verify accepted archive ZIP hash
        run: |
          set -euo pipefail
          echo "${OA_ARCHIVE_SHA256}  .research-inputs/oa-data-1-accepted.zip" | sha256sum -c -

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma generate

      - name: Run OA-DB-1 PREVIEW
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          OUT="reports/oa-db-1-preview/${GITHUB_RUN_ID}"
          mkdir -p "${OUT}"
          npx tsx apps/jobs/preview-oa-db-1-canonical-efficiency.ts             --source-zip .research-inputs/oa-data-1-accepted.zip             --report "${OUT}/report.json"             --plan "${OUT}/planned_rows.json"

      - name: Upload OA-DB-1 PREVIEW evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oa-db-1-canonical-efficiency-preview-${{ github.run_id }}
          path: reports/oa-db-1-preview/**
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
          overwrite: false
          include-hidden-files: false

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          echo "==================================================="
          echo "OA-DB-1 CANONICAL EFFICIENCY PREVIEW"
          echo "==================================================="
          echo "status=${JOB_STATUS}"
          echo "expectedMainSha=${EXPECTED_MAIN_SHA}"
          echo "actualSha=${ACTUAL_SHA:-unavailable}"
          echo "mode=PREVIEW"
          echo "sourceArtifactId=${OA_ARCHIVE_ARTIFACT_ID}"
          echo "providerCalls=0"
          echo "databaseWrites=false"
          echo "prismaMigrateInvoked=false"
          echo "legacyTeamGameStatsWrites=false"
          echo "gamesWrites=false"
          echo "marketReads=0"
          echo "outcomePerformanceReads=0"
          echo "planned2026Mutations=0"
          echo "==================================================="
