# Manual GUARDED one-time write of 2026 FBS TeamMembership (138 rows).
# workflow_dispatch ONLY — no schedule, push, or pull_request.
# Requires exact confirmation WRITE_2026_FBS_MEMBERSHIP.
# Does not call CFBD/Odds. Does not run ratings/talent/stats. Does not modify Team rows.

name: Initialize 2026 FBS Membership (Manual, Guarded)

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season year (must be 2026)'
        required: true
        type: string
        default: '2026'
      confirm_write:
        description: 'Enter WRITE_2026_FBS_MEMBERSHIP exactly'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: init-2026-fbs-membership-${{ inputs.season }}
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DIRECT_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Preflight (names/presence only)
        run: |
          set -euo pipefail
          SEASON="${{ inputs.season }}"
          CONFIRM="${{ inputs.confirm_write }}"
          echo "season_input=${SEASON}"
          echo "confirm_write_received=${CONFIRM}"
          if [ "$SEASON" != "2026" ]; then
            echo "::error::season must equal 2026 (got ${SEASON})"
            exit 1
          fi
          if [ "$CONFIRM" != "WRITE_2026_FBS_MEMBERSHIP" ]; then
            echo "::error::confirm_write must be exactly WRITE_2026_FBS_MEMBERSHIP"
            exit 1
          fi
          if [ -z "${DIRECT_URL:-}" ] && [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DIRECT_URL / DATABASE_URL secret is missing"
            exit 1
          fi
          echo "CFBD_API_KEY: not provided"
          echo "ODDS_API_KEY: not provided"
          echo "DIRECT_URL: present (value not printed)"
          echo "mutation scope: TeamMembership inserts only (season=2026, level=fbs)"
          echo "ratings/talent/stats/Team updates: not invoked"
          echo "providers: not invoked"
          echo "migrations: not invoked"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Initialize 2026 FBS membership (guarded)
        run: |
          npx tsx apps/jobs/write-fbs-membership.ts \
            --season "${{ inputs.season }}" \
            --confirm-write "${{ inputs.confirm_write }}"

      - name: Summary
        if: always()
        run: |
          echo "============================================"
          echo "INITIALIZE 2026 FBS MEMBERSHIP (GUARDED)"
          echo "============================================"
          echo "season: ${{ inputs.season }}"
          echo "status: ${{ job.status }}"
          echo "mode: guarded TeamMembership insert only"
          echo "secrets used (names only): DIRECT_URL"
          echo "============================================"
