# Manual READ-ONLY probe of 2026 CFBD talent availability.
# workflow_dispatch ONLY — no schedule, push, or pull_request.
# Provider budget: exactly 1 CFBD call (GET /talent?year=2026).
# Does not write talent/commits/ratings. Does not call Odds. Does not call recruiting.

name: Probe 2026 Talent Availability (Manual, Read Only)

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season year (must be 2026)'
        required: true
        type: string
        default: '2026'

permissions:
  contents: read

concurrency:
  group: probe-2026-talent-availability-${{ inputs.season }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DIRECT_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      PROBE_SEASON: ${{ inputs.season }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Preflight (names/presence only)
        run: |
          set -euo pipefail
          SEASON="${PROBE_SEASON}"
          echo "season_input=${SEASON}"
          if [ "$SEASON" != "2026" ]; then
            echo "::error::season must equal 2026 (got ${SEASON})"
            exit 1
          fi
          if [ -z "${DIRECT_URL:-}" ] && [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DIRECT_URL / DATABASE_URL secret is missing"
            exit 1
          fi
          if [ -z "${CFBD_API_KEY:-}" ]; then
            echo "::error::CFBD_API_KEY secret is missing"
            exit 1
          fi
          echo "CFBD_API_KEY: present (value not printed)"
          echo "ODDS_API_KEY: not provided"
          echo "DIRECT_URL: present (value not printed)"
          echo "database mutations: not invoked"
          echo "talent/commit/ratings writes: not invoked"
          echo "provider budget: 1 CFBD call (/talent?year=2026)"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Probe 2026 talent availability (read-only)
        run: |
          set -euo pipefail
          npx tsx apps/jobs/probe-2026-talent-availability.ts --season "${PROBE_SEASON}" --preview

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          echo "============================================"
          echo "PROBE 2026 TALENT AVAILABILITY (READ ONLY)"
          echo "============================================"
          echo "season: ${PROBE_SEASON}"
          echo "status: ${{ job.status }}"
          echo "mode: probe only — no talent/ratings writes"
          echo "provider budget: 1"
          echo "secrets used (names only): DIRECT_URL, CFBD_API_KEY"
          echo "============================================"
