# LEGACY (<=2025) — Manual weekly bet sync (Hybrid V2 + Core V1 Card).
# workflow_dispatch ONLY. Do not add schedule triggers.
# 2026 operators: DO NOT USE. Use write-core-v1-weekly-card-2026.yml instead.
# This workflow rejects season >= 2026 in preflight.
# Does NOT run ingest, ratings, V3 totals, or V4/Fade V4.

name: "LEGACY (<=2025) Sync Weekly Bets (Manual)"

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season year (must be <= 2025; 2026+ blocked)'
        required: true
        default: '2025'
        type: string
      week:
        description: 'CFB week to sync (required)'
        required: true
        type: string

concurrency:
  group: sync-weekly-bets-${{ github.ref }}-${{ github.event.inputs.season }}-${{ github.event.inputs.week }}
  cancel-in-progress: true

jobs:
  sync-bets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DIRECT_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      TZ: America/Chicago
      SEASON: ${{ github.event.inputs.season }}
      WEEK: ${{ github.event.inputs.week }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Reject 2026+ (use guarded Core V1 weekly card)
        env:
          INPUT_SEASON: ${{ inputs.season }}
        run: |
          set -euo pipefail
          SEASON="$INPUT_SEASON"
          echo "LEGACY sync-weekly-bets — season=${SEASON}"
          if ! [[ "$SEASON" =~ ^[0-9]+$ ]]; then
            echo "::error::season must be an integer"
            exit 1
          fi
          if [ "$SEASON" -ge 2026 ]; then
            echo "::error::season ${SEASON} is blocked. For 2026 use workflow: Preview/Write 2026 Core V1 Weekly Card (Manual, Guarded)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Sync Hybrid V2 bets (hybrid_v2)
        run: |
          echo "🎯 Syncing Hybrid V2 bets for season $SEASON week $WEEK..."
          npx tsx apps/web/scripts/sync-hybrid-bets.ts "$SEASON" "$WEEK"
          echo "✅ Hybrid V2 sync complete"

      - name: Sync Core V1 Card bets (official_flat_100)
        run: |
          echo "📋 Syncing Core V1 Card bets for season $SEASON week $WEEK..."
          npx tsx apps/web/scripts/sync-official-picks-to-bets.ts "$SEASON" "$WEEK"
          echo "✅ Core V1 Card sync complete"

      - name: Sanity check (non-fatal)
        run: |
          npx tsx scripts/check-week-data.ts --season "$SEASON" --week "$WEEK" || echo "⚠️  Sanity check failed (non-fatal)"

      - name: Summary
        if: always()
        run: |
          echo "============================================"
          echo "LEGACY (<=2025) SYNC WEEKLY BETS SUMMARY"
          echo "============================================"
          echo "Season: $SEASON"
          echo "Week: $WEEK"
          echo "Strategy tags: hybrid_v2, official_flat_100"
          echo "Status: ${{ job.status }}"
          echo "============================================"
