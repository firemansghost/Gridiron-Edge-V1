name: Test Betting Ticket

on:
  pull_request:
    paths:
      - 'apps/web/lib/betting-ticket.ts'
      - 'apps/web/app/api/betting-ticket/route.ts'
      - 'apps/web/app/ticket/page.tsx'
      - 'apps/web/components/HeaderNav.tsx'
      - 'apps/web/__tests__/betting-ticket.test.ts'
      - '.github/workflows/test-betting-ticket.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run Betting Ticket tests
        run: npx jest apps/web/__tests__/betting-ticket.test.ts --runInBand
