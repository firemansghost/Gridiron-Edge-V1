# Validation-only CI for ML-CAL-1 Lifecycle Binding Sidecar V1.
# No DB, no secrets, no providers, no production writes, no live capture.

name: Test ML-CAL-1 Lifecycle Binding V1

on:
  pull_request:
    paths:
      - 'apps/jobs/lib/ml-cal-1-lifecycle-binding.ts'
      - 'apps/jobs/__tests__/ml-cal-1-lifecycle-binding.test.ts'
      - 'apps/jobs/__tests__/fixtures/packages/ml-cal-1-lifecycle-binding-week5-commit/**'
      - 'research/moneyline/ML_CAL_1_LIFECYCLE_BINDING_SIDECAR_V1_DESIGN.md'
      - 'research/moneyline/ML_CAL_1_LIFECYCLE_BINDING_SIDECAR_V1_RUNBOOK.md'
      - '.github/workflows/test-ml-cal-1-lifecycle-binding-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ML-CAL-1 lifecycle binding tests
        run: |
          npx jest --runInBand --runTestsByPath \
            apps/jobs/__tests__/ml-cal-1-lifecycle-binding.test.ts

      - name: Secret-free fixture digest check
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib
          root = pathlib.Path('apps/jobs/__tests__/fixtures/packages/ml-cal-1-lifecycle-binding-week5-commit')
          expected = {
            'archive.zip': 'b0177de089237876c2e258fb97d84af3803ef7d1e7402cae853670ee8a6cd316',
            'core-v1-lifecycle-2026-through-week-5-COMMIT.json': 'c20b789ce45b58362a23b2ab2a69184fda2a39377c99d58db6268376b79a2e1e',
          }
          for name, digest in expected.items():
            data = (root / name).read_bytes()
            got = hashlib.sha256(data).hexdigest()
            assert got == digest, f'{name}: {got} != {digest}'
            print(f'ok {name} {got}')
          PY
