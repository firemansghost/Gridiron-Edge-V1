name: Test Generic Shadow CORE_EVAL_V1

on:
  pull_request:
    paths:
      - 'research/generic-shadow/GENERIC_SHADOW_CORE_EVAL_V1_READONLY_CONTRACT.md'
      - 'apps/web/lib/generic-shadow-core-eval-v1.ts'
      - 'apps/web/__tests__/generic-shadow-core-eval-v1.test.ts'
      - 'apps/jobs/src/generic-shadow-core-eval-v1-adapter.ts'
      - 'apps/jobs/evaluate-generic-shadow-core-eval-v1-2026.ts'
      - 'apps/jobs/__tests__/generic-shadow-core-eval-v1-*.test.ts'
      - '.github/workflows/evaluate-generic-shadow-core-eval-v1-2026-manual.yml'
      - '.github/workflows/test-generic-shadow-core-eval-v1.yml'

permissions:
  contents: read

jobs:
  evaluator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Generic Shadow CORE_EVAL_V1
        run: |
          npx jest \
            apps/jobs/__tests__/generic-shadow-core-eval-v1-contract.test.ts \
            apps/web/__tests__/generic-shadow-core-eval-v1.test.ts \
            apps/jobs/__tests__/generic-shadow-core-eval-v1-adapter.test.ts \
            apps/jobs/__tests__/generic-shadow-core-eval-v1-workflow.test.ts \
            --runInBand
