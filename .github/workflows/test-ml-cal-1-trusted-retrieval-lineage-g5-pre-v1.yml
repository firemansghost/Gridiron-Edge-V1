# Validation-only CI for ML-CAL-1 G5-PRE offline trusted retrieval / lineage.
# No DB, no secrets, no providers, no production writes, no live retrieval.

name: Test ML-CAL-1 Trusted Retrieval Lineage G5-PRE

on:
  pull_request:
    paths:
      - 'apps/jobs/lib/ml-cal-1-trusted-retrieval-lineage-g5-pre.ts'
      - 'apps/jobs/lib/ml-cal-1-lifecycle-binding-observer.ts'
      - 'apps/jobs/lib/ml-cal-1-lifecycle-binding.ts'
      - 'apps/jobs/lib/ml-cal-1-capture.ts'
      - 'apps/jobs/lib/ml-cal-1-capture-binding-integration.ts'
      - 'apps/jobs/lib/ml-cal-1-capture-binding-fixture.ts'
      - 'apps/jobs/__tests__/ml-cal-1-trusted-retrieval-lineage-g5-pre.test.ts'
      - 'apps/jobs/__tests__/helpers/ml-cal-1-g5-pre-fixture-harness.ts'
      - 'apps/jobs/__tests__/fixtures/packages/ml-cal-1-g4-observer/**'
      - 'apps/jobs/__tests__/fixtures/packages/ml-cal-1-g5-pre/**'
      - 'research/moneyline/ML_CAL_1_TRUSTED_RETRIEVAL_LINEAGE_G5_*.md'
      - 'research/moneyline/ML_CAL_1_G5_PRE_*.md'
      - '.github/workflows/test-ml-cal-1-trusted-retrieval-lineage-g5-pre-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run G5-PRE fixture tests
        run: |
          npx jest --runInBand --runTestsByPath \
            apps/jobs/__tests__/ml-cal-1-trusted-retrieval-lineage-g5-pre.test.ts

      - name: Run accepted binding / G2 / G3 / G4 regressions
        run: |
          npx jest --runInBand --runTestsByPath \
            apps/jobs/__tests__/ml-cal-1-lifecycle-binding.test.ts \
            apps/jobs/__tests__/ml-cal-1-capture-binding-integration.test.ts \
            apps/jobs/__tests__/ml-cal-1-capture-binding-g3.test.ts \
            apps/jobs/__tests__/ml-cal-1-lifecycle-binding-observer-g4.test.ts

      - name: Secret-free digest + scan check
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, re
          root = pathlib.Path('apps/jobs/__tests__/fixtures/packages/ml-cal-1-g4-observer')
          expected = {
              'week5-commit/archive.zip': 'b0177de089237876c2e258fb97d84af3803ef7d1e7402cae853670ee8a6cd316',
              'week5-commit/core-v1-lifecycle-2026-through-week-5-COMMIT.json': 'c20b789ce45b58362a23b2ab2a69184fda2a39377c99d58db6268376b79a2e1e',
              'synthetic-w6/archive.zip': 'fc477ffdb0b3f306816988e988442f8f708304c94bbe1a6b4c336b93c8fa5d97',
              'synthetic-w6/core-v1-lifecycle-2026-through-week-6-COMMIT.json': '2dcbfe96023bf1273ff4a385aeaa3297afb99a9b3d2da80d5f87dd8e09024dab',
          }
          for name, digest in expected.items():
              got = hashlib.sha256((root / name).read_bytes()).hexdigest()
              assert got == digest, f'{name}: {got} != {digest}'
              print(f'ok {name} {got}')
          design_pin = 'bc292e06ce78531b7290833922abe4add9be3af854fe15c599d9bcd1dc1c7a8b'
          g4_tip = '6c2b31069b8805c7f2d171da1e04bf47885f237d'
          helper = pathlib.Path('apps/jobs/lib/ml-cal-1-trusted-retrieval-lineage-g5-pre.ts').read_text(encoding='utf-8')
          assert design_pin in helper, 'design pin missing from helper'
          assert g4_tip in helper, 'g4 tip missing from helper'
          print(f'ok design_pin {design_pin}')
          print(f'ok g4_tip {g4_tip}')
          secretish = re.compile(
              r'(?i)(api[_-]?key\s*[:=]\s*\S+|password\s*[:=]\s*\S+|bearer\s+[a-z0-9._-]{8,}|ghp_[A-Za-z0-9]+|'
              r'(DATABASE_URL|DIRECT_URL)\s*[:=]\s*\S+)'
          )
          for p in [
              pathlib.Path('apps/jobs/lib/ml-cal-1-trusted-retrieval-lineage-g5-pre.ts'),
              pathlib.Path('apps/jobs/__tests__/ml-cal-1-trusted-retrieval-lineage-g5-pre.test.ts'),
              pathlib.Path('apps/jobs/__tests__/helpers/ml-cal-1-g5-pre-fixture-harness.ts'),
              pathlib.Path('.github/workflows/test-ml-cal-1-trusted-retrieval-lineage-g5-pre-v1.yml'),
          ]:
              text = p.read_text(encoding='utf-8')
              assert not secretish.search(text), p
          print('ok secret-free scan')
          PY
