# Manual READ-ONLY audit of Core V1 season-aware conference source.
# workflow_dispatch ONLY — no schedule, push, or pull_request.
# Uses the same loadV1ConferenceMap path as compute_ratings_v1.
# No CFBD. No Odds. No ratings compute/persist. No Prisma Migrate.
# No conference initializer. No Team / TeamMembership writes.

name: Audit V1 Season Conference Source (Manual, Read Only)

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season year (default 2026)'
        required: true
        type: string
        default: '2026'

permissions:
  contents: read

concurrency:
  group: audit-v1-conference-source-${{ inputs.season }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DIRECT_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Preflight (names/presence only)
        env:
          TARGET_SEASON: ${{ inputs.season }}
        run: |
          set -euo pipefail
          echo "READ_ONLY=true"
          echo "providers=false"
          echo "ratingsCompute=false"
          echo "ratingsWrite=false"
          echo "mutationsInvoked=false"
          echo "targetSeason=${TARGET_SEASON}"

          if [ -z "${DIRECT_URL:-}" ] && [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DIRECT_URL / DATABASE_URL secret is missing"
            exit 1
          fi

          echo "CFBD_API_KEY: not provided"
          echo "ODDS_API_KEY: not provided"
          echo "DIRECT_URL: present (value not printed)"
          echo "prisma migrate: not invoked"
          echo "conference initializer: not invoked"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Audit V1 conference source (read-only)
        env:
          TARGET_SEASON: ${{ inputs.season }}
        run: |
          set -euo pipefail
          npx tsx apps/jobs/audit-v1-conference-source.ts --season "$TARGET_SEASON"

      - name: Summary
        if: always()
        env:
          TARGET_SEASON: ${{ inputs.season }}
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "============================================"
          echo "AUDIT V1 SEASON CONFERENCE SOURCE (READ ONLY)"
          echo "============================================"
          printf 'targetSeason: %s\n' "$TARGET_SEASON"
          printf 'status: %s\n' "$JOB_STATUS"
          echo "READ_ONLY=true"
          echo "providers=false"
          echo "ratingsCompute=false"
          echo "ratingsWrite=false"
          echo "mutationsInvoked=false"
          echo "secrets used (names only): DIRECT_URL"
          echo "============================================"
