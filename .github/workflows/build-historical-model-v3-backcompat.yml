name: Build Historical Model V3 Backcompat (Manual, Guarded)

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: 'Exact current main SHA'
        required: true
        type: string
      confirmation:
        description: 'Type BUILD_HISTORICAL_MODEL_V3_BACKCOMPAT exactly'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-model-v3-backcompat
  cancel-in-progress: false

env:
  FEATURE_ARTIFACT_ID: '11000651389'
  FEATURE_ZIP_SHA256: '047220307750b755d1e6d626628802baf818dbd70ffde9252e63768e7a823ad2'
  CORPUS_ARTIFACT_ID: '10997010171'
  CORPUS_ZIP_SHA256: 'cea83762d2b6e492caec680a74a085ef5a5e283c36a402ef4b35acbe2ce22b7d'
  V1_MODEL_ARTIFACT_ID: '11002393824'
  V1_MODEL_ZIP_SHA256: 'bb0a9233c4de18c317b35d13cc6bacefadc4e359fe4de8e52addad3ec523e313'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Source SHA and confirmation guard
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "ACTUAL_SHA=${ACTUAL_SHA}" >> "$GITHUB_ENV"

          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "::error::Refusing V3 backcompat build outside refs/heads/main."
            exit 1
          fi
          if [ -z "${EXPECTED_MAIN_SHA}" ] || [ "${ACTUAL_SHA}" != "${EXPECTED_MAIN_SHA}" ]; then
            echo "::error::Refusing V3 backcompat build because main SHA does not match expected_main_sha."
            exit 1
          fi
          if [ "${INPUT_CONFIRMATION}" != "BUILD_HISTORICAL_MODEL_V3_BACKCOMPAT" ]; then
            echo "::error::Exact V3 backcompat confirmation is required."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Preflight
        run: |
          set -euo pipefail
          command -v curl >/dev/null
          command -v unzip >/dev/null
          command -v sha256sum >/dev/null
          echo "mode=ARTIFACT_ONLY_OFFLINE_V3_MODEL_BACKCOMPAT"
          echo "providerCalls=0"
          echo "marketReads=0"
          echo "validation2024Reads=0"
          echo "holdout2025Reads=0"
          echo "databaseReads=false"
          echo "databaseWrites=false"
          echo "prisma=false"

      - name: Download frozen development artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .research-inputs
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts"

          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${API}/${FEATURE_ARTIFACT_ID}/zip" \
            -o .research-inputs/historical-feature-v1-36489184409.zip

          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${API}/${CORPUS_ARTIFACT_ID}/zip" \
            -o .research-inputs/historical-development-corpus-v1-36479515332.zip

          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${API}/${V1_MODEL_ARTIFACT_ID}/zip" \
            -o .research-inputs/historical-model-development-v1-36494166168.zip

      - name: Verify frozen ZIP hashes
        run: |
          set -euo pipefail
          echo "${FEATURE_ZIP_SHA256}  .research-inputs/historical-feature-v1-36489184409.zip" | sha256sum -c -
          echo "${CORPUS_ZIP_SHA256}  .research-inputs/historical-development-corpus-v1-36479515332.zip" | sha256sum -c -
          echo "${V1_MODEL_ZIP_SHA256}  .research-inputs/historical-model-development-v1-36494166168.zip" | sha256sum -c -

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Compile V3 model runtime
        run: |
          set -euo pipefail
          rm -rf .tmp/historical-model-v3
          npx tsc --module commonjs \
            --moduleResolution node \
            --target ES2019 \
            --esModuleInterop \
            --skipLibCheck \
            --outDir .tmp/historical-model-v3 \
            apps/jobs/src/research/historical-model-development-v1.ts \
            apps/jobs/src/research/historical-model-v3.ts \
            apps/jobs/run-historical-model-v3-backcompat.ts

      - name: Build and audit V3 compatibility
        env:
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          OUT="reports/historical-model-v3-backcompat/${GITHUB_RUN_ID}"
          node .tmp/historical-model-v3/run-historical-model-v3-backcompat.js \
            --feature-zip .research-inputs/historical-feature-v1-36489184409.zip \
            --corpus-zip .research-inputs/historical-development-corpus-v1-36479515332.zip \
            --v1-model-zip .research-inputs/historical-model-development-v1-36494166168.zip \
            --confirm "${INPUT_CONFIRMATION}" \
            --output-dir "${OUT}"

      - name: Upload immutable V3 backcompat evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-model-v3-backcompat-${{ github.run_id }}
          path: reports/historical-model-v3-backcompat/**
          if-no-files-found: warn
          retention-days: 90

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "==================================================="
          echo "HISTORICAL MODEL V3 BACKCOMPAT"
          echo "==================================================="
          echo "status=${JOB_STATUS}"
          echo "sourceSha=${ACTUAL_SHA:-unavailable}"
          echo "providerCalls=0"
          echo "marketReads=0"
          echo "2024 reads=0"
          echo "2025 reads=0"
          echo "database reads/writes=false/false"
          echo "==================================================="
