name: Run Historical V3 Week Query Qualification Recovery (Manual, Guarded)

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: 'Exact current main SHA'
        required: true
        type: string
      confirmation:
        description: 'Type RUN_HISTORICAL_V3_WEEK_QUERY_QUALIFICATION_RECOVERY exactly'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-v3-week-query-resolution
  cancel-in-progress: false

env:
  CORPUS_ARTIFACT_ID: '10997010171'
  CORPUS_ZIP_SHA256: 'cea83762d2b6e492caec680a74a085ef5a5e283c36a402ef4b35acbe2ce22b7d'
  SNAPSHOT_ARTIFACT_ID: '11008470975'
  SNAPSHOT_ZIP_SHA256: 'b41e934b26952100e7e056a56114dc81df6bbe77f5c787f28b75b646ae7ea544'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Source SHA and confirmation guard
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "ACTUAL_SHA=${ACTUAL_SHA}" >> "$GITHUB_ENV"

          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "::error::Refusing V3 week-query run outside refs/heads/main."
            exit 1
          fi
          if [ -z "${EXPECTED_MAIN_SHA}" ] || [ "${ACTUAL_SHA}" != "${EXPECTED_MAIN_SHA}" ]; then
            echo "::error::Refusing V3 week-query run because main SHA does not match expected_main_sha."
            exit 1
          fi
          if [ "${INPUT_CONFIRMATION}" != "RUN_HISTORICAL_V3_WEEK_QUERY_QUALIFICATION_RECOVERY" ]; then
            echo "::error::Exact V3 week-query confirmation is required."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Preflight
        run: |
          set -euo pipefail
          command -v curl >/dev/null
          command -v unzip >/dev/null
          command -v sha256sum >/dev/null
          echo "mode=SAME_ENDPOINT_WEEK_QUERY_QUALIFICATION_RECOVERY_RESEARCH_ONLY"
          echo "endpoint=/stats/game/advanced"
          echo "qualificationCalls=8"
          echo "recoveryCalls=0 unless exact qualification PASS; otherwise 3"
          echo "maxProviderCalls=11"
          echo "marketReads=0"
          echo "ppaSidecarReads=0"
          echo "outcomeScoringReads=0"
          echo "2025 reads=0"
          echo "databaseReads=false"
          echo "databaseWrites=false"

      - name: Download frozen source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .research-inputs
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts"

          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json"             "${API}/${CORPUS_ARTIFACT_ID}/zip"             -o .research-inputs/historical-development-corpus-v1.zip

          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json"             "${API}/${SNAPSHOT_ARTIFACT_ID}/zip"             -o .research-inputs/historical-research-snapshot-v1-2024.zip

      - name: Verify frozen ZIP hashes
        run: |
          set -euo pipefail
          echo "${CORPUS_ZIP_SHA256}  .research-inputs/historical-development-corpus-v1.zip" | sha256sum -c -
          echo "${SNAPSHOT_ZIP_SHA256}  .research-inputs/historical-research-snapshot-v1-2024.zip" | sha256sum -c -

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Compile V3 week-query runtime
        run: |
          set -euo pipefail
          rm -rf .tmp/historical-v3-week-query
          npx tsc --module commonjs             --moduleResolution node             --target ES2019             --esModuleInterop             --skipLibCheck             --outDir .tmp/historical-v3-week-query             apps/jobs/src/research/historical-v3-week-query-resolution.ts             apps/jobs/run-historical-v3-week-query-resolution.ts

      - name: Run qualification and conditional recovery
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          OUT="reports/historical-v3-week-query-resolution/${GITHUB_RUN_ID}"
          node .tmp/historical-v3-week-query/run-historical-v3-week-query-resolution.js             --corpus-zip .research-inputs/historical-development-corpus-v1.zip             --snapshot-zip .research-inputs/historical-research-snapshot-v1-2024.zip             --confirm "${INPUT_CONFIRMATION}"             --output-dir "${OUT}"

      - name: Upload immutable V3 week-query evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-v3-week-query-resolution-${{ github.run_id }}
          path: reports/historical-v3-week-query-resolution/**
          if-no-files-found: warn
          retention-days: 90

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "==================================================="
          echo "HISTORICAL V3 WEEK QUERY QUALIFICATION / RECOVERY"
          echo "==================================================="
          echo "status=${JOB_STATUS}"
          echo "sourceSha=${ACTUAL_SHA:-unavailable}"
          echo "endpoint=/stats/game/advanced"
          echo "qualificationCalls=8 when execution reaches provider stage"
          echo "recoveryCalls=0 on rejection; 3 only on exact qualification PASS"
          echo "maxProviderCalls=11"
          echo "marketReads=0"
          echo "ppaSidecarReads=0"
          echo "outcomeScoringReads=0"
          echo "2025 reads=0"
          echo "database reads/writes=false/false"
          echo "==================================================="
